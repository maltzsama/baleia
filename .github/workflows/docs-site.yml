name: Docs site

# The documentation site (website/, Docusaurus) renders docs/. Pull requests
# that touch either build it, so a broken link or page fails before merge;
# main publishes it to GitHub Pages.
on:
  pull_request:
    paths:
      ['docs/**', 'website/**', '.release-please-manifest.json', '.github/workflows/docs-site.yml']
  push:
    branches: [main]
    paths:
      ['docs/**', 'website/**', '.release-please-manifest.json', '.github/workflows/docs-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so lastmod and "last updated" come from real git dates.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Umami website id: the repository secret of the same name. It ends up
          # in the public HTML, so masking it in the logs is the only effect.
          UMAMI: ${{ secrets.UMAMI }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Tell IndexNow search engines (Bing, Yandex and others; Google does not
      # use it) which URLs to crawl. The key is public by design: the same value
      # is served as website/static/<key>.txt. A failure here never fails the
      # deploy.
      - name: Submit the sitemap to IndexNow
        continue-on-error: true
        env:
          HOST: baleia.galileostd.io
          INDEXNOW_KEY: 53b730d34ac95d31ca8ae6efe32952eb
        run: |
          curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -Rn '{host: env.HOST, key: env.INDEXNOW_KEY, keyLocation: "https://\(env.HOST)/\(env.INDEXNOW_KEY).txt", urlList: [inputs]}' \
            | curl -fsS -X POST https://api.indexnow.org/IndexNow \
                -H 'Content-Type: application/json; charset=utf-8' --data @- -w 'IndexNow: HTTP %{http_code}\n'

name: Web E2E

on:
  pull_request:
    paths:
      - "web/**"
      - "api/swagger.yaml"
      - "cmd/e2e-seed/**"
      - "deploy/**"
      - "internal/bigateway/**"
      - "internal/config/**"
      - "internal/server/**"
      - "scripts/bi-e2e/**"
      - ".github/workflows/web-e2e.yml"
      - ".github/actions/setup-minikube/**"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright on minikube
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Trino JDBC e2e client (make e2e-bi) needs a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: ./.github/actions/setup-minikube

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The browser build follows the installed Playwright release, so the
      # cache is keyed on it and a Playwright bump downloads a fresh Chromium.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner image already ships Chromium's shared libraries; --with-deps
      # only adds optional fonts through apt, whose mirrors fail DNS often
      # enough to block the job. No spec compares screenshots, so skip apt.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: Start minikube, seed and run Playwright
        run: make e2e
        env:
          E2E_PASSWORD: e2e-password
          K8S_CPUS: "4"
          K8S_MEMORY: "10g"
          K8S_DRIVER: docker

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n baleia-dev get pods -o wide || true
          kubectl -n baleia-dev get events --sort-by=.lastTimestamp || true
          kubectl -n baleia-dev logs -l app.kubernetes.io/name=baleia --all-containers --tail=200 || true

  # Scheduled runs only: a failed pull request run is already visible on the PR.
  report:
    name: Report nightly failure
    needs: e2e
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/report-nightly-failure

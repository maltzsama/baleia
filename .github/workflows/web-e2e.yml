name: Web E2E

on:
  pull_request:
    paths:
      - "web/**"
      - "api/swagger.yaml"
      - "cmd/e2e-seed/**"
      - "deploy/**"
      - "internal/bigateway/**"
      - "internal/config/**"
      - "internal/server/**"
      - "scripts/bi-e2e/**"
      - ".github/workflows/web-e2e.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright on minikube
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Trino JDBC e2e client (make e2e-bi) needs a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install minikube, kubectl and helm
        run: |
          curl -fsSLo /tmp/minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install -m 0755 /tmp/minikube /usr/local/bin/minikube
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The runner image already ships Chromium's shared libraries; --with-deps
      # only adds optional fonts through apt, whose mirrors fail DNS often
      # enough to block the job. No spec compares screenshots, so skip apt.
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium

      - name: Start minikube, seed and run Playwright
        run: make e2e
        env:
          E2E_PASSWORD: e2e-password
          K8S_CPUS: "4"
          K8S_MEMORY: "10g"
          K8S_DRIVER: docker

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n baleia-dev get pods -o wide || true
          kubectl -n baleia-dev get events --sort-by=.lastTimestamp || true
          kubectl -n baleia-dev logs -l app.kubernetes.io/name=baleia --all-containers --tail=200 || true

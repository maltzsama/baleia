name: K8s Smoke

# The API-level smoke test from #64, run on the same minikube dev stack as the
# Playwright suite. Not per-PR: the chart job validates the manifests on every
# PR, while this proves a real cluster can boot, seed and answer a query.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: API smoke on minikube
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/setup-minikube

      - name: Bring the stack up
        run: make k8s-up
        env:
          K8S_CPUS: "4"
          K8S_MEMORY: "10g"
          K8S_DRIVER: docker

      - name: Run the smoke test
        run: |
          make k8s-forward &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          STACK=k8s ./scripts/smoke.sh
        env:
          K8S_CPUS: "4"
          K8S_MEMORY: "10g"
          K8S_DRIVER: docker

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n baleia-dev get pods -o wide || true
          kubectl -n baleia-dev get events --sort-by=.lastTimestamp || true
          kubectl -n baleia-dev logs -l app.kubernetes.io/name=baleia --all-containers --tail=200 || true
          echo "== errors and warnings"
          for d in baleia-api baleia-worker; do
            echo "-- $d"
            kubectl -n baleia-dev logs deploy/$d --tail=2000 | grep -E '"level":"(ERROR|WARN)"' | tail -20 || true
          done
          echo "-- baleia-trino failed queries"
          kubectl -n baleia-dev logs deploy/baleia-trino --tail=3000 | grep -E 'FAILED|Query .* failed' | tail -10 || true

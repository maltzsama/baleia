name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # DB-backed tests (internal/testdb) fail instead of skipping when CI=true.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: baleia_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          BALEIA_TEST_DATABASE_URL: postgres://postgres:baleia_dev@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race ./...

  # Existing findings are a baseline: only issues new since the merge base
  # with main fail the job (#369).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --new-from-merge-base=origin/main

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Baleia's half of the registry contract against the fixtures of the pinned
  # plugin release (#39): the Makefile's BALEIA_PLUGIN_VERSION.
  contract:
    name: Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: baleia_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch the contract of the pinned plugin release
        run: make contract-fetch
      - name: Contract tests
        env:
          BALEIA_TEST_DATABASE_URL: postgres://postgres:baleia_dev@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -count=1 -tags contract -v ./internal/contract/...

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADR cross-links
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: only links between repository files; external URLs are not checked.
          args: --offline --no-progress --include-fragments 'docs/**/*.md'
          fail: true

  prometheus:
    name: Prometheus rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -sSLo /tmp/prometheus.tgz https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tgz -C /tmp prometheus-3.5.0.linux-amd64/promtool
          sudo install -m 0755 /tmp/prometheus-3.5.0.linux-amd64/promtool /usr/local/bin/promtool
      - name: Check and test alerting rules
        run: |
          promtool check rules deploy/prometheus/alerts.yml
          promtool test rules deploy/prometheus/alerts_test.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./cmd/...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: API schema is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart (dev values + defaults)
        run: |
          helm lint deploy/helm/baleia --strict \
            --set secrets.create=true --set secrets.values.JWT_SECRET=abcdef0123456789abcdef --set secrets.values.BALEIA_ENCRYPTION_KEY=fedcba9876543210fedcba9876543210 --set secrets.values.DATABASE_URL=postgresql://b
          helm lint deploy/helm/baleia --strict --set existingSecret=x
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate rendered manifests
        run: |
          helm template baleia deploy/helm/baleia \
            --set secrets.create=true --set secrets.values.JWT_SECRET=abcdef0123456789abcdef --set secrets.values.BALEIA_ENCRYPTION_KEY=fedcba9876543210fedcba9876543210 --set secrets.values.DATABASE_URL=postgresql://b \
            | kubeconform -strict -summary -ignore-missing-schemas
          helm template baleia deploy/helm/baleia --set existingSecret=x | kubeconform -strict -summary -ignore-missing-schemas
          kubectl kustomize deploy/dev | kubeconform -strict -summary -ignore-missing-schemas
      - name: Verify tracked dev files are in sync
        run: ./scripts/verify-dev-sync.sh

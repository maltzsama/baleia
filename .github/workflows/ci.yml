name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to a pull request supersedes the run in flight. Pushes to main and
# develop get a group per commit: a shared group would cancel queued runs even
# without cancel-in-progress, and every commit there keeps its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # DB-backed tests (internal/testdb) fail instead of skipping when CI=true.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: baleia_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: baleia_dev
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbaleia_dev" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: baleia_dev
          MARIADB_ROOT_HOST: "%"
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          BALEIA_TEST_DATABASE_URL: postgres://postgres:baleia_dev@127.0.0.1:5432/postgres?sslmode=disable
          BALEIA_TEST_MYSQL_URL: mysql://root:baleia_dev@127.0.0.1:3306
          BALEIA_TEST_MARIADB_URL: mysql://root:baleia_dev@127.0.0.1:3307
          BALEIA_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        # Tests are independent and parallel (#374): a random order keeps them so.
        # The suite creates a migrated database per test (testdb.maxTests=4), so
        # the default 10m per-package timeout is too tight for internal/api;
        # 30m gives headroom without masking a real hang. The store suite runs
        # in the Store job, once per backend.
        run: |
          go test -race -shuffle=on -timeout 30m \
            $(go list ./... | grep -vE '/internal/store(/|$)|/internal/persistence/partitioning$')

  # The store supports Postgres, MySQL and MariaDB through the same single
  # DATABASE_URL contract: the DSN picks the dialector. This job points that
  # one variable at each server and runs the whole store suite on it, not a
  # selection: a selection let two broken unique keys, a 128 character cap on the
  # query history and a foreign key that MySQL checks row by row go unnoticed.
  store:
    name: Store (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            image: postgres:18
            port: 5432
            health: pg_isready -U postgres
            url: postgres://postgres:baleia_dev@127.0.0.1:5432/postgres?sslmode=disable
          - db: mysql
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -pbaleia_dev
            url: root:baleia_dev@tcp(127.0.0.1:3306)/
          - db: mariadb
            image: mariadb:11.4
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: root:baleia_dev@tcp(127.0.0.1:3306)/
    services:
      db:
        image: ${{ matrix.image }}
        # Each image reads only its own variables and ignores the others.
        env:
          POSTGRES_PASSWORD: baleia_dev
          MYSQL_ROOT_PASSWORD: baleia_dev
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_PASSWORD: baleia_dev
          MARIADB_ROOT_HOST: "%"
        ports: ["${{ matrix.port }}:${{ matrix.port }}"]
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Store suite
        env:
          BALEIA_TEST_DATABASE_URL: ${{ matrix.url }}
        run: go test -race -shuffle=on -count=1 -timeout 60m ./internal/store/... ./internal/persistence/partitioning

  # Existing findings are a baseline: only new issues fail the job (#369). A
  # pull request is compared with its merge base on main; a push with the
  # commit before it (a branch's first push has none and falls back).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: >-
            ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
            && format('--new-from-rev={0}', github.event.before)
            || '--new-from-merge-base=origin/main' }}

  # Scans with the latest 1.26 patch, the Go the release image builds with
  # (golang:1.26-alpine), so a standard-library fix only needs a rebuild.
  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Baleia's half of the registry contract against the fixtures of the pinned
  # plugin release (#39): the Makefile's BALEIA_PLUGIN_VERSION.
  contract:
    name: Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: baleia_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch the contract of the pinned plugin release
        run: make contract-fetch
      - name: Contract tests
        env:
          BALEIA_TEST_DATABASE_URL: postgres://postgres:baleia_dev@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -count=1 -tags contract -v ./internal/contract/...

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADR cross-links
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: only links between repository files; external URLs are not checked.
          args: --offline --no-progress --include-fragments 'docs/**/*.md'
          fail: true

  prometheus:
    name: Prometheus rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -sSLo /tmp/prometheus.tgz https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tgz -C /tmp prometheus-3.5.0.linux-amd64/promtool
          sudo install -m 0755 /tmp/prometheus-3.5.0.linux-amd64/promtool /usr/local/bin/promtool
      - name: Check and test alerting rules
        run: |
          promtool check rules deploy/prometheus/alerts.yml
          promtool test rules deploy/prometheus/alerts_test.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./cmd/...

  # The release publishes amd64 and arm64 (#516); build both here so an
  # ARM-only break shows up on the PR, not at release time. Nothing is pushed.
  image:
    name: Image (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: API schema is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart (dev values + defaults)
        run: |
          helm lint deploy/helm/baleia --strict \
            --set secrets.create=true --set secrets.values.JWT_SECRET=abcdef0123456789abcdef --set secrets.values.BALEIA_ENCRYPTION_KEY=fedcba9876543210fedcba9876543210 --set secrets.values.DATABASE_URL=postgresql://b
          helm lint deploy/helm/baleia --strict --set existingSecret=x
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate rendered manifests
        run: |
          helm template baleia deploy/helm/baleia \
            --set secrets.create=true --set secrets.values.JWT_SECRET=abcdef0123456789abcdef --set secrets.values.BALEIA_ENCRYPTION_KEY=fedcba9876543210fedcba9876543210 --set secrets.values.DATABASE_URL=postgresql://b \
            | kubeconform -strict -summary -ignore-missing-schemas
          helm template baleia deploy/helm/baleia --set existingSecret=x | kubeconform -strict -summary -ignore-missing-schemas
          helm template baleia deploy/helm/baleia --set existingSecret=x \
            --set biGateway.enabled=true --set biGateway.publicURL=https://bi.example.com \
            --set biGateway.ingress.enabled=true --set biGateway.ingress.className=nginx \
            --set 'biGateway.ingress.hosts[0]=bi.example.com' \
            | kubeconform -strict -summary -ignore-missing-schemas
          kubectl kustomize deploy/dev | kubeconform -strict -summary -ignore-missing-schemas
      - name: Verify tracked dev files are in sync
        run: ./scripts/verify-dev-sync.sh

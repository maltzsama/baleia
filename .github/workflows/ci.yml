name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./cmd/...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart (dev values + defaults)
        run: |
          helm lint deploy/helm/baleia --strict \
            --set secrets.create=true --set secrets.values.JWT_SECRET=abcdef0123456789abcdef --set secrets.values.DATABASE_URL=postgresql://b
          helm lint deploy/helm/baleia --strict --set existingSecret=x
      - name: Install kubeconform
        run: |
          curl -sSLo /usr/local/bin/kubeconform https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64
          chmod +x /usr/local/bin/kubeconform
      - name: Validate rendered manifests
        run: |
          helm template baleia deploy/helm/baleia \
            --set secrets.create=true --set secrets.values.JWT_SECRET=abcdef0123456789abcdef --set secrets.values.DATABASE_URL=postgresql://b \
            | kubeconform -strict -summary -ignore-missing-schemas
          helm template baleia deploy/helm/baleia --set existingSecret=x | kubeconform -strict -summary -ignore-missing-schemas

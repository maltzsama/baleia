name: OpenMetadata E2E

# OpenMetadata discovering Baleia through the BI gateway (#1122, #1135): the
# stock Trino connector ingests the seeded tables, and the semantic catalog
# routes (ADR 0030) name the same tables. Not per-PR: the quickstart is
# heavyweight, so it runs nightly and on demand, one OpenMetadata release per
# runner.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  openmetadata:
    name: OpenMetadata ${{ matrix.openmetadata }} on minikube
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        openmetadata: ["2.0.9", "2.1.0"]
    env:
      K8S_CPUS: "3"
      K8S_MEMORY: "8g"
      K8S_DRIVER: docker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/setup-minikube

      - name: Bring the stack up
        run: make k8s-up

      - name: Seed the stack
        run: make e2e-seed

      - name: OpenMetadata ${{ matrix.openmetadata }} harness
        run: make e2e-openmetadata OPENMETADATA_VERSIONS=${{ matrix.openmetadata }}

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n baleia-dev get pods -o wide || true
          kubectl -n baleia-dev logs deploy/baleia-api --tail=300 | grep -E '"level":"(ERROR|WARN)"' | tail -30 || true

  # Scheduled runs only: a manual run's failure is visible where it was started.
  report:
    name: Report nightly failure
    needs: openmetadata
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/report-nightly-failure

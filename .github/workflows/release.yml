name: Release

# A release is cut only from a commit whose full CI run (race detector,
# shuffle, every store backend) passed: this workflow starts when CI finishes
# on a push to main, instead of racing it with a weaker test of its own.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      ${{ github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release PR is recognised by the body release-please writes. If a bot
      # (e.g. a PR-summary app) rewrites that body, release-please cannot tell
      # the merged PR was a release: it creates no tag and reopens the next
      # release with every commit since the bootstrap SHA. Fail loudly instead
      # of silently shipping a wrong changelog.
      - name: Verify a merged release PR produced a release
        if: "${{ contains(github.event.workflow_run.head_commit.message, 'chore(main): release') && steps.release.outputs.release_created != 'true' }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A concurrent run (for the commit immediately before the release PR)
          # may have created the release first. That is fine: check the tag.
          version=$(gh api "repos/${{ github.repository }}/contents/.release-please-manifest.json?ref=main" \
            -H "Accept: application/vnd.github.raw" | jq -r '.["."]')
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            exit 0
          fi
          echo "::error::A release PR was merged but release-please did not create a release/tag."
          echo "Check that no bot rewrote the release PR body: release-please needs its marker to recognise the merge."
          exit 1

  docker:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          tag="${{ inputs.tag || needs.release-please.outputs.tag_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.rel.outputs.tag }}

      # Stamp the commit the tag points at: main may have moved past the commit
      # whose CI run started this workflow, and a dispatch runs from main's head.
      - name: Resolve the tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # arm64 too, for ARM node pools (#516).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            COMMIT=${{ steps.commit.outputs.sha }}

  chart:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release upload
      packages: write   # OCI chart push
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          tag="${{ inputs.tag || needs.release-please.outputs.tag_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - uses: azure/setup-helm@v5

      - name: Package the chart
        run: |
          mkdir -p dist
          helm package deploy/helm/baleia \
            --version "${{ steps.rel.outputs.version }}" \
            --app-version "${{ steps.rel.outputs.version }}" \
            --destination dist

      - name: Publish the chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/baleia-${{ steps.rel.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.rel.outputs.tag }}" "dist/baleia-${{ steps.rel.outputs.version }}.tgz" --clobber

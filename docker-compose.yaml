networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  icebergdata:
  ceph-data:
  postgres-data:

services:

  # STORAGE LAYER - Ceph RGW (S3-compatible, all-in-one demo)
  # RGW listens on :8080 inside the container (exposed on host :8333).
  # Static IP + MON_IP required by the demo entrypoint; hostname/alias "ceph"
  # so the demo's internal s3cmd can resolve the RGW endpoint.
  ceph:
    image: quay.io/ceph/demo:latest
    platform: linux/amd64
    container_name: baleia_ceph
    hostname: ceph
    environment:
      - MON_IP=172.28.0.10
      - CEPH_PUBLIC_NETWORK=172.28.0.0/16
      - RGW_NAME=ceph
      - CEPH_DEMO_UID=baleia
      - CEPH_DEMO_ACCESS_KEY=seaweedfs
      - CEPH_DEMO_SECRET_KEY=seaweedfs
      - CEPH_DEMO_BUCKET=baleia
    ports:
      - "8333:8080"   # S3 API (host:container)
    volumes:
      - ceph-data:/var/lib/ceph
    networks:
      app_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # DATABASE - CockroachDB (single node dev)
  postgres:
    image: postgres:18
    container_name: baleia_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=baleia
      - POSTGRES_PASSWORD=baleia
      - POSTGRES_DB=baleia
    volumes:
      - ./tmp/postgres-data:/var/lib/postgresql
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baleia"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:18
    container_name: baleia_postgres_init
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=baleia
    command: >
      sh -c "psql -h postgres -U baleia -d baleia -c 'CREATE DATABASE temporal;' 2>/dev/null || true"

    restart: on-failure

  temporal:
    image: temporalio/auto-setup:latest
    container_name: baleia_temporal
    ports:
      - "7233:7233"
    volumes:
      - ./config/dynamicconfig:/etc/temporal/config/dynamicconfig
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=baleia
      - POSTGRES_PWD=baleia
      - POSTGRES_SEEDS=postgres
      - TEMPORAL_DBNAME=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
    networks:
      - app_net
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'temporal-server' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  temporal-ui:
    image: temporalio/ui:latest
    container_name: baleia_temporal_ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - app_net
    depends_on:
      - temporal

  # ICEBERG CATALOG - Apache Polaris
  polaris:
    image: apache/polaris:1.5.0
    container_name: baleia_polaris
    platform: linux/arm64
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      - QUARKUS_HTTP_CORS_ENABLED=true
      - QUARKUS_HTTP_CORS_ORIGINS=http://localhost:4000
      - QUARKUS_HTTP_CORS_METHODS=GET,POST,PUT,DELETE,PATCH,OPTIONS
      - QUARKUS_HTTP_CORS_HEADERS=Content-Type,Authorization,Polaris-Realm,X-Request-ID
      - polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true
      - POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,admin,admin
      - polaris.realm-context.realms=POLARIS
      - polaris.readiness.ignore-severe-issues=true
      - polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE","S3","GCS","AZURE"]
      - POLARIS_S3_ENDPOINT=http://ceph:8080
      - POLARIS_S3_ACCESS_KEY=seaweedfs
      - POLARIS_S3_SECRET_KEY=seaweedfs
      - POLARIS_S3_REGION=us-east-1
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=seaweedfs
      - AWS_SECRET_ACCESS_KEY=seaweedfs
    networks:
      - app_net
    depends_on:
      ceph:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8182/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  polaris-console:
    image: maltzsama/polaris-console:latest
    container_name: baleia_polaris_ui
    ports:
      - "4000:80"
    environment:
      - VITE_POLARIS_API_URL=http://localhost:8181
      - VITE_OAUTH_TOKEN_URL=http://localhost:8181/api/catalog/v1/oauth/tokens
      - VITE_POLARIS_REALM=POLARIS
    networks:
      - app_net
    depends_on:
      - polaris

  # QUERY ENGINE - Trino
  trino:
    image: trinodb/trino:latest
    container_name: baleia_trino
    ports:
      - "8088:8080"
    environment:
      # Enable runtime CREATE CATALOG / DROP CATALOG (no static .properties, no restart).
      # This is what lets Baleia register catalog_connections as Trino catalogs on the fly.
      - CATALOG_MANAGEMENT=dynamic
    volumes:
      - ./trino_catalog:/etc/trino/catalog
    networks:
      - app_net
    depends_on:
      polaris:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: baleia_mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI web
    networks:
      - app_net

  # BALEA SERVICES

  api:
    build: .
    container_name: baleia_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://baleia:baleia@postgres:5432/baleia?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - TRINO_URL=http://trino:8080
      - POLARIS_URL=http://polaris:8181
      - JWT_SECRET=change-me-in-production
      - PUBLIC_URL=http://localhost:8080
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@baleia.io
      - S3_ENDPOINT=ceph:8080
      - S3_ACCESS_KEY=seaweedfs
      - S3_SECRET_KEY=seaweedfs
      - S3_BUCKET=baleia
      - S3_USE_SSL=false
    command: /api
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build: .
    container_name: baleia_worker
    environment:
      - DATABASE_URL=postgresql://baleia:baleia@postgres:5432/baleia?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - TRINO_URL=http://trino:8080
      - POLARIS_URL=http://polaris:8181
      - S3_ENDPOINT=ceph:8080
      - S3_ACCESS_KEY=seaweedfs
      - S3_SECRET_KEY=seaweedfs
      - S3_BUCKET=baleia
      - S3_USE_SSL=false
    command: /worker
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  migrate:
    build: .
    container_name: baleia_migrate
    environment:
      - DATABASE_URL=postgresql://baleia:baleia@postgres:5432/baleia?sslmode=disable
    command: sh -c "sleep 5 && /migrate -cmd=up"
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
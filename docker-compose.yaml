networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  rustfs-data:
  trino_plugin:

services:
  # ============================================
  # OBJECT STORAGE - RustFS (S3-compatible)
  # ============================================

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: baleia_rustfs
    hostname: rustfs
    ports:
      - "8333:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      app_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      # / answers 403 without credentials since RustFS 1.0.4; /health is open.
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: baleia_rustfs_init
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for RustFS..."
        until aws s3api --endpoint-url http://rustfs:9000 list-buckets 2>/dev/null; do
          sleep 2
        done
        echo "Creating bucket 'baleia'..."
        aws s3 mb s3://baleia --endpoint-url http://rustfs:9000 --region us-east-1
        echo "Bucket created."
    networks:
      - app_net
    depends_on:
      rustfs:
        condition: service_started
    restart: "no"

  # ============================================
  # DATABASE LAYER
  # ============================================

  postgres:
    image: postgres:18
    container_name: baleia_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=baleia
      - POSTGRES_PASSWORD=baleia
      - POSTGRES_DB=baleia
    volumes:
      - ./tmp/postgres-data:/var/lib/postgresql
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baleia"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:18
    container_name: baleia_postgres_init
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=baleia
    command: >
      sh -c "
      psql -h postgres -U baleia -d baleia -c 'CREATE DATABASE temporal;' 2>/dev/null || true;
      psql -h postgres -U baleia -d baleia -c 'CREATE DATABASE polaris;' 2>/dev/null || true;
      psql -h postgres -U baleia -d baleia -c 'CREATE DATABASE hive_metastore;' 2>/dev/null || true;
      psql -h postgres -U baleia -d baleia -c 'CREATE DATABASE lakekeeper;' 2>/dev/null || true
      "
    restart: on-failure

  # ============================================
  # TEMPORAL LAYER
  # ============================================

  temporal:
    image: temporalio/auto-setup:latest
    container_name: baleia_temporal
    ports:
      - "7233:7233"
    volumes:
      - ./config/dynamicconfig:/etc/temporal/config/dynamicconfig
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=baleia
      - POSTGRES_PWD=baleia
      - POSTGRES_SEEDS=postgres
      - TEMPORAL_DBNAME=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
    networks:
      - app_net
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'temporal-server' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  temporal-ui:
    image: temporalio/ui:latest
    container_name: baleia_temporal_ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - app_net
    depends_on:
      - temporal

  # ============================================
  # ICEBERG CATALOG - Polaris
  # ============================================
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.6.0
    container_name: baleia_polaris_bootstrap
    environment:
      - POLARIS_PERSISTENCE_TYPE=relational-jdbc
      - QUARKUS_DATASOURCE_USERNAME=baleia
      - QUARKUS_DATASOURCE_PASSWORD=baleia
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/polaris
    command: ["bootstrap", "-r", "POLARIS", "-c", "POLARIS,admin,admin"]
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  polaris:
    image: apache/polaris:1.6.0
    container_name: baleia_polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      # RELATIONAL PERSISTENCE (POSTGRES)
      - POLARIS_PERSISTENCE_TYPE=relational-jdbc
      - QUARKUS_DATASOURCE_USERNAME=baleia
      - QUARKUS_DATASOURCE_PASSWORD=baleia
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/polaris
      
      # BOOTSTRAP (already done, but harmless)
      - POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,admin,admin
      - polaris.realm-context.realms=POLARIS
      
      # CORS
      - QUARKUS_HTTP_CORS_ENABLED=true
      - QUARKUS_HTTP_CORS_ORIGINS=http://polaris-console:80,http://localhost:4000
      - QUARKUS_HTTP_CORS_METHODS=GET,POST,PUT,DELETE,PATCH,OPTIONS
      - QUARKUS_HTTP_CORS_HEADERS=Content-Type,Authorization,Polaris-Realm,X-Request-ID
      
      # FEATURES
      - polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true
      - polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE","S3","GCS","AZURE"]
      - polaris.readiness.ignore-severe-issues=true
      
      # AUTHENTICATION
      - polaris.authorization.enabled=false
      - POLARIS_AUTHORIZATION_ENABLED=false
      - polaris.auth.enabled=true
      - polaris.auth.type=basic
      - polaris.auth.basic.users=admin:admin
      - polaris.auth.default-realm=POLARIS
      
      # S3 (RustFS)
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - JAVA_OPTS_APPEND=-Daws.s3UsePathStyle=true
      
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://polaris:8182/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seed-polaris:
    image: python:3.11-slim
    container_name: baleia_seed_polaris
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --quiet pyiceberg pyarrow requests
        python /scripts/seed_polaris.py
    environment:
      - POLARIS_URL=http://polaris:8181
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - app_net
    depends_on:
      polaris:
        condition: service_healthy
    restart: "no"

  polaris-console:
    image: maltzsama/polaris-console:latest
    container_name: baleia_polaris_ui
    ports:
      - "4000:80"
    environment:
      - VITE_POLARIS_API_URL=http://localhost:8181
      - VITE_POLARIS_REALM=POLARIS
    command: >
      /bin/sh -c '
      find /usr/share/nginx/html -type f -name "*.js" -exec sed -i "s|http://localhost:4000|http://localhost:8181|g; s|localhost:4000|localhost:8181|g" {} \; &&
      nginx -g "daemon off;"
      '
    networks:
      - app_net
    depends_on:
      - polaris

  # ============================================
  # QUERY ENGINE - Trino
  # ============================================

  # Installs the pinned baleia-trino-catalog-store release (BALEIA_PLUGIN_VERSION,
  # the Makefile's pin) into the trino_plugin volume once; a volume that already
  # holds that VERSION is left alone. Set BALEIA_PLUGIN_URL to install another
  # tarball (its .sha256 must sit beside it).
  trino-plugin-init:
    image: alpine:3.20
    container_name: baleia_trino_plugin_init
    environment:
      PLUGIN_URL: "${BALEIA_PLUGIN_URL:-https://github.com/maltzsama/baleia-trino-catalog-store/releases/download/v${BALEIA_PLUGIN_VERSION:-0.10.0}/baleia-catalog-store-${BALEIA_PLUGIN_VERSION:-0.10.0}+trino${TRINO_VERSION:-484}.tar.gz}"
      WANT: "${BALEIA_PLUGIN_VERSION:-0.10.0}+trino${TRINO_VERSION:-484}"
    volumes:
      - trino_plugin:/plugin
    command:
      - sh
      - -ec
      - |
        [ "$$(cat /plugin/VERSION 2>/dev/null)" = "$$WANT" ] && exit 0
        rm -rf /plugin/* 2>/dev/null || true
        wget -qO /tmp/p.tgz "$$PLUGIN_URL"
        wget -qO /tmp/p.sha256 "$$PLUGIN_URL.sha256"
        echo "$$(cut -d' ' -f1 /tmp/p.sha256)  /tmp/p.tgz" | sha256sum -c -
        tar xzf /tmp/p.tgz -C /plugin
        test "$$(cat /plugin/VERSION)" = "$$WANT"
    restart: "no"
    networks:
      - app_net

  trino:
    # Pinned to 484 — the plugin is built against one Trino release at a time
    # (the release ships a tarball per Trino version, e.g. +trino484), and the
    # SPI it implements (CatalogStore/CatalogStoreFactory) and the catalog
    # property names can change between Trino releases (fs.native-s3.enabled →
    # fs.s3.enabled between 481→482 is proof enough). A silent `latest` bump
    # could break every catalog registration, so move TRINO_VERSION together
    # with a plugin release that ships that Trino build.
    #
    # The baleia-catalog-store plugin comes from its released tarball, which
    # trino-plugin-init downloads and checks (sha256 and VERSION) into the
    # trino_plugin volume; Trino itself is the official image (#88).
    image: trinodb/trino:${TRINO_VERSION:-484}
    container_name: baleia_trino
    environment:
      - AWS_REGION=us-east-1
      # Matches the baleia_trino role password created by migration 00018.
      # catalog-store.properties resolves ${ENV:BALEIA_TRINO_DB_PASSWORD} at boot.
      - BALEIA_TRINO_DB_PASSWORD=${BALEIA_TRINO_DB_PASSWORD:-admin}
    # Trino is private: only the API/worker reach it over the compose network.
    # To debug directly, copy docker-compose.override.yml.example and uncomment
    # the port mapping — never publish it in the default stack.
    expose:
      - "8080"
    volumes:
      # The plugin directory of the extracted release (volume subpath needs
      # Docker Compose >= 2.23 and Engine >= 25).
      - type: volume
        source: trino_plugin
        target: /usr/lib/trino/plugin/baleia-catalog-store
        read_only: true
        volume:
          subpath: baleia-catalog-store
      # Baleia owns its Trino configuration (deploy/trino/*, the same files the
      # chart ships): dynamic catalogs, the catalog store, and the catalog guard
      # as the active access control.
      - ./deploy/trino/config.properties:/etc/trino/config.properties:ro
      - ./deploy/trino/catalog-store.properties:/etc/trino/catalog-store.properties:ro
      - ./deploy/trino/baleia-base-access-control.properties:/etc/trino/baleia-base-access-control.properties:ro
      - ./deploy/trino/baleia-catalog-guard.properties:/etc/trino/baleia-catalog-guard.properties:ro
      # etc/catalog/ is NOT mounted — catalogs come from the registry via the plugin.
    networks:
      - app_net
    depends_on:
      trino-plugin-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      polaris:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # EMAIL - Mailpit
  # ============================================

  mailpit:
    image: axllent/mailpit:latest
    container_name: baleia_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_net

  # ============================================
  # DIRECTORY - OpenLDAP (development only)
  # ============================================
  # Start with `docker compose --profile ldap up -d ldap`.
  # The seed LDIF lives in deploy/dev/ldap; credentials are dev-only.
  ldap:
    image: osixia/openldap:1.5.0
    container_name: baleia_ldap
    profiles: ["ldap"]
    hostname: ldap
    environment:
      - LDAP_ORGANISATION=Baleia
      - LDAP_DOMAIN=example.org
      - LDAP_ADMIN_PASSWORD=admin
      - OPENLDAP_BOOTSTRAP_MEMBEROF=true
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./deploy/dev/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    command: --copy-service
    networks:
      - app_net

  # ============================================
  # BALEA SERVICES
  # ============================================

  migrate:
    build: .
    container_name: baleia_migrate
    environment:
      - DATABASE_URL=postgresql://baleia:baleia@postgres:5432/baleia?sslmode=disable
    command: sh -c "sleep 5 && /migrate -cmd=up"
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build: .
    container_name: baleia_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://baleia:baleia@postgres:5432/baleia?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - TRINO_URL=http://trino:8080
      - BALEIA_PLUGIN_VERSION=${BALEIA_PLUGIN_VERSION:-0.10.0}
      - POLARIS_URL=http://polaris:8181
      - JWT_SECRET=${JWT_SECRET:-dev-secret-not-for-production}
      # Seals stored connection credentials; separate from JWT_SECRET.
      - BALEIA_ENCRYPTION_KEY=${BALEIA_ENCRYPTION_KEY:-dev-encryption-key-not-for-production-0123}
      # Same value the Trino service reads; the API sets the baleia_trino role
      # password from it at boot so the role and Trino cannot diverge.
      - BALEIA_TRINO_DB_PASSWORD=${BALEIA_TRINO_DB_PASSWORD:-admin}
      - PUBLIC_URL=http://localhost:8080
      - BALEIA_AGENTS_ENABLED=${BALEIA_AGENTS_ENABLED:-true}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@baleia.io
      - S3_ENDPOINT=rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
      - S3_BUCKET=baleia
      - S3_USE_SSL=false
    command: /api
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      polaris:
        condition: service_healthy

  worker:
    build: .
    container_name: baleia_worker
    environment:
      - DATABASE_URL=postgresql://baleia:baleia@postgres:5432/baleia?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - TRINO_URL=http://trino:8080
      - BALEIA_PLUGIN_VERSION=${BALEIA_PLUGIN_VERSION:-0.10.0}
      - POLARIS_URL=http://polaris:8181
      - JWT_SECRET=${JWT_SECRET:-dev-secret-not-for-production}
      - BALEIA_ENCRYPTION_KEY=${BALEIA_ENCRYPTION_KEY:-dev-encryption-key-not-for-production-0123}
      - BALEIA_AGENTS_ENABLED=${BALEIA_AGENTS_ENABLED:-true}
      - S3_ENDPOINT=rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
      - S3_BUCKET=baleia
      - S3_USE_SSL=false
    command: /worker
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      polaris:
        condition: service_healthy

  # ============================================
  # SOURCES - databases for provider and engine tests (#11, #14)
  # Not started by default: docker compose --profile sources up -d
  # ============================================

  mysql:
    image: mysql:8.4
    container_name: baleia_src_mysql
    profiles: ["sources"]
    environment:
      MYSQL_ROOT_PASSWORD: baleia_dev
    ports:
      - "13306:3306"
    networks:
      - app_net

  mariadb:
    image: mariadb:11.4
    container_name: baleia_src_mariadb
    profiles: ["sources"]
    environment:
      MARIADB_ROOT_PASSWORD: baleia_dev
    ports:
      - "13307:3306"
    networks:
      - app_net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: baleia_src_sqlserver
    profiles: ["sources"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Baleia_dev_2026
    ports:
      - "11433:1433"
    networks:
      - app_net

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: baleia_src_oracle
    profiles: ["sources"]
    environment:
      ORACLE_PASSWORD: baleia_dev
      APP_USER: baleia
      APP_USER_PASSWORD: baleia_dev
    ports:
      - "11521:1521"
    networks:
      - app_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: baleia_src_clickhouse
    profiles: ["sources"]
    environment:
      CLICKHOUSE_USER: baleia
      CLICKHOUSE_PASSWORD: baleia_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
    networks:
      - app_net

  # ============================================
  # LAKEKEEPER - Iceberg REST catalog (#35)
  # Started only with `docker compose --profile sources up -d`. Backed by
  # Baleia's PostgreSQL (database "lakekeeper") and RustFS as its storage; a
  # migrate job, a bootstrap job and a warehouse seeding job run before it is
  # usable. API on the host port 18181.
  # ============================================

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.0
    container_name: baleia_src_lakekeeper_migrate
    profiles: ["sources"]
    command: ["migrate"]
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://baleia:baleia@postgres:5432/lakekeeper
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://baleia:baleia@postgres:5432/lakekeeper
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.0
    container_name: baleia_src_lakekeeper
    profiles: ["sources"]
    command: ["serve"]
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://baleia:baleia@postgres:5432/lakekeeper
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://baleia:baleia@postgres:5432/lakekeeper
    ports:
      - "18181:8181"
    networks:
      - app_net
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  lakekeeper-bootstrap:
    image: curlimages/curl:8.11.1
    container_name: baleia_src_lakekeeper_bootstrap
    profiles: ["sources"]
    networks:
      - app_net
    depends_on:
      lakekeeper:
        condition: service_healthy
    command: ["-sf", "-X", "POST", "http://lakekeeper:8181/management/v1/bootstrap", "-H", "Content-Type: application/json", "--data", "{\"accept-terms-of-use\": true}"]
    restart: "no"

  lakekeeper-warehouse:
    image: curlimages/curl:8.11.1
    container_name: baleia_src_lakekeeper_warehouse
    profiles: ["sources"]
    networks:
      - app_net
    volumes:
      - ./deploy/dev/files/lakekeeper-warehouse.json:/wh.json:ro
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    command: ["-sf", "-X", "POST", "http://lakekeeper:8181/management/v1/warehouse", "-H", "Content-Type: application/json", "--data", "@/wh.json"]
    restart: "no"

  # Hive Metastore (#86): a standalone metastore backed by Baleia's PostgreSQL,
  # the metadata store for Iceberg, Hive and Delta tables on RustFS. Started
  # only with `docker compose --profile sources up -d`. The image adds the
  # PostgreSQL JDBC driver the official image omits; SERVICE_OPTS configures
  # the JDO connection. Ports: 19083 on the host (9083 in the network).
  hive-metastore:
    build:
      context: deploy/dev
      dockerfile: hive.Dockerfile
    image: baleia-hive-metastore:4.0.1
    container_name: baleia_src_hive_metastore
    profiles: ["sources"]
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - SERVICE_OPTS=-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/hive_metastore -Djavax.jdo.option.ConnectionUserName=baleia -Djavax.jdo.option.ConnectionPassword=baleia
    ports:
      - "19083:9083"
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9083"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Unity Catalog OSS (#32): the browsing API and the Iceberg REST endpoint for
  # reading tables (UniForm). Started only with
  # `docker compose --profile sources up -d`. API on the host port 18080; the
  # image seeds a `unity` catalog with a `default` schema.
  unity:
    image: unitycatalog/unitycatalog:v0.7.0
    container_name: baleia_src_unity
    profiles: ["sources"]
    ports:
      - "18080:8080"
    networks:
      - app_net

  # AWS emulator (#86): the Glue provider's metadata reader is tested against
  # moto. `docker compose --profile sources up -d`, then point the provider at
  # http://localhost:15000 (BALEIA_TEST_MOTO_URL=http://localhost:15000).
  moto:
    image: motoserver/moto:5.2.4
    container_name: baleia_src_moto
    profiles: ["sources"]
    ports:
      - "15000:5000"
    networks:
      - app_net

  # ============================================
  # TRACING - Jaeger (OTLP) (#47)
  # Started only with `docker compose --profile tracing up -d`. Point Baleia
  # at it with BALEIA_TRACING_ENABLED=true and
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317 (gRPC).
  # ============================================
  jaeger:
    image: jaegertracing/jaeger:2.6.0
    container_name: baleia_jaeger
    profiles: ["tracing"]
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - app_net

  # ============================================
  # OPENSEARCH - audit export target (#50)
  # Started only with `docker compose --profile opensearch up -d`. Point Baleia
  # at it with BALEIA_AUDIT_EXPORT_URL=http://opensearch:9200 and install the
  # index template from deploy/opensearch/audit-template.json.
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: baleia_opensearch
    profiles: ["opensearch"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - app_net

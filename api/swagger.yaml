  # ── Executions ────────────────────────────────────────────────
  /workspaces/{id}/executions:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Executions]
      operationId: listExecutions
      summary: "Workspace execution history, newest first"
      description: >
        Members see their own executions; the workspace owner and global
        administrators see everyone's. Keyset-paginated on
        `(started_at DESC, id DESC)`: pass `next_cursor` back as `cursor`.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [running, finished, failed, cancelled] }
        - name: user_id
          in: query
          description: "A user id, or `me` for the caller"
          schema: { type: string }
        - name: from
          in: query
          description: "Only executions started at or after this instant"
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: "Only executions started at or before this instant"
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: "Substring of the SQL (trigram-indexed)"
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: catalog_id
          in: query
          schema: { type: string, format: uuid }
        - name: engine_id
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          description: "next_cursor of the previous page"
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: "One page of executions, newest first"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Execution" }
                  next_cursor:
                    type: string
                    nullable: true
                    description: "Pass as cursor for the next page; null on the last one"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      tags: [Executions]
      operationId: runQuery
      summary: "Submit a query on a target"
      description: >
        The target is resolved per request (see TargetRequest) and must be a
        target of the workspace. 404 when the named binding or catalog is not;
        422 target_required (nothing to pick), engine_required (the catalog is
        bound to several engines), target_unavailable (disabled binding, engine
        or catalog), engine_unsupported (no adapter for the engine's kind yet;
        direct engines get theirs in #81-#83). The statements run on the
        target's engine, catalog and schema, read-only for a read grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionRequest" }
      responses:
        "202":
          description: "Execution started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: getExecution
      summary: "Execution status and metadata"
      responses:
        "200":
          description: "Execution"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/executions/{execution_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"

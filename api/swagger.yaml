  /workspaces/{id}/executions/{execution_id}/statements:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: listStatements
      summary: "List individual statements in a multi-statement execution"
      responses:
        "200":
          description: "Statements"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueryStatement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/executions/{execution_id}/statements/{position}/results:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: position
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: result_index
        in: query
        description: "Which stored result set of the statement (0-based); default 0"
        schema: { type: integer, minimum: 0, default: 0 }
      - name: format
        in: query
        description: >
          `arrow` (default) streams the stored IPC object unchanged. `csv`,
          `tsv` and `jsonl` convert it server-side, row by row, without
          materializing the result, and answer with
          `Content-Disposition: attachment`.
        schema: { type: string, enum: [arrow, csv, tsv, jsonl], default: arrow }
      - name: offset
        in: query
        description: >
          First row to return when paging an Arrow file (0-based). With
          `limit`, the endpoint re-emits only the covering record batches so a
          client never downloads the whole result.
        schema: { type: integer, minimum: 0, default: 0 }
      - name: limit
        in: query
        description: "Maximum rows to return when paging; 0 returns the whole result."
        schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    get:
      tags: [Executions]
      operationId: getStatementResults
      summary: "Single-statement result as Arrow IPC stream or an export"
      description: |
        Streams one statement's result set from object storage. A statement
        whose result was truncated returns the buffered prefix. With
        `format=csv|tsv|jsonl`, the object is converted as it streams.
      responses:
        "200": { $ref: "#/components/responses/ArrowStream" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Statement has no result set yet"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/executions/{execution_id}/results:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: getResults
      summary: "Execution results as Arrow IPC stream"
      description: |
        Returns complete results via Arrow IPC. Uses Trino spooling protocol — segments are fetched in parallel from object storage.
      responses:
        "200": { $ref: "#/components/responses/ArrowStream" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Execution not yet completed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ws-tickets:
    post:
      tags: [Executions]
      operationId: issueWsTicket
      summary: "Issue a single-use WebSocket ticket (30 seconds)"
      description: >
        Keeps the JWT out of WebSocket URLs. The client connects to
        `/ws/workspaces/{id}/executions/{execution_id}?ticket=<ticket>` and the
        server consumes the ticket once. A ticket scoped to an execution is
        rejected on any other execution.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WsTicketRequest" }
      responses:
        "201":
          description: "Ticket"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WsTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ws/workspaces/{id}/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: streamExecution
      summary: "WebSocket for real-time execution progress"
      description: |
        Authenticate via `?ticket=<ticket>` from `POST /ws-tickets`; the ticket
        is single-use and valid for 30 seconds. The JWT never appears in the
        URL.

        Every message is an `ExecutionEvent`. The first message of every
        connection (including a reconnect) is `snapshot`, which replaces the
        client state entirely. Events carry a monotonic per-connection `seq`;
        the client ignores a `seq` it has already applied. After a terminal
        `execution_status`, fetch `GET .../statements/{position}/results` for
        the Arrow IPC stream. The connection closes after the terminal event.
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: "WebSocket established"
        "401": { $ref: "#/components/responses/Unauthorized" }


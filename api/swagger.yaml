openapi: "3.0.3"
info:
  title: "Baleia API"
  description: |
    First-class UI for Trino + Apache Iceberg catalog management platform.

    ## Serialization

    **JSON** (`application/json`) for application data: auth, users, teams,
    workspaces, catalog connections, lenses, retrievers, migrations.

    **Arrow IPC** (`application/vnd.apache.arrow.stream`) for data originating
    from Trino: query results, explain plans, Iceberg catalog.

    ## Authentication

    JWT via `Authorization: Bearer <token>` or `token` cookie (for WebSocket).
    API Keys via `X-Api-Key` header.

  version: "0.1.0"

servers:
  - url: "/api/v1"

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Setup
    description: "Configuração inicial do sistema"
  - name: Auth
    description: "Autenticação e sessões"
  - name: ApiKeys
    description: "Chaves de acesso programático"
  - name: Users
    description: "Perfis de usuário e administração"
  - name: Teams
    description: "Gerenciamento de times"
  - name: Workspaces
    description: "Espaços de trabalho por usuário ou time"
  - name: CatalogConnections
    description: "Conexões com catálogos Iceberg externos"
  - name: Catalog
    description: "Exploração de catálogos, namespaces e tabelas Iceberg via Trino"
  - name: QueryEditor
    description: "Pastas, queries salvas e execuções"
  - name: Executions
    description: "Ciclo de vida de execuções — submit, status, cancel, streaming"
  - name: Lenses
    description: "Manutenção de tabelas Iceberg (compaction, snapshots, orphan files)"
  - name: Retrievers
    description: "Materialized views Iceberg agendadas"
  - name: Migrant
    description: "Migração copy-zero de catálogos (Nessie → Polaris)"

# ═══════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueryPage:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    QueryPerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    NoContent:
      description: "Sucesso sem corpo"
    Unauthorized:
      description: "Credenciais ausentes ou inválidas"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: "Permissão insuficiente"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: "Recurso não encontrado"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: "Recurso já existe"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: "Erro de validação"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    ArrowStream:
      description: "Apache Arrow IPC stream"
      content:
        application/vnd.apache.arrow.stream:
          schema: { type: string, format: binary }

  schemas:

    # ── Genérico ─────────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, example: "not_found" }
        message: { type: string }

    ValidationError:
      type: object
      required: [code, message, errors]
      properties:
        code:    { type: string, example: "validation_error" }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field:   { type: string }
              message: { type: string }

    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:        { type: integer }
        per_page:    { type: integer }
        total:       { type: integer }
        total_pages: { type: integer }

    # ── Setup ─────────────────────────────────────────────
    SetupStatus:
      type: object
      required: [is_configured, version]
      properties:
        is_configured: { type: boolean }
        version:       { type: string, example: "0.1.0" }

    CreateAdminRequest:
      type: object
      required: [name, email, password]
      properties:
        name:     { type: string }
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }

    # ── Auth ──────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:      { type: string }
        expires_at: { type: string, format: date-time }
        user:       { $ref: '#/components/schemas/UserPublic' }

    OIDCProvider:
      type: object
      required: [id, name, type]
      properties:
        id:   { type: string, format: uuid }
        name: { type: string, example: "Okta" }
        type: { type: string, enum: [oidc] }

    PasswordResetRequestBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PasswordResetConfirmBody:
      type: object
      required: [token, new_password]
      properties:
        token:        { type: string }
        new_password: { type: string, minLength: 8 }

    # ── API Keys ──────────────────────────────────────────
    ApiKey:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        key_prefix:  { type: string, example: "blw_live_abc..." }
        expires_at:  { type: string, format: date-time, nullable: true }
        created_at:  { type: string, format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "Mostrado apenas uma vez na criação"

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:       { type: string }
        expires_at: { type: string, format: date-time, nullable: true }

    # ── Users ─────────────────────────────────────────────
    UserPublic:
      type: object
      required: [id, name, email, role, auth_provider, created_at]
      properties:
        id:            { type: string, format: uuid }
        name:          { type: string }
        email:         { type: string, format: email }
        role:          { type: string, enum: [admin, member] }
        auth_provider: { type: string, enum: [local, oidc] }
        created_at:    { type: string, format: date-time }

    UpdateProfileRequest:
      type: object
      properties:
        name:  { type: string }
        email: { type: string, format: email }

    UpdatePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password:     { type: string, minLength: 8 }

    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:  { type: string, enum: [admin, member] }

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, member] }

    # ── Teams ─────────────────────────────────────────────
    Team:
      type: object
      required: [id, name, created_at]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string, nullable: true }
        created_at:  { type: string, format: date-time }

    TeamMember:
      type: object
      required: [user, role, joined_at]
      properties:
        user:      { $ref: '#/components/schemas/UserPublic' }
        role:      { type: string, enum: [owner, member] }
        joined_at: { type: string, format: date-time }

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string }

    AddTeamMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role:    { type: string, enum: [owner, member], default: member }

    # ── Workspaces ────────────────────────────────────────
    Workspace:
      type: object
      required: [id, name, type, polaris_catalog_name, created_at]
      properties:
        id:                   { type: string, format: uuid }
        name:                 { type: string }
        description:          { type: string, nullable: true }
        type:                 { type: string, enum: [personal, shared] }
        polaris_catalog_name: { type: string }
        owner_user_id:        { type: string, format: uuid, nullable: true }
        owner_team_id:        { type: string, format: uuid, nullable: true }
        created_at:           { type: string, format: date-time }
        updated_at:           { type: string, format: date-time }

    CreateWorkspaceRequest:
      type: object
      required: [name, type]
      properties:
        name:         { type: string }
        description:  { type: string }
        type:         { type: string, enum: [personal, shared] }
        owner_team_id: { type: string, format: uuid, nullable: true, description: "Obrigatório quando type=shared" }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:        { type: string }
        description: { type: string }

    # ── Catalog Connections ───────────────────────────────
    CatalogConnection:
      type: object
      required: [id, name, type, url, default_readonly, created_at]
      properties:
        id:              { type: string, format: uuid }
        name:            { type: string }
        type:            { type: string, enum: [polaris, nessie, glue, hive] }
        url:             { type: string }
        default_readonly: { type: boolean }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }

    CreateCatalogConnectionRequest:
      type: object
      required: [name, type, url]
      properties:
        name:             { type: string }
        type:             { type: string, enum: [polaris, nessie, glue, hive] }
        url:              { type: string }
        credentials:      { type: object, description: "Credenciais específicas do tipo (armazenadas encriptadas)" }
        default_readonly: { type: boolean, default: true }

    UpdateCatalogConnectionRequest:
      type: object
      properties:
        name:             { type: string }
        url:              { type: string }
        credentials:      { type: object }
        default_readonly: { type: boolean }

    TestCatalogConnectionResult:
      type: object
      required: [success, latency_ms]
      properties:
        success:    { type: boolean }
        latency_ms: { type: integer }
        error:      { type: string, nullable: true }
        version:    { type: string, nullable: true }

    WorkspaceCatalogAccess:
      type: object
      required: [catalog_connection_id, permission, granted_at]
      properties:
        catalog_connection_id: { type: string, format: uuid }
        catalog_name:          { type: string }
        catalog_type:          { type: string, enum: [polaris, nessie, glue, hive] }
        permission:            { type: string, enum: [read, write] }
        granted_at:            { type: string, format: date-time }

    GrantCatalogAccessRequest:
      type: object
      required: [catalog_connection_id, permission]
      properties:
        catalog_connection_id: { type: string, format: uuid }
        permission:            { type: string, enum: [read, write] }

    # ── Query Editor ──────────────────────────────────────
    QueryFolder:
      type: object
      required: [id, name, workspace_id, created_at]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        workspace_id: { type: string, format: uuid }
        parent_id:    { type: string, format: uuid, nullable: true }
        created_at:   { type: string, format: date-time }

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:      { type: string }
        parent_id: { type: string, format: uuid, nullable: true }

    SavedQuery:
      type: object
      required: [id, name, workspace_id, created_by, sql, created_at]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        workspace_id: { type: string, format: uuid }
        folder_id:    { type: string, format: uuid, nullable: true }
        created_by:   { type: string, format: uuid }
        sql:          { type: string }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    CreateSavedQueryRequest:
      type: object
      required: [name, sql]
      properties:
        name:      { type: string }
        folder_id: { type: string, format: uuid, nullable: true }
        sql:       { type: string }

    UpdateSavedQueryRequest:
      type: object
      properties:
        name:      { type: string }
        folder_id: { type: string, format: uuid, nullable: true }
        sql:       { type: string }

    # ── Executions ────────────────────────────────────────
    ExecutionRequest:
      type: object
      required: [workspace_id, sql]
      properties:
        workspace_id:    { type: string, format: uuid }
        saved_query_id:  { type: string, format: uuid, nullable: true }
        sql:             { type: string }

    Execution:
      type: object
      required: [id, workspace_id, status, sql, created_at]
      properties:
        id:              { type: string, format: uuid }
        workspace_id:    { type: string, format: uuid }
        saved_query_id:  { type: string, format: uuid, nullable: true }
        status:          { type: string, enum: [running, finished, failed, cancelled] }
        sql:             { type: string }
        trino_query_id:  { type: string, nullable: true }
        rows_returned:   { type: integer, nullable: true }
        duration_ms:     { type: integer, nullable: true }
        started_at:      { type: string, format: date-time }
        finished_at:     { type: string, format: date-time, nullable: true }

    QueryStatement:
      type: object
      required: [id, execution_id, position, sql, status]
      properties:
        id:             { type: string, format: uuid }
        execution_id:   { type: string, format: uuid }
        position:       { type: integer }
        sql:            { type: string }
        status:         { type: string, enum: [running, finished, failed, cancelled] }
        trino_query_id: { type: string, nullable: true }
        rows_returned:  { type: integer, nullable: true }
        duration_ms:    { type: integer, nullable: true }
        error_message:  { type: string, nullable: true }
        started_at:     { type: string, format: date-time, nullable: true }
        finished_at:    { type: string, format: date-time, nullable: true }

    # ── Lenses ────────────────────────────────────────────
    Lens:
      type: object
      required: [id, name, catalog_connection_id, iceberg_catalog, iceberg_namespace, iceberg_table, cron_schedule, status, created_at]
      properties:
        id:                     { type: string, format: uuid }
        name:                   { type: string }
        catalog_connection_id:  { type: string, format: uuid }
        iceberg_catalog:        { type: string }
        iceberg_namespace:      { type: string }
        iceberg_table:          { type: string }
        cron_schedule:          { type: string, example: "0 2 * * *" }
        expire_snapshots:       { type: boolean }
        remove_orphan_files:    { type: boolean }
        compact_data_files:     { type: boolean }
        rewrite_manifests:      { type: boolean }
        remove_old_metadata:    { type: boolean }
        status:                 { type: string, enum: [active, paused, error] }
        last_run_at:            { type: string, format: date-time, nullable: true }
        next_run_at:            { type: string, format: date-time, nullable: true }
        created_at:             { type: string, format: date-time }
        updated_at:             { type: string, format: date-time }

    CreateLensRequest:
      type: object
      required: [name, catalog_connection_id, iceberg_catalog, iceberg_namespace, iceberg_table, cron_schedule]
      properties:
        name:                   { type: string }
        catalog_connection_id:  { type: string, format: uuid }
        iceberg_catalog:        { type: string }
        iceberg_namespace:      { type: string }
        iceberg_table:          { type: string }
        cron_schedule:          { type: string }
        expire_snapshots:       { type: boolean, default: true }
        remove_orphan_files:    { type: boolean, default: true }
        compact_data_files:     { type: boolean, default: true }
        rewrite_manifests:      { type: boolean, default: true }
        remove_old_metadata:    { type: boolean, default: true }

    UpdateLensRequest:
      type: object
      properties:
        name:                { type: string }
        cron_schedule:       { type: string }
        expire_snapshots:    { type: boolean }
        remove_orphan_files: { type: boolean }
        compact_data_files:  { type: boolean }
        rewrite_manifests:   { type: boolean }
        remove_old_metadata: { type: boolean }
        status:              { type: string, enum: [active, paused] }

    LensRunHistory:
      type: object
      required: [id, lens_id, status, started_at]
      properties:
        id:                   { type: string, format: uuid }
        lens_id:              { type: string, format: uuid }
        temporal_workflow_id: { type: string }
        status:               { type: string, enum: [running, finished, failed] }
        operations_summary:   { type: string, nullable: true }
        error_message:        { type: string, nullable: true }
        duration_ms:          { type: integer, nullable: true }
        started_at:           { type: string, format: date-time }
        finished_at:          { type: string, format: date-time, nullable: true }

    # ── Retrievers ────────────────────────────────────────
    Retriever:
      type: object
      required: [id, name, workspace_id, definition_sql, dest_catalog, dest_namespace, dest_table, cron_schedule, refresh_type, status, created_at]
      properties:
        id:               { type: string, format: uuid }
        name:             { type: string }
        workspace_id:     { type: string, format: uuid }
        created_by:       { type: string, format: uuid }
        definition_sql:   { type: string }
        dest_catalog:     { type: string }
        dest_namespace:   { type: string }
        dest_table:       { type: string }
        cron_schedule:    { type: string, example: "0 */6 * * *" }
        refresh_type:     { type: string, enum: [incremental, full] }
        status:           { type: string, enum: [active, paused, error] }
        last_refresh_at:  { type: string, format: date-time, nullable: true }
        next_refresh_at:  { type: string, format: date-time, nullable: true }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

    CreateRetrieverRequest:
      type: object
      required: [name, definition_sql, cron_schedule]
      properties:
        name:           { type: string }
        definition_sql: { type: string, description: "CREATE MATERIALIZED VIEW ... AS SELECT ... O destino é extraído da query." }
        cron_schedule:  { type: string }
        refresh_type:   { type: string, enum: [incremental, full], default: incremental }

    UpdateRetrieverRequest:
      type: object
      properties:
        name:          { type: string }
        cron_schedule: { type: string }
        refresh_type:  { type: string, enum: [incremental, full] }
        status:        { type: string, enum: [active, paused] }

    RetrieverRefreshHistory:
      type: object
      required: [id, retriever_id, refresh_type, status, started_at]
      properties:
        id:                   { type: string, format: uuid }
        retriever_id:         { type: string, format: uuid }
        temporal_workflow_id: { type: string }
        refresh_type:         { type: string, enum: [incremental, full] }
        status:               { type: string, enum: [running, finished, failed] }
        rows_processed:       { type: integer, nullable: true }
        duration_ms:          { type: integer, nullable: true }
        error_message:        { type: string, nullable: true }
        started_at:           { type: string, format: date-time }
        finished_at:          { type: string, format: date-time, nullable: true }

    # ── Migrant ───────────────────────────────────────────
    Migration:
      type: object
      required: [id, name, source_type, source_url, target_catalog_connection_id, status, created_at]
      properties:
        id:                          { type: string, format: uuid }
        name:                        { type: string }
        source_type:                 { type: string, enum: [nessie] }
        source_url:                  { type: string }
        target_catalog_connection_id: { type: string, format: uuid }
        status:                      { type: string, enum: [pending, running, finished, failed, cancelled] }
        total_tables:                { type: integer }
        migrated_tables:             { type: integer }
        failed_tables:               { type: integer }
        temporal_workflow_id:        { type: string, nullable: true }
        started_at:                  { type: string, format: date-time, nullable: true }
        finished_at:                 { type: string, format: date-time, nullable: true }
        created_at:                  { type: string, format: date-time }

    CreateMigrationRequest:
      type: object
      required: [name, source_type, source_url, target_catalog_connection_id]
      properties:
        name:                         { type: string }
        source_type:                  { type: string, enum: [nessie] }
        source_url:                   { type: string }
        source_credentials:           { type: object, nullable: true }
        target_catalog_connection_id: { type: string, format: uuid }

    MigrationItem:
      type: object
      required: [id, migration_id, source_namespace, source_table, target_namespace, target_table, status]
      properties:
        id:               { type: string, format: uuid }
        migration_id:     { type: string, format: uuid }
        source_namespace: { type: string }
        source_table:     { type: string }
        target_namespace: { type: string }
        target_table:     { type: string }
        status:           { type: string, enum: [pending, running, finished, failed, skipped] }
        error_message:    { type: string, nullable: true }
        started_at:       { type: string, format: date-time, nullable: true }
        finished_at:      { type: string, format: date-time, nullable: true }

# ═══════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════
paths:

  # ── Setup ─────────────────────────────────────────────
  /setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: "Status de configuração do sistema"
      security: []
      responses:
        '200':
          description: "Status"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }

  /setup/admin:
    post:
      tags: [Setup]
      operationId: createFirstAdmin
      summary: "Cria o primeiro usuário admin"
      description: "Falha com 409 se já existir qualquer usuário."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminRequest' }
      responses:
        '201':
          description: "Admin criado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ── Auth ──────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: "Autenticar e receber JWT"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: "Sessão criada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: "Invalidar sessão atual"
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: "Retorna o usuário autenticado"
      responses:
        '200':
          description: "Usuário atual"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }

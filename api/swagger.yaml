          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Retrievers]
      operationId: deleteRetriever
      summary: "Remove a Retriever"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/retrievers/{retriever_id}/refresh:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: retriever_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Retrievers]
      operationId: triggerRetrieverRefresh
      summary: "Trigger manual Retriever refresh"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_type:
                  {

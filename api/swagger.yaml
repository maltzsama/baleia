  /catalogs/{catalog_id}/table-health:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Monitoring]
      operationId: listTableHealth
      summary: "Iceberg table health of a logical catalog"
      parameters:
        - name: ns
          in: query
          schema: { type: string }
        - name: needs
          in: query
          schema: { type: string }
        - name: max_score
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: "Table health rows"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TableHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog_id}/maintenance:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Monitoring]
      operationId: createMaintenanceRun
      summary: "Run optimize/expire/orphan cleanup on one Iceberg table"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaintenanceRequest" }
      responses:
        "202":
          description: "Maintenance started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /catalogs/{catalog_id}/maintenance-runs:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Monitoring]
      operationId: listMaintenanceRuns
      summary: "Maintenance runs of a catalog, newest first"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: "Runs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Retrievers ────────────────────────────────────────────────
  /workspaces/{id}/retrievers:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Retrievers]
      operationId: listRetrievers
      summary: "List workspace Retrievers"
      responses:
        "200":
          description: "Retrievers"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Retriever" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Retrievers]
      operationId: createRetriever
      summary: "Create a Retriever in the workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRetrieverRequest" }
      responses:
        "201":
          description: "Retriever created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retriever" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/retrievers/{retriever_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: retriever_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Retrievers]
      operationId: getRetriever
      summary: "Retriever details"
      responses:
        "200":
          description: "Retriever"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retriever" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Retrievers]
      operationId: updateRetriever
      summary: "Update a Retriever"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRetrieverRequest" }
      responses:
        "200":
          description: "Retriever updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retriever" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Unsupported refresh type or invalid payload"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Retrievers]
      operationId: deleteRetriever
      summary: "Remove a Retriever"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/retrievers/{retriever_id}/refresh:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: retriever_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Retrievers]
      operationId: triggerRetrieverRefresh
      summary: "Trigger manual Retriever refresh"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_type:
                  {
                    type: string,
                    enum: [incremental, full],
                    default: full,
                  }
      responses:
        "202":
          description: "Refresh started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrieverRefreshHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/retrievers/{retriever_id}/history:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: retriever_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Retrievers]
      operationId: getRetrieverHistory
      summary: "Retriever refresh history"
      parameters:
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPerPage"
      responses:
        "200":
          description: "History"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      { $ref: "#/components/schemas/RetrieverRefreshHistory" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/retrievers/destinations:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Retrievers]
      operationId: listRetrieverDestinations
      summary: "Bindings this workspace may write to (Iceberg, active, on a federated engine)"
      responses:
        "200":
          description: "Destinations"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RetrieverDestination" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workspaces/{id}/retrievers/validate:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Retrievers]
      operationId: validateRetriever
      summary: "Explain the definition on the destination engine in a read-only session"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateRetrieverRequest" }
      responses:
        "200":
          description: "The definition parses and the caller can read its sources"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateRetrieverResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /cron/preview:
    post:
      tags: [Retrievers]
      operationId: previewCron
      summary: "Next runs of a cron expression, from the server's parser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronPreviewRequest" }
      responses:
        "200":
          description: "Preview"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronPreviewResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Migrant ───────────────────────────────────────────────────
  /migrations:
    get:
      tags: [Migrant]
      operationId: listMigrations
      summary: "List migrations — admin only"
      responses:
        "200":
          description: "Migrations"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Migrant]
      operationId: createMigration
      summary: "Create a zero-copy migration — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMigrationRequest" }
      responses:
        "201":
          description: "Migration created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /migrations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Migrant]
      operationId: getMigration
      summary: "Migration status"
      responses:
        "200":
          description: "Migration"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /migrations/{id}/start:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Migrant]
      operationId: startMigration
      summary: "Start migration execution — admin only"
      responses:
        "202":
          description: "Migration started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /migrations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Migrant]
      operationId: cancelMigration
      summary: "Cancel an ongoing migration — admin only"
      responses:
        "200":
          description: "Migration cancelled"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /migrations/{id}/items:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Migrant]
      operationId: listMigrationItems
      summary: "List individual tables in a migration"
      parameters:
        - name: status
          in: query
          schema:
            {
              type: string,
              enum: [pending, running, finished, failed, skipped],
            }
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPerPage"
      responses:
        "200":
          description: "Items"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MigrationItem" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

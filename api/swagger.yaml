openapi: "3.0.3"
info:
  title: "Baleia API"
  description: |
    First-class UI for Trino + Apache Iceberg catalog management platform.

    ## Serialization

    **JSON** (`application/json`) for application data: auth, users, teams,
    workspaces, catalog connections, retrievers, migrations.

    **Arrow IPC** (`application/vnd.apache.arrow.stream`) for data originating
    from Trino: query results, explain plans, Iceberg catalog.

    ## Authentication

    JWT via `Authorization: Bearer <token>` or `token` cookie (for WebSocket).
    API Keys via `X-Api-Key` header.

  version: "0.1.0"

servers:
  - url: "/api/v1"

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Setup
    description: "Initial system configuration"
  - name: Auth
    description: "Authentication and sessions"
  - name: ApiKeys
    description: "Programmatic access keys"
  - name: Agents
    description: "Agent identities, workspace bindings and /mcp tokens"
  - name: Identity
    description: "Identity provider administration (OIDC and LDAP) — admin only"
  - name: Users
    description: "User profiles and administration"
  - name: Admin
    description: "Global administration and system status"
  - name: Teams
    description: "Team management"
  - name: Workspaces
    description: "User or team workspaces"
  - name: CatalogConnections
    description: "External Iceberg catalog connections"
  - name: Engines
    description: "Query engines (federated or direct) and the catalogs bound to them"
  - name: Catalog
    description: "Iceberg catalog, namespace, and table exploration via Trino"
  - name: QueryEditor
    description: "Folders, saved queries, and executions"
  - name: Executions
    description: "Execution lifecycle — submit, status, cancel, streaming"
  - name: Retrievers
    description: "Scheduled Iceberg materialized views"
  - name: Migrant
    description: "Zero-copy catalog migration (Nessie → Polaris)"
  - name: Semantic
    description: "Semantic layer v1: table/column docs, tags, owners and simple metrics"
  - name: Spaces
    description: "Space containers, their access lists and the content they own"
  - name: Observability
    description: "Items that need the caller's attention, computed from current state"

# ═══════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathAgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathAgentTokenId:
      name: token_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueryPage:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    QueryPerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    NoContent:
      description: "Successful response with no body"
    Unauthorized:
      description: "Missing or invalid credentials"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "Insufficient permissions"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "Resource already exists"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: "Validation error"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    ServiceUnavailable:
      description: "Service unavailable"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "Rate limited"
      headers:
        Retry-After:
          description: "Seconds to wait before retrying."
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ArrowStream:
      description: >
        Apache Arrow IPC. An unpaged read streams the stored object unchanged
        (`stream` for legacy results, `file` for results written after #238); a
        paged read (`offset`/`limit`) always returns a `stream`.
      content:
        application/vnd.apache.arrow.stream:
          schema: { type: string, format: binary }
        application/vnd.apache.arrow.file:
          schema: { type: string, format: binary }
  schemas:
    # ── Generic ────────────────────────────────────────────────
    # Closed set of API error codes (#67). The API returns a stable `code` and
    # an English `message`; the UI translates the code (plus `params`) with
    # Paraglide. Handlers must use the generated constants — never a string
    # literal — and every value needs an `error_<code>` key in
    # web/messages/{en,pt-BR}.json (enforced by TestErrorCodesClosed).
    ErrorCode:
      type: string
      x-enum-varnames: [ErrorCodeAccountSuspended, ErrorCodeAgentTokenNotAllowed, ErrorCodeAssistantDisabled, ErrorCodeBadRequest, ErrorCodeBindingBusy, ErrorCodeBindingDisabled, ErrorCodeBindingExists, ErrorCodeBindingIsPrimary, ErrorCodeBindingNotManaged, ErrorCodeBindingUnsupported, ErrorCodeCancelFailed, ErrorCodeCatalogNotManaged, ErrorCodeConcurrentChange, ErrorCodeConflict, ErrorCodeConnectionError, ErrorCodeConnectionInUse, ErrorCodeCredentialsUnreadable, ErrorCodeCustomSqlForbidden, ErrorCodeCustomSqlRequiresReadOnly, ErrorCodeDestinationNotEligible, ErrorCodeDropFailed, ErrorCodeEncryptionFailed, ErrorCodeEncryptionUnavailable, ErrorCodeEngineError, ErrorCodeEngineInUse, ErrorCodeEngineRequired, ErrorCodeEngineUnavailable, ErrorCodeEngineUnreachable, ErrorCodeEngineUnsupported, ErrorCodeExecutionsRunning, ErrorCodeFolderCycle, ErrorCodeForbidden, ErrorCodeGrainNotAllowed, ErrorCodeIdpUnavailable, ErrorCodeInternal, ErrorCodeInternalError, ErrorCodeInvalidBundle, ErrorCodeInvalidCredentials, ErrorCodeInvalidDefinition, ErrorCodeInvalidIdentifier, ErrorCodeInvalidSql, ErrorCodeInvalidTimeRange, ErrorCodeNameConflict, ErrorCodeNameInUse, ErrorCodeNotDirect, ErrorCodeNotFound, ErrorCodeNotRunning, ErrorCodeNotSupported, ErrorCodePropertyNotOverridable, ErrorCodeProviderInUse, ErrorCodeProviderUnsupported, ErrorCodeRateLimited, ErrorCodeRefused, ErrorCodeReservedName, ErrorCodeServiceUnavailable, ErrorCodeSlugConflict, ErrorCodeSpaceMissing, ErrorCodeSpaceNotFound, ErrorCodeSyncInProgress, ErrorCodeTargetNotGranted, ErrorCodeTargetRequired, ErrorCodeTargetUnavailable, ErrorCodeTurnRunning, ErrorCodeUnauthorized, ErrorCodeUnsupportedBundleVersion, ErrorCodeUnsupportedSyntax, ErrorCodeUserInUse, ErrorCodeUserOwnsWorkspace, ErrorCodeValidationError, ErrorCodeVersionConflict, ErrorCodeWorkspaceNotFound, ErrorCodeWorkspacePersonal]
      enum:
        - account_suspended
        - agent_token_not_allowed
        - assistant_disabled
        - bad_request
        - binding_busy
        - binding_disabled
        - binding_exists
        - binding_is_primary
        - binding_not_managed
        - binding_unsupported
        - cancel_failed
        - catalog_not_managed
        - concurrent_change
        - conflict
        - connection_error
        - connection_in_use
        - credentials_unreadable
        - custom_sql_forbidden
        - custom_sql_requires_read_only
        - destination_not_eligible
        - drop_failed
        - encryption_failed
        - encryption_unavailable
        - engine_error
        - engine_in_use
        - engine_required
        - engine_unavailable
        - engine_unreachable
        - engine_unsupported
        - executions_running
        - folder_cycle
        - forbidden
        - grain_not_allowed
        - idp_unavailable
        - internal
        - internal_error
        - invalid_bundle
        - invalid_credentials
        - invalid_definition
        - invalid_identifier
        - invalid_sql
        - invalid_time_range
        - name_conflict
        - name_in_use
        - not_direct
        - not_found
        - not_running
        - not_supported
        - property_not_overridable
        - provider_in_use
        - provider_unsupported
        - rate_limited
        - refused
        - reserved_name
        - service_unavailable
        - slug_conflict
        - space_missing
        - space_not_found
        - sync_in_progress
        - target_not_granted
        - target_required
        - target_unavailable
        - turn_running
        - unauthorized
        - unsupported_bundle_version
        - unsupported_syntax
        - user_in_use
        - user_owns_workspace
        - validation_error
        - version_conflict
        - workspace_not_found
        - workspace_personal

    # Supported UI locales (#67): `en` is the source, `pt-BR` the first
    # translation. users.locale NULL means "follow the browser".
    Locale:
      type: string
      x-enum-varnames: [LocaleEn, LocalePtBR]
      enum: [en, pt-BR]

    FieldCode:
      type: string
      x-enum-varnames: [FieldCodeRequired, FieldCodeTooLong, FieldCodeInvalidFormat, FieldCodeOutOfRange, FieldCodeNotUnique, FieldCodeNotAllowed]
      enum: [required, too_long, invalid_format, out_of_range, not_unique, not_allowed]

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { $ref: "#/components/schemas/FieldCode" }
        params:
          type: object
          additionalProperties: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: "English, for logs and non-UI clients; never shown translated"
        params:
          type: object
          additionalProperties: true
          description: "Structured details (for version_conflict: current_version, updated_by, updated_at)"
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    ValidationError:
      type: object
      required: [code, message, errors]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    # ── Setup ──────────────────────────────────────────────────
    SetupStatus:
      type: object
      required: [is_configured, version]
      properties:
        is_configured: { type: boolean }
        version: { type: string, example: "0.1.0" }

    CreateAdminRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    # ── Auth ───────────────────────────────────────────────────
    SystemStatusSection:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unknown]
        error_code:
          type: string
          description: "Stable code for an unknown section; never a raw error, host or credential."
        latency_ms:
          type: integer
          minimum: 0
        version:
          type: string
        commit:
          type: string
        started_at:
          type: string
          format: date-time
        migration_version:
          type: integer
          format: int64
        configured:
          type: boolean

    SystemStatusItem:
      type: object
      description: "One platform component inside a status section."
      required: [name, status]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [ok, unknown, missing, degraded, unreachable]
        detail:
          type: string
          description: "Short bounded detail; never a host, credential or raw error."
        value: { type: integer, format: int64 }

    SystemStatusResource:
      type: object
      description: "A platform section. A slow or broken probe is `unknown` with a stable `error_code`."
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unknown, missing, degraded]
        error_code:
          type: string
          description: "Stable code; never a raw error."
        items:
          type: array
          items: { $ref: "#/components/schemas/SystemStatusItem" }

    SystemStatus:
      type: object
      required: [baleia, database, temporal, object_storage, smtp, schedules, engines, bindings, metadata, reconcile, audit_export, plugin]
      properties:
        baleia: { $ref: "#/components/schemas/SystemStatusSection" }
        database: { $ref: "#/components/schemas/SystemStatusSection" }
        temporal: { $ref: "#/components/schemas/SystemStatusSection" }
        object_storage: { $ref: "#/components/schemas/SystemStatusSection" }
        smtp: { $ref: "#/components/schemas/SystemStatusSection" }
        schedules: { $ref: "#/components/schemas/SystemStatusResource" }
        engines: { $ref: "#/components/schemas/SystemStatusResource" }
        bindings: { $ref: "#/components/schemas/SystemStatusResource" }
        metadata: { $ref: "#/components/schemas/SystemStatusResource" }
        reconcile: { $ref: "#/components/schemas/SystemStatusResource" }
        audit_export: { $ref: "#/components/schemas/SystemStatusResource" }
        plugin: { $ref: "#/components/schemas/SystemStatusResource" }

    LoginRequest:
      type: object
      required: [password]
      properties:
        email:
          type: string
          format: email
          description: "Local login. Ignored when `provider_id` is set."
        username:
          type: string
          description: "Directory username. Required when `provider_id` is set."
        provider_id:
          type: string
          format: uuid
          description: "LDAP provider id. When set, `/auth/login` authenticates against the directory and ignores `email`."
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        refresh_token:
          type: string
          description: "Only returned to API clients that send `X-Baleia-Client: api`. Browsers receive the refresh token in the HttpOnly `baleia_refresh` cookie."
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/UserPublic" }

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: "Optional when the `baleia_refresh` cookie is present."

    RefreshResponse:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        refresh_token:
          type: string
          description: "Only returned to API clients that send `X-Baleia-Client: api`. Browsers receive the rotated refresh token in the HttpOnly `baleia_refresh` cookie."
        expires_at: { type: string, format: date-time }

    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string }

    OIDCProvider:
      type: object
      description: "Experimental OIDC identity provider (phase 4)."
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Okta" }
        type: { type: string, enum: [oidc] }

    AuthProvider:
      type: object
      description: "An enabled login provider. Configuration and secrets are never returned."
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [oidc, ldap] }

    AttentionKind:
      type: string
      description: "What needs attention. `agent_token_expiring` appears once the agent platform lands (#59)."
      enum:
        - binding_error
        - metadata_sync_failed
        - metadata_stale
        - engine_unreachable
        - retriever_error
        - reconcile_drift
        - schedule_missing
        - audit_export_lagging
        - agent_token_expiring

    AttentionSeverity:
      type: string
      enum: [warning, error]

    AttentionResource:
      type: object
      description: "The entity to act on. `id` is opaque to the client; `href` is the SPA route that fixes it."
      required: [type, id, name]
      properties:
        type: { type: string, enum: [binding, catalog, engine, retriever, schedule, audit_export, agent_token] }
        id: { type: string }
        name: { type: string }

    AttentionItem:
      type: object
      required: [kind, severity, resource, since]
      properties:
        kind: { $ref: "#/components/schemas/AttentionKind" }
        severity: { $ref: "#/components/schemas/AttentionSeverity" }
        resource: { $ref: "#/components/schemas/AttentionResource" }
        params:
          type: object
          description: "Kind-specific, safe values only (never hosts, credentials or raw upstream errors)."
          additionalProperties: { type: string }
        since: { type: string, format: date-time }
        href: { type: string, description: "SPA route that fixes the item." }
    IdentityProviderType:
      type: string
      enum: [oidc, ldap]

    IdentityRoleMapping:
      type: object
      description: "Binds a directory group to a platform role."
      required: [group, role]
      properties:
        group: { type: string, minLength: 1 }
        role: { type: string, enum: [admin, member] }

    IdentityTeamMapping:
      type: object
      description: "Binds a directory group to a team and role."
      required: [group, team_id, team_role]
      properties:
        group: { type: string, minLength: 1 }
        team_id: { type: string }
        team_role: { type: string, enum: [owner, member] }

    OIDCClaimsConfig:
      type: object
      description: "Claim names published by the provider; empty uses the standard name."
      properties:
        subject: { type: string }
        email: { type: string }
        name: { type: string }
        groups: { type: string }

    OIDCConfig:
      type: object
      description: "OIDC provider configuration written once. `client_secret` is never returned."
      required: [issuer_url, client_id, client_secret]
      properties:
        issuer_url: { type: string, format: uri }
        client_id: { type: string, minLength: 1 }
        client_secret: { type: string, minLength: 1 }
        auto_create: { type: boolean, default: false, description: "Provision unknown subjects. Default deny; requires allowed_email_domains." }
        allowed_email_domains: { type: array, items: { type: string } }
        role_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityRoleMapping" } }
        team_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityTeamMapping" } }
        default_role: { type: string, enum: [admin, member] }
        claims: { $ref: "#/components/schemas/OIDCClaimsConfig" }

    OIDCConfigAdmin:
      type: object
      description: "OIDC provider configuration without the client secret."
      properties:
        issuer_url: { type: string }
        client_id: { type: string }
        auto_create: { type: boolean }
        allowed_email_domains: { type: array, items: { type: string } }
        role_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityRoleMapping" } }
        team_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityTeamMapping" } }
        default_role: { type: string, enum: [admin, member] }
        claims: { $ref: "#/components/schemas/OIDCClaimsConfig" }

    LDAPConfig:
      type: object
      description: "LDAP provider configuration written once. `bind_password` is never returned."
      required: [url, bind_dn, bind_password, base_dn, user_filter]
      properties:
        url: { type: string, description: "ldaps:// or ldap:// (requires start_tls)." }
        start_tls: { type: boolean }
        bind_dn: { type: string }
        bind_password: { type: string }
        base_dn: { type: string }
        user_filter: { type: string, description: "Must contain exactly one {{username}} placeholder." }
        group_attribute: { type: string }
        email_attribute: { type: string }
        name_attribute: { type: string }
        nested_groups: { type: boolean }
        required_group: { type: string }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60 }
        role_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityRoleMapping" } }
        team_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityTeamMapping" } }
        default_role: { type: string, enum: [admin, member] }

    LDAPConfigAdmin:
      type: object
      description: "LDAP provider configuration without the bind password."
      properties:
        url: { type: string }
        start_tls: { type: boolean }
        bind_dn: { type: string }
        base_dn: { type: string }
        user_filter: { type: string }
        group_attribute: { type: string }
        email_attribute: { type: string }
        name_attribute: { type: string }
        nested_groups: { type: boolean }
        required_group: { type: string }
        timeout_seconds: { type: integer }
        role_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityRoleMapping" } }
        team_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityTeamMapping" } }
        default_role: { type: string, enum: [admin, member] }

    IdentityProvider:
      type: object
      required: [id, name, type, enabled, has_client_secret, has_bind_password, linked_users, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/IdentityProviderType" }
        enabled: { type: boolean }
        has_client_secret: { type: boolean, description: "An OIDC client secret is stored (never returned)." }
        has_bind_password: { type: boolean, description: "An LDAP bind password is stored (never returned)." }
        linked_users: { type: integer, description: "Users currently linked to this provider." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IdentityProviderDetail:
      type: object
      description: "A provider with its redacted configuration."
      required: [id, name, type, enabled, has_client_secret, has_bind_password, linked_users, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/IdentityProviderType" }
        enabled: { type: boolean }
        has_client_secret: { type: boolean }
        has_bind_password: { type: boolean }
        linked_users: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        oidc: { $ref: "#/components/schemas/OIDCConfigAdmin" }
        ldap: { $ref: "#/components/schemas/LDAPConfigAdmin" }

    CreateIdentityProviderRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "#/components/schemas/IdentityProviderType" }
        enabled: { type: boolean, default: true }
        oidc: { $ref: "#/components/schemas/OIDCConfig" }
        ldap: { $ref: "#/components/schemas/LDAPConfig" }

    UpdateOIDCConfig:
      type: object
      description: "OIDC configuration update. Omitted fields keep their stored value; an empty `client_secret` clears it."
      properties:
        issuer_url: { type: string, format: uri }
        client_id: { type: string, minLength: 1 }
        client_secret:
          type: string
          description: "Omit to keep the stored secret; send an empty string to clear it."
        auto_create: { type: boolean }
        allowed_email_domains: { type: array, items: { type: string } }
        role_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityRoleMapping" } }
        team_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityTeamMapping" } }
        default_role: { type: string, enum: [admin, member] }
        claims: { $ref: "#/components/schemas/OIDCClaimsConfig" }

    UpdateLDAPConfig:
      type: object
      description: "LDAP configuration update. Omitted fields keep their stored value; an empty `bind_password` clears it."
      properties:
        url: { type: string }
        start_tls: { type: boolean }
        bind_dn: { type: string }
        bind_password:
          type: string
          description: "Omit to keep the stored secret; send an empty string to clear it."
        base_dn: { type: string }
        user_filter: { type: string }
        group_attribute: { type: string }
        email_attribute: { type: string }
        name_attribute: { type: string }
        nested_groups: { type: boolean }
        required_group: { type: string }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60 }
        role_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityRoleMapping" } }
        team_mapping: { type: array, items: { $ref: "#/components/schemas/IdentityTeamMapping" } }
        default_role: { type: string, enum: [admin, member] }

    UpdateIdentityProviderRequest:
      type: object
      description: "Partial update. The provider type is immutable; a config of the other type is rejected."
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        oidc: { $ref: "#/components/schemas/UpdateOIDCConfig" }
        ldap: { $ref: "#/components/schemas/UpdateLDAPConfig" }

    IdentityProviderTestCheck:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, failed, skipped] }
        message:
          type: string
          description: "Short stable code; never a secret, host or raw error."

    IdentityProviderTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/IdentityProviderTestCheck" }

    TestIdentityProviderRequest:
      type: object
      description: "An unsaved provider configuration to probe. Nothing is persisted."
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/IdentityProviderType" }
        oidc: { $ref: "#/components/schemas/OIDCConfig" }
        ldap: { $ref: "#/components/schemas/LDAPConfig" }
        test_username:
          type: string
          description: "Directory username to look up. The probe never binds as this user."

    IdentityMappingPreviewRequest:
      type: object
      description: "Groups and mapping rules evaluated exactly as login does."
      required: [groups]
      properties:
        groups:
          type: array
          items: { type: string }
        role_mapping:
          type: array
          items: { $ref: "#/components/schemas/IdentityRoleMapping" }
        team_mapping:
          type: array
          items: { $ref: "#/components/schemas/IdentityTeamMapping" }
        default_role: { type: string, enum: [admin, member] }

    IdentityTeamAssignment:
      type: object
      required: [team_id, team_role]
      properties:
        team_id: { type: string }
        team_role: { type: string, enum: [owner, member] }

    IdentityMappingPreview:
      type: object
      required: [role, teams]
      properties:
        role: { type: string, enum: [admin, member] }
        teams:
          type: array
          items: { $ref: "#/components/schemas/IdentityTeamAssignment" }

    PasswordResetRequestBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PasswordResetConfirmBody:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }

    # ── API Keys ───────────────────────────────────────────────
    ApiKey:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, example: "bal_abc..." }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "Displayed only once upon creation"

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }

    # ── Agents (#59) ───────────────────────────────────────────
    AgentAllowedAction:
      type: string
      enum: [view, update, disable, delete, manage_tokens, manage_policy]
    AgentWorkspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Agent:
      type: object
      required: [id, owner_id, name, status, workspaces, created_at, allowed_actions]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, disabled] }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/AgentWorkspace" }
        active_token_count: { type: integer, minimum: 0 }
        next_token_expiry: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        allowed_actions:
          type: array
          items: { $ref: "#/components/schemas/AgentAllowedAction" }
    AgentToken:
      type: object
      required: [id, name, prefix, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: "bal_agt_abc12345..." }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AgentTokenCreated:
      allOf:
        - $ref: "#/components/schemas/AgentToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: "Displayed only once upon creation"
    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        workspace_ids:
          type: array
          items: { type: string, format: uuid }
    UpdateAgentRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        workspace_ids:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [active, disabled] }
    CreateAgentTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expires_in_days: { type: integer, minimum: 1 }

    AgentPolicyLimits:
      type: object
      properties:
        max_rows_returned: { type: integer, minimum: 0 }
        max_result_bytes: { type: integer, minimum: 0 }
        max_query_runtime_seconds: { type: integer, minimum: 0 }
        max_concurrent_queries: { type: integer, minimum: 0 }
        max_queries_per_hour: { type: integer, minimum: 0 }
        max_tool_calls_per_minute: { type: integer, minimum: 0 }
    AgentPolicy:
      type: object
      required: [version]
      properties:
        version: { type: integer, enum: [1] }
        tools:
          type: array
          items: { type: string }
        catalogs:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        engines:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        max_rows_returned: { type: integer, minimum: 0 }
        max_result_bytes: { type: integer, minimum: 0 }
        max_query_runtime_seconds: { type: integer, minimum: 0 }
        max_concurrent_queries: { type: integer, minimum: 0 }
        max_queries_per_hour: { type: integer, minimum: 0 }
        max_tool_calls_per_minute: { type: integer, minimum: 0 }
    AgentPolicyResponse:
      type: object
      required: [policy, stored, ceilings]
      properties:
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        stored: { $ref: "#/components/schemas/AgentPolicy" }
        ceilings: { $ref: "#/components/schemas/AgentPolicyLimits" }

    AgentTool:
      type: object
      required: [name, label, description, read_only]
      properties:
        name: { type: string }
        label: { type: string }
        description: { type: string }
        read_only: { type: boolean }
    AgentsMeta:
      type: object
      required: [mcp_url, token_default_ttl_days, token_max_ttl_days, tools]
      properties:
        mcp_url: { type: string }
        token_default_ttl_days: { type: integer, minimum: 1 }
        token_max_ttl_days: { type: integer, minimum: 1 }
        tools:
          type: array
          items: { $ref: "#/components/schemas/AgentTool" }
    AgentEngineEligibility:
      type: object
      required: [engine_id, engine_name, kind, status]
      properties:
        engine_id: { type: string, format: uuid }
        engine_name: { type: string }
        kind: { type: string }
        status:
          type: string
          enum: [ok, read_only_not_enforced, excluded_by_policy]
    AgentCatalogEligibility:
      type: object
      required: [catalog_id, catalog_name, engines]
      properties:
        catalog_id: { type: string, format: uuid }
        catalog_name: { type: string }
        engines:
          type: array
          items: { $ref: "#/components/schemas/AgentEngineEligibility" }

    # ── Assistant (#62) ────────────────────────────────────────
    AssistantStatus:
      type: object
      required: [enabled, data_sharing]
      properties:
        enabled: { type: boolean }
        data_sharing: { type: string, enum: [metadata_only, metadata_and_samples] }
    AssistantSettings:
      type: object
      required:
        [enabled, data_sharing, api_key_set, max_turn_seconds, max_tool_calls_per_turn,
         max_output_tokens_per_turn, daily_token_budget_per_user]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [anthropic, openai_compatible], nullable: true }
        base_url: { type: string, nullable: true }
        model: { type: string, nullable: true }
        api_key_set: { type: boolean, description: "The key is write-only; GET never returns it" }
        data_sharing: { type: string, enum: [metadata_only, metadata_and_samples] }
        max_turn_seconds: { type: integer, minimum: 1 }
        max_tool_calls_per_turn: { type: integer, minimum: 1 }
        max_output_tokens_per_turn: { type: integer, minimum: 1 }
        daily_token_budget_per_user: { type: integer, minimum: 0 }
    UpdateAssistantSettingsRequest:
      type: object
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [anthropic, openai_compatible] }
        base_url: { type: string }
        model: { type: string }
        api_key: { type: string, description: "Write-only; omit or leave empty to keep the stored key" }
        data_sharing: { type: string, enum: [metadata_only, metadata_and_samples] }
        max_turn_seconds: { type: integer, minimum: 1 }
        max_tool_calls_per_turn: { type: integer, minimum: 1 }
        max_output_tokens_per_turn: { type: integer, minimum: 1 }
        daily_token_budget_per_user: { type: integer, minimum: 0 }
    AssistantTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }
        error: { type: string, nullable: true }
    AssistantConversation:
      type: object
      required: [id, workspace_id, title, state, last_seq, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        state: { type: string, enum: [idle, running, interrupted] }
        last_seq: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssistantMessage:
      type: object
      required: [seq, role, content, created_at]
      properties:
        seq: { type: integer, minimum: 1 }
        role: { type: string, enum: [user, assistant, tool_call, tool_result, notice] }
        content: {}
        input_tokens: { type: integer, nullable: true }
        output_tokens: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    AssistantConversationDetail:
      allOf:
        - $ref: "#/components/schemas/AssistantConversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/AssistantMessage" }
    CreateAssistantConversationRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id: { type: string, format: uuid }
    SendAssistantMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
    SendAssistantMessageResponse:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, minimum: 1 }

    # ── Users ──────────────────────────────────────────────────
    UserPublic:
      type: object
      required: [id, name, email, role, auth_provider, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
        auth_provider: { type: string, enum: [local, oidc, ldap] }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
        locale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          nullable: true
          description: "UI language preference; null follows the browser (#67)."

    # ── Allowed actions (#104) ──────────────────────────────────
    CatalogConnectionAllowedAction:
      type: string
      enum: [view, update, delete, test, register_engine, create_catalog]
    EngineAllowedAction:
      type: string
      enum: [view, update, delete, test, reconcile, bind_into]
    CatalogAllowedAction:
      type: string
      enum: [view, browse, update, delete, sync_metadata, grant, create_binding]
    CatalogBindingAllowedAction:
      type: string
      enum: [view, update, delete, sync]
    WorkspaceAllowedAction:
      type: string
      x-enum-varnames: [WorkspaceAllowedActionView, WorkspaceAllowedActionUpdate, WorkspaceAllowedActionDelete,
                        WorkspaceAllowedActionManageGrants, WorkspaceAllowedActionSetDefaults,
                        WorkspaceAllowedActionRun, WorkspaceAllowedActionCreateSpace]
      enum: [view, update, delete, manage_grants, set_defaults, run, create_space]
    GlobalAction:
      type: string
      enum: [create_connection, create_workspace, create_shared_workspace, manage_users,
             manage_identity, view_all_audit, view_system, manage_assistant]
    Features:
      type: object
      required: [agents, assistant, retrievers]
      properties:
        agents: { type: boolean }
        assistant: { type: boolean }
        retrievers: { type: boolean }
    Me:
      allOf:
        - $ref: "#/components/schemas/UserPublic"
        - type: object
          required: [features, global_actions]
          properties:
            personal_workspace_id: { type: string, format: uuid, nullable: true }
            features: { $ref: "#/components/schemas/Features" }
            global_actions:
              type: array
              items: { $ref: "#/components/schemas/GlobalAction" }

    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        locale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          nullable: true
          description: "UI language preference; null follows the browser (#67)."

    UpdatePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, member] }

    SuspendUserRequest:
      type: object
      properties:
        reason:
          type: string
          enum: [admin, policy]
          default: admin

    DirectoryReconcileAction:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        action: { type: string, enum: [suspend, reinstate, role, team] }
        detail: { type: string }

    DirectoryReconcileRun:
      type: object
      required: [id, provider_id, started_at, outcome, seen, suspended, reinstated, actions]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        outcome: { type: string, enum: [success, error, aborted_safety] }
        seen: { type: integer }
        suspended: { type: integer }
        reinstated: { type: integer }
        error: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/DirectoryReconcileAction" }

    # ── Teams ──────────────────────────────────────────────────
    Team:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    TeamMember:
      type: object
      required: [user, role, joined_at]
      properties:
        user: { $ref: "#/components/schemas/UserPublic" }
        role: { type: string, enum: [owner, member] }
        joined_at: { type: string, format: date-time }

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    AddTeamMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, member], default: member }

    UpdateTeamMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [owner, member] }

    # ── Workspaces ─────────────────────────────────────────────
    Workspace:
      type: object
      required: [id, name, type, created_at, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/WorkspaceAllowedAction" }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        type: { type: string, enum: [personal, shared] }
        polaris_catalog_name: { type: string, deprecated: true, description: "Legacy; never used to resolve an execution target" }
        default_binding_id: { type: string, format: uuid, nullable: true, description: "Target used when a run names none (GET /workspaces/{id}/targets)" }
        default_schema: { type: string, nullable: true }
        owner_user_id: { type: string, format: uuid, nullable: true }
        owner_team_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceImpact:
      type: object
      required: [saved_queries, metrics, spaces, running_executions, default_target_affected]
      properties:
        saved_queries: { type: integer }
        metrics: { type: integer }
        spaces: { type: integer }
        running_executions: { type: integer }
        default_target_affected: { type: boolean }

    CreateWorkspaceRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [personal, shared] }
        owner_team_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: "Required when type=shared",
          }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        default_target:
          type: object
          description: >
            Sets the workspace default target ({"binding_id": null} clears it).
            The binding must be a target of the workspace
            (GET /workspaces/{id}/targets). Omitted, the default is unchanged.
          properties:
            binding_id: { type: string, format: uuid, nullable: true }
            schema: { type: string, nullable: true }

    TargetRequest:
      type: object
      description: >
        Where to run. binding_id names a target; catalog_id picks the catalog's
        only enabled binding, or the one on engine_id when it has several.
        Omitted, the workspace default applies, else the workspace's only
        target; otherwise 422 target_required.
      properties:
        binding_id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        schema: { type: string }

    ExecutionTarget:
      type: object
      description: "The target an execution ran on, as recorded when it started"
      properties:
        engine_id: { type: string, format: uuid, nullable: true }
        binding_id: { type: string, format: uuid, nullable: true }
        catalog_id: { type: string, format: uuid, nullable: true }
        engine_kind: { type: string }
        engine_name: { type: string }
        catalog_name: { type: string }
        engine_catalog: { type: string }
        schema: { type: string, nullable: true }
        read_only: { type: boolean }

    WsTicketRequest:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
          description: "Scope the ticket to one execution; the WebSocket rejects another"

    WsTicket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket: { type: string }
        expires_at: { type: string, format: date-time }

    WorkspaceTarget:
      type: object
      required: [binding_id, catalog_id, catalog_name, engine_id, engine_name, engine_kind, engine_catalog_name, mode, permission, is_default]
      properties:
        binding_id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        catalog_name: { type: string }
        engine_id: { type: string, format: uuid }
        engine_name: { type: string }
        engine_kind: { type: string }
        engine_catalog_name: { type: string }
        mode: { type: string, enum: [managed, adopted, native] }
        permission: { type: string, enum: [read, write], description: "read targets run in read-only sessions where the engine enforces it" }
        is_default: { type: boolean }

    # ── Catalogs ─────────────────────────────────────────────────
    Catalog:
      type: object
      required: [allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/CatalogAllowedAction" }
        id:                  { type: string, format: uuid }
        connection_id:       { type: string, format: uuid }
        name:                { type: string }
        description:         { type: string, nullable: true }
        trino_catalog_name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
          description: Trino catalog identifier (lowercase, letters/digits/underscore).
        warehouse:           { type: string, description: Iceberg warehouse identifier }
        connector:
          type: string
          default: iceberg
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        enabled:             { type: boolean, default: true }
        sync_status:
          type: string
          enum: [pending, synced, error, draining, disabled]
          readOnly: true
          description: The derived sync status of the catalog's binding on its Trino cluster (see CatalogBinding.sync_status; draining is no longer produced).
        sync_error:          { type: string, nullable: true, readOnly: true }
        catalog_version:    { type: string, nullable: true, readOnly: true, description: SHA-256 hash of the registered properties (matches the plugin's computeCatalogVersion) }
        metadata_synced_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: End of the latest finished metadata pass of the catalog (#17); null before the first one.
        metadata_sync_status:
          type: string
          enum: [never, running, finished, failed]
          readOnly: true
          description: Status of the latest metadata pass. Every catalog is refreshed every BALEIA_METADATA_SYNC_INTERVAL (15m) and right after it is created or changed.
        metadata_sync_error_code:
          type: string
          nullable: true
          readOnly: true
          description: The latest pass's error code when it failed (see MetadataSyncRun.error_code).
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }

    CatalogEngineRef:
      type: object
      required: [id, name, kind, class]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        class: { type: string }

    CatalogBindingRef:
      type: object
      required: [id, engine, engine_catalog_name, mode, lifecycle_state]
      properties:
        id: { type: string, format: uuid }
        engine: { $ref: "#/components/schemas/CatalogEngineRef" }
        engine_catalog_name: { type: string }
        connector: { type: string, nullable: true }
        mode: { type: string, description: "managed, adopted or native" }
        lifecycle_state: { type: string }
        sync_status: { type: string, nullable: true }
        state_changed_at: { type: string, format: date-time, nullable: true }

    CatalogSummary:
      allOf:
        - $ref: "#/components/schemas/Catalog"
        - type: object
          required: [origin, bindings, needs_attention]
          properties:
            origin: { type: string, description: "source or native" }
            provider_kind: { type: string, nullable: true }
            connection:
              allOf: [{ $ref: "#/components/schemas/EngineConnectionRef" }]
              nullable: true
              description: "Null when the caller cannot view the connection"
            source_ref: { type: string, nullable: true }
            bindings:
              type: array
              items: { $ref: "#/components/schemas/CatalogBindingRef" }
            needs_attention: { type: boolean }
            namespace_count: { type: integer }
            table_count: { type: integer }

    CatalogImpact:
      type: object
      required: [bindings, grants, saved_queries_targeting, metrics, docs, running_executions]
      properties:
        bindings: { type: integer }
        grants: { type: integer }
        saved_queries_targeting: { type: integer }
        metrics: { type: integer }
        docs: { type: integer }
        running_executions: { type: integer }

    CatalogConnectionImpact:
      type: object
      required: [catalogs, bindings, running_executions]
      properties:
        engine:
          allOf: [{ $ref: "#/components/schemas/EngineConnectionRef" }]
          nullable: true
          description: "The engine this connection backs, if any"
        catalogs: { type: integer }
        bindings: { type: integer }
        running_executions: { type: integer }

    CatalogGrant:
      type: object
      required: [workspace, permission, granted_at]
      properties:
        workspace:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { type: string }
        permission: { type: string, enum: [read, write] }
        granted_by: { type: string, format: uuid, nullable: true }
        granted_at: { type: string, format: date-time }

    BindingProjection:
      type: object
      required: [connector, properties]
      properties:
        connector: { type: string }
        version: { type: string, nullable: true }
        properties:
          type: object
          additionalProperties: { type: string }
          description: "Engine-side properties; secret keys are masked as ***"

    UpdateCatalogDetailRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }

    CreateCatalogRequest:
      type: object
      required: [name, trino_catalog_name, warehouse]
      properties:
        name:               { type: string }
        trino_catalog_name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        warehouse:          { type: string }
        connector:
          type: string
          default: iceberg
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        description:        { type: string }
        extra_props:
          type: object
          additionalProperties: { type: string }
          description: Connector-specific overrides (flat string→string map) merged on top of the auto-generated properties.
        enabled:            { type: boolean, default: true }

    # ── Catalog Connections ────────────────────────────────────
    CatalogConnection:
      type: object
      required: [id, name, type, url, config, default_readonly, has_credentials, credentials_read_only, created_at, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/CatalogConnectionAllowedAction" }
        id:   { type: string, format: uuid }
        name: { type: string }
        type: { type: string, description: "Connection kind; one of the kinds listed by GET /connection-providers" }
        url:  { type: string, description: "Deprecated: read config. Kept while the Trino projection still reads it (#80)" }
        config:
          type: object
          additionalProperties: { type: string }
          description: "Non-secret values of the provider's config schema. Secret fields are never returned"
        host: { type: string }
        port: { type: string }
        has_credentials: { type: boolean, description: "Whether stored credentials exist; the secret itself is never returned" }
        default_readonly: { type: boolean }
        credentials_read_only: { type: boolean, description: "The administrator asserts these credentials cannot modify data. Required for read-only grants and agents on engines that cannot enforce read-only sessions (#11/#13/#59)" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCatalogConnectionRequest:
      type: object
      required: [name, type]
      description: >
        Values and secrets are validated against the provider's config schema
        (GET /connection-providers): unknown keys, missing required fields and
        kinds without a provider answer 422. Non-secret fields go in `config`,
        secret fields in `credentials`. `url` and the typed `*_credentials`
        objects are the older shape and are still accepted.
      properties:
        name: { type: string }
        type: { type: string, description: "A kind listed by GET /connection-providers" }
        url: { type: string, description: "Older shape: the endpoint URL (a JDBC URL for databases). Prefer config" }
        config:
          type: object
          additionalProperties: { type: string }
          description: "Non-secret fields of the provider's config schema"
        default_readonly: { type: boolean, default: true }
        credentials_read_only:
          { type: boolean, default: false, description: "The administrator asserts these credentials cannot modify data. Required for read-only grants and agents on engines that cannot enforce read-only sessions (#11/#13/#59)" }
        credentials:
          type: object
          description: "Secret fields of the provider's config schema. Older clients also send non-secret fields here (client_id, username); they are moved to config"
        nessie_credentials:
          $ref: "#/components/schemas/NessieCredentials"
        glue_credentials:
          $ref: "#/components/schemas/GlueCredentials"
        hive_credentials:
          $ref: "#/components/schemas/HiveCredentials"
        iceberg_credentials:
          $ref: "#/components/schemas/IcebergCredentials"
        postgresql_credentials:
          $ref: "#/components/schemas/SqlCredentials"
        mysql_credentials:
          $ref: "#/components/schemas/SqlCredentials"

    # ── Catalog Connection Credentials ───────────────────

    IcebergCredentials:
      type: object
      properties:
        token: { type: string, description: "Bearer token" }
        client_id: { type: string, description: "OAuth2 client ID" }
        client_secret: { type: string, description: "OAuth2 client secret" }
        oauth2_server_uri:
          { type: string, description: "OAuth2 token endpoint custom" }

    PolarisCredentials:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        realm:
          { type: string, description: "Realm do Polaris. Default: POLARIS" }

    NessieCredentials:
      type: object
      properties:
        token: { type: string, description: "Bearer token optional" }

    GlueCredentials:
      type: object
      required: [access_key_id, secret_access_key, region]
      properties:
        access_key_id: { type: string }
        secret_access_key: { type: string }
        region: { type: string }

    HiveCredentials:
      type: object
      properties:
        username: { type: string }
        password: { type: string }

    SqlCredentials:
      type: object
      properties:
        username: { type: string }
        password: { type: string }

    UpdateCatalogConnectionRequest:
      type: object
      description: >
        Partial update. `config` keys are merged into the stored values (an
        empty string clears an optional field). `credentials` keys replace the
        stored secrets they name; secrets that are absent are kept. The result
        is validated like a create.
      properties:
        name: { type: string }
        url: { type: string, description: "Older shape: the endpoint URL. Prefer config" }
        config:
          type: object
          additionalProperties: { type: string }
        credentials: { type: object }
        default_readonly: { type: boolean }
        credentials_read_only:
          { type: boolean, description: "The administrator asserts these credentials cannot modify data (#11/#13/#59)" }

    Engine:
      type: object
      required: [id, name, kind, class, connection_id, identity_mode, enabled, created_at, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/EngineAllowedAction" }
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, description: "Query-engine kind: trino, postgresql, mysql, …" }
        class: { type: string, enum: [federated, direct] }
        connection_id: { type: string, format: uuid }
        identity_mode: { type: string, enum: [impersonation, connection, per_user] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version:
          type: string
          nullable: true
          description: "Server version reported by the engine (cached 5 minutes); null when unknown or unreachable"
        capabilities:
          allOf: [{ $ref: "#/components/schemas/EngineCapabilities" }]
          nullable: true
          description: "What the engine can do; null when the engine is disabled or no adapter for its kind is available yet"
        dialect:
          allOf: [{ $ref: "#/components/schemas/EngineDialect" }]
          nullable: true
          description: "How to write SQL for it; keyword and function lists are at GET /dialects/{name}"
        health:
          allOf: [{ $ref: "#/components/schemas/EngineHealth" }]
          nullable: true
          description: "Result of the latest reachability probe; unknown before the first probe"
        connection:
          allOf: [{ $ref: "#/components/schemas/EngineConnectionRef" }]
          nullable: true
        catalog_count:
          type: integer
          description: "Distinct logical catalogs bound to this engine"
        credentials_read_only:
          type: boolean
          description: "Copied from the connection: its credentials only allow reads"

    EngineHealth:
      type: object
      required: [status]
      properties:
        status: { type: string, description: "ok, unreachable or unknown" }
        checked_at: { type: string, format: date-time, nullable: true }
        error_code: { type: string, nullable: true }

    EngineConnectionRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    EngineObservation:
      type: object
      required: [catalog_name, present, mode, first_seen_at, observed_at]
      properties:
        catalog_name: { type: string }
        connector: { type: string, nullable: true }
        present: { type: boolean }
        mode: { type: string, description: "managed or adopted" }
        first_seen_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }

    EngineImpact:
      type: object
      required: [managed_bindings, native_catalogs, grants, metrics, docs, saved_queries_targeting, running_executions]
      properties:
        managed_bindings: { type: integer }
        native_catalogs: { type: integer }
        grants: { type: integer }
        metrics: { type: integer }
        docs: { type: integer }
        saved_queries_targeting: { type: integer }
        running_executions: { type: integer }

    DiscoverResult:
      type: object
      required: [added, disabled, unchanged]
      properties:
        added:
          type: array
          items: { type: string }
        disabled:
          type: array
          items: { type: string }
        unchanged:
          type: array
          items: { type: string }

    EngineCapabilities:
      type: object
      description: >
        What an engine can do. Capabilities never authorize anything: what a
        user may run is decided by policy (catalog DDL is never allowed in the
        editor, whatever supports_catalog_ddl says).
      required: [dialect, identity_modes, read_only, supports_cancel, transactions, multiple_result_sets,
        multiple_catalogs, namespace_depth, session_schema, supports_explain, supports_time_travel,
        supports_catalog_ddl, monitoring, iceberg_maintenance, arrow_native, max_identifier_length, identifier_case]
      properties:
        dialect: { type: string }
        identity_modes:
          type: array
          items: { type: string, enum: [impersonation, connection, per_user] }
        read_only: { type: string, enum: [enforced, none], description: "enforced: the engine guarantees read-only sessions; none: only a read-only database role can" }
        supports_cancel: { type: boolean }
        cancel_scope: { type: string, enum: [any_process, in_process], nullable: true }
        transactions: { type: boolean }
        multiple_result_sets: { type: boolean }
        multiple_catalogs: { type: boolean }
        namespace_depth: { type: integer, description: "Schema depth in SQL; 0 when the engine has no schemas" }
        session_schema: { type: boolean }
        supports_explain: { type: boolean }
        supports_time_travel: { type: boolean }
        supports_catalog_ddl: { type: boolean, description: "Informational only" }
        monitoring: { type: boolean }
        iceberg_maintenance: { type: boolean }
        arrow_native: { type: boolean }
        max_identifier_length: { type: integer, description: "0 when unknown" }
        identifier_case: { type: string, enum: [preserve, lower, upper] }

    EngineDialect:
      type: object
      required: [name, formatter_language, codemirror_base]
      properties:
        name: { type: string }
        formatter_language: { type: string, description: "sql-formatter language id" }
        codemirror_base: { type: string, description: "@codemirror/lang-sql base dialect" }

    Dialect:
      allOf:
        - $ref: "#/components/schemas/EngineDialect"
        - type: object
          required: [keywords, functions]
          properties:
            keywords: { type: array, items: { type: string } }
            functions: { type: array, items: { type: string } }

    SplitStatementsRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string, maxLength: 1048576 }

    ExplainRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string, maxLength: 1048576 }

    ExplainResult:
      type: object
      required: [supported]
      properties:
        supported: { type: boolean }
        sql: { type: string, nullable: true }

    StatementSpan:
      type: object
      required: [start, end]
      description: "One statement, as offsets into the submitted SQL in UTF-16 code units (JavaScript string indices), end exclusive"
      properties:
        start: { type: integer }
        end: { type: integer }

    CreateEngineRequest:
      type: object
      required: [name, connection_id]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_-]{0,62}$" }
        connection_id: { type: string, format: uuid, description: "A connection whose provider has the direct_engine role" }

    UpdateEngineRequest:
      type: object
      properties:
        enabled: { type: boolean }

    AuditEvent:
      type: object
      required: [id, occurred_at, actor_kind, action, resource_type, outcome]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_kind: { type: string, enum: [user, service, agent, anonymous] }
        actor_id: { type: string, nullable: true }
        auth_method: { type: string, nullable: true }
        action: { type: string, description: "<resource>.<verb>, from a bounded vocabulary (internal/audit/actions.go)" }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        workspace_id: { type: string, format: uuid, nullable: true }
        outcome: { type: string, enum: [allowed, denied, error] }
        reason: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        client_ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        changes:
          type: object
          nullable: true
          description: '{"field": {"from": …, "to": …}}; secret values are "***"'
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}

    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor: { type: string, nullable: true }

    AuditResolveRequest:
      type: object
      properties:
        users: { type: array, items: { type: string, format: uuid } }
        workspaces: { type: array, items: { type: string, format: uuid } }
        connections: { type: array, items: { type: string, format: uuid } }
        catalogs: { type: array, items: { type: string, format: uuid } }

    AuditResolvedUser:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string }

    AuditResolvedName:
      type: object
      required: [name]
      properties:
        name: { type: string }

    AuditResolveResult:
      type: object
      properties:
        users:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AuditResolvedUser" }
        workspaces:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AuditResolvedName" }
        connections:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AuditResolvedName" }
        catalogs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AuditResolvedName" }

    ReconcileAction:
      type: object
      required: [catalog, kind, reason, result]
      properties:
        catalog: { type: string, description: "The catalog's name in the engine" }
        kind: { type: string, enum: [create, recreate, drop, none] }
        reason: { type: string, description: "missing_in_engine, version_mismatch, binding_in_error, pending_drop, already_dropped, unprojectable, unknown" }
        result: { type: string, enum: [applied, failed, skipped_dry_run, reported] }
        error_code: { type: string, nullable: true }

    ReconcileRun:
      type: object
      required: [id, engine_id, started_at, finished_at, dry_run, actions, adopted]
      properties:
        id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        dry_run: { type: boolean }
        actions:
          type: array
          items: { $ref: "#/components/schemas/ReconcileAction" }
        adopted:
          type: array
          items: { type: string }
          description: "Catalogs the engine has that Baleia does not manage: reported, never dropped"
        error: { type: string, nullable: true }
        max_actions: { type: integer, nullable: true, description: "BALEIA_RECONCILE_MAX_ACTIONS of the run" }

    MetadataFreshness:
      type: object
      properties:
        metadata_synced_at:
          type: string
          format: date-time
          nullable: true
          description: End of the latest finished metadata pass of the catalog; null before the first one.

    MetadataCatalogBinding:
      type: object
      required: [binding_id, engine_id, engine_name, engine_kind, engine_catalog_name, mode, status]
      properties:
        binding_id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        engine_name: { type: string }
        engine_kind: { type: string }
        engine_catalog_name: { type: string }
        mode: { type: string, enum: [managed, adopted, native] }
        status: { type: string, description: "The binding's sync status (CatalogBinding.sync_status)" }

    MetadataCatalog:
      type: object
      required: [id, name, origin, provider_kind, metadata_sync_status, bindings]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        origin: { type: string, enum: [source, native] }
        provider_kind: { type: string, description: "The kind of the catalog's connection (polaris, postgresql, trino, …)" }
        metadata_synced_at: { type: string, format: date-time, nullable: true }
        metadata_sync_status: { type: string, enum: [never, running, finished, failed] }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/MetadataCatalogBinding" }

    MetadataNamespaceList:
      type: object
      required: [freshness, items]
      properties:
        freshness: { $ref: "#/components/schemas/MetadataFreshness" }
        items:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: { type: array, items: { type: string } }

    MetadataTableSummary:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [table, view, materialized_view] }
        comment: { type: string, nullable: true }
        last_changed_at: { type: string, format: date-time, nullable: true }

    MetadataTablePage:
      type: object
      required: [freshness, items]
      properties:
        freshness: { $ref: "#/components/schemas/MetadataFreshness" }
        items:
          type: array
          items: { $ref: "#/components/schemas/MetadataTableSummary" }
        next_cursor: { type: string, nullable: true, description: "Pass as cursor for the next page; null on the last one" }

    MetadataColumn:
      type: object
      required: [ordinal, name, native_type, type_system]
      properties:
        ordinal: { type: integer }
        name: { type: string }
        native_type: { type: string, description: "The type as the source reports it" }
        type_system: { type: string, description: "iceberg, postgresql, mysql, tsql, oracle, sqlite, clickhouse, trino, …" }
        display_type: { type: string, nullable: true, description: "native_type in the binding's engine dialect, when Baleia can map it" }
        logical_type:
          type: string
          description: "Portable semantic type (#115): boolean, int64, decimal, float64, string, date, timestamp, timestamptz, binary, json or other"
        nullable: { type: boolean, nullable: true }
        comment: { type: string, nullable: true }
        doc: { $ref: "#/components/schemas/SemanticDoc" }

    MetadataTableDetail:
      type: object
      required: [freshness, id, catalog_id, namespace, name, kind, properties, columns]
      properties:
        freshness: { $ref: "#/components/schemas/MetadataFreshness" }
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        name: { type: string }
        kind: { type: string, enum: [table, view, materialized_view] }
        comment: { type: string, nullable: true }
        properties: { type: object, additionalProperties: { type: string } }
        last_changed_at: { type: string, format: date-time, nullable: true }
        removed_at: { type: string, format: date-time, nullable: true, description: "Set when the source no longer has the table" }
        binding_id: { type: string, format: uuid, nullable: true, description: "The binding display_type and qualified_name are rendered for; null when the catalog has none" }
        qualified_name: { type: string, nullable: true, description: "The table's name in SQL on that binding's engine" }
        preview_sql: { type: string, nullable: true, description: "A SELECT that previews the table on that binding's engine (the dialect's PreviewSQL, 100 rows); null without a binding or dialect" }
        doc: { $ref: "#/components/schemas/SemanticDoc" }
        columns:
          type: array
          items: { $ref: "#/components/schemas/MetadataColumn" }

    MetadataSearchResult:
      type: object
      required: [kind, table_id, catalog_id, namespace, table, score]
      properties:
        kind: { type: string, enum: [table, column] }
        table_id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        column: { type: string, nullable: true }
        native_type: { type: string, nullable: true }
        score: { type: number, format: double }
        metadata_synced_at: { type: string, format: date-time, nullable: true }

    # ── Semantic layer (#33) ───────────────────────────────────
    SemanticDoc:
      type: object
      required: [id, catalog_id, namespace, table, description, tags, updated_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        column: { type: string, nullable: true, description: "Null for a table-level doc" }
        description: { type: string, description: "Markdown, at most 20 000 characters" }
        tags: { type: array, items: { type: string } }
        owner_user_id: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        certified: { type: boolean }
        certified_by: { type: string, format: uuid, nullable: true }
        certified_at: { type: string, format: date-time, nullable: true }
        allowed_actions: { type: array, items: { type: string }, readOnly: true }

    SemanticDocUpsert:
      type: object
      required: [description]
      properties:
        description: { type: string, maxLength: 20000 }
        tags: { type: array, items: { type: string } }
        owner_user_id: { type: string, format: uuid, nullable: true }
        certified: { type: boolean, description: "Only a workspace owner or admin may set true" }
        expected_updated_at: { type: string, format: date-time, nullable: true, description: "Optimistic concurrency; stale → 409 version_conflict" }

    SemanticTag:
      type: object
      required: [tag, count]
      properties:
        tag: { type: string }
        count: { type: integer }

    SemanticDocSearchResult:
      type: object
      required: [id, catalog_id, namespace, table, description, tags, updated_by, updated_at, score]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        column: { type: string, nullable: true }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        owner_user_id: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        certified: { type: boolean }
        certified_by: { type: string, format: uuid, nullable: true }
        certified_at: { type: string, format: date-time, nullable: true }
        allowed_actions: { type: array, items: { type: string }, readOnly: true }
        score: { type: number, format: double }

    SemanticMetric:
      type: object
      required: [id, workspace_id, slug, label, catalog_id, namespace, table, definition, format_version, certified, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid, nullable: true }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        binding_id: { type: string, format: uuid, nullable: true }
        definition:
          type: object
          additionalProperties: true
          description: >
            SimpleMetricV1: type, aggregation, column, filters, time_column,
            time_grains, format and custom_sql. Validated with
            DisallowUnknownFields.
        format_version: { type: integer }
        owner_user_id: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        certified_by: { type: string, format: uuid, nullable: true }
        certified_at: { type: string, format: date-time, nullable: true }
        allowed_actions: { type: array, items: { type: string }, readOnly: true }
        version: { type: integer, description: "Latest content version (#34); send it as expected_version on PATCH" }

    SemanticMetricRenderRequest:
      type: object
      required: [catalog_id, namespace, table, definition]
      properties:
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        definition: { type: object, additionalProperties: true }
        binding_id: { type: string, format: uuid, nullable: true }
        grain: { type: string, nullable: true }

    SemanticMetricRenderResult:
      type: object
      required: [sql]
      properties:
        sql: { type: string }

    SemanticMetricValidateResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    SemanticMetricCreate:
      type: object
      required: [slug, label, catalog_id, namespace, table, definition]
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        space_id: { type: string, format: uuid, nullable: true, description: "Omitted: the workspace's default space" }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        binding_id: { type: string, format: uuid, nullable: true, description: "Engine used to validate and generate; null chooses at use time" }
        definition: { type: object, additionalProperties: true }
        owner_user_id: { type: string, format: uuid, nullable: true }

    SemanticMetricUpdate:
      type: object
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        binding_id: { type: string, format: uuid, nullable: true }
        definition: { type: object, additionalProperties: true }
        owner_user_id: { type: string, format: uuid, nullable: true }
        expected_version: { type: integer, nullable: true, description: "Reject with 409 version_conflict when the latest content version differs" }

    SemanticMetricSQL:
      type: object
      required: [sql, portable]
      properties:
        sql: { type: string }
        portable: { type: boolean, description: "False when the metric uses custom_sql" }

    MetadataSyncStarted:
      type: object
      required: [catalog_id, workflow_id]
      properties:
        catalog_id: { type: string, format: uuid }
        workflow_id: { type: string }

    MetadataSyncRun:
      type: object
      required: [id, catalog_id, status, source_path, started_at]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        status: { type: string, enum: [running, finished, failed] }
        source_path:
          type: string
          enum: [provider, engine]
          description: >
            provider: read from the catalog's own source (catalog manager,
            database); engine: introspected through one of its bindings.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        tables_seen: { type: integer, nullable: true }
        tables_changed: { type: integer, nullable: true }
        tables_removed: { type: integer, nullable: true }
        error_code:
          type: string
          nullable: true
          description: >
            Why a pass failed: an engine code (engine_unavailable, timeout, …),
            not_found, interrupted (the worker stopped mid-pass), cancelled or
            sync_failed. The source's own message stays in the worker's logs.

    CatalogBinding:
      type: object
      required: [id, catalog_id, engine_id, engine_catalog_name, mode, enabled, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/CatalogBindingAllowedAction" }
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        engine_catalog_name: { type: string, description: "The catalog's name in SQL on that engine" }
        connector: { type: string, nullable: true }
        mode: { type: string, enum: [managed, adopted, native] }
        enabled: { type: boolean }
        extra_props:
          type: object
          additionalProperties: { type: string }
        version: { type: string, nullable: true, description: "Version of the projection applied (write responses, when synced)" }
        lifecycle_state:
          type: string
          enum: [provisioning, active, updating, error, deprovisioning, disabled]
          description: "Where Baleia is in applying the binding (#38)"
        sync_status:
          type: string
          enum: [synced, pending, error, disabled]
          nullable: true
          description: >
            Derived: synced when the binding is active, the engine confirmed
            the desired version (Trino: the plugin rewrote the registry row)
            and the engine does not report it missing; pending while
            provisioning or updating or not yet confirmed; error (also when
            the engine could not load the active binding's catalog at boot,
            last_error_code engine_load_failed); disabled while deprovisioning
            or disabled.
        last_error_code: { type: string, nullable: true, description: "e.g. plugin_not_confirmed, engine_unavailable, engine_load_failed (the engine refused to load the catalog; sync the binding to apply it again), the engine's error name" }
        last_error_message: { type: string, nullable: true }

    CreateBindingRequest:
      type: object
      required: [engine_id, engine_catalog_name]
      properties:
        engine_id: { type: string, format: uuid }
        engine_catalog_name: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        connector: { type: string, description: "One of the engine's connectors for the source kind (GET /engines/{id}/binding-support); default the first" }
        extra_props:
          type: object
          additionalProperties: { type: string }
          description: "Merged over the projection; protected keys cannot be overridden"

    UpdateBindingRequest:
      type: object
      properties:
        engine_catalog_name: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        extra_props:
          type: object
          additionalProperties: { type: string }
          description: "Replaces the binding's extra properties"
        enabled: { type: boolean }

    BindingSupport:
      type: object
      required: [connectors, protected_key_patterns, reserved_names, writes_supported]
      properties:
        connectors: { type: array, items: { type: string }, description: "The first is the default" }
        protected_key_patterns: { type: array, items: { type: string }, description: "Glob patterns (case-insensitive) of extra-property keys that cannot be overridden" }
        reserved_names: { type: array, items: { type: string } }
        writes_supported: { type: boolean, description: "Whether Baleia supports writing through a binding of this kind; false for read-oriented sources (Unity Catalog)" }

    ConnectionProviderField:
      type: object
      required: [key, label, type, required, secret]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, secret, int, bool, select, url, file_path] }
        required: { type: boolean }
        secret: { type: boolean, description: "Sent in credentials, stored sealed, never returned" }
        default: { type: string }
        options: { type: array, items: { type: string } }
        help: { type: string }

    ConnectionProvider:
      type: object
      required: [kind, label, family, roles, status, config_schema]
      properties:
        kind: { type: string }
        label: { type: string }
        family: { type: string, enum: [iceberg, metastore, database, engine] }
        roles:
          type: array
          items: { type: string, enum: [metadata, direct_engine, federated_engine] }
        engine_kind: { type: string, description: "Query-engine kind when the connection can be an engine" }
        status:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [supported, preview, unsupported] }
            reason: { type: string }
        config_schema:
          type: array
          items: { $ref: "#/components/schemas/ConnectionProviderField" }

    TestCatalogConnectionResult:
      type: object
      required: [success, latency_ms]
      properties:
        success: { type: boolean }
        latency_ms: { type: integer }
        error: { type: string, nullable: true, description: "Deprecated: error_message" }
        version: { type: string, nullable: true }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ConnectionCheck" }
        error_code:
          type: string
          nullable: true
          enum: [unreachable, tls, auth_failed, forbidden, not_found, timeout, provider_unsupported, connection_denied_network, engine_unavailable, internal, null]
          description: "Why the first failing check failed"
        error_message: { type: string, nullable: true, description: "A short sentence; upstream bodies are logged, not returned" }

    ConnectionCheck:
      type: object
      required: [name, ok]
      properties:
        name: { type: string, description: "ping, list_catalogs, direct_engine, bind:<engine name>" }
        ok: { type: boolean }
        skipped: { type: boolean, description: "Not run (e.g. no engine adapter for the kind yet)" }
        detail: { type: string, nullable: true }
        error_code: { type: string, nullable: true }

    TestConnectionRequest:
      allOf:
        - $ref: "#/components/schemas/CreateCatalogConnectionRequest"
        - type: object
          properties:
            intents:
              type: array
              items: { type: string }
              description: >
                Checks to run: metadata, direct_engine, bind:<engine_id>.
                Default: every role the provider declares (a bind check on
                the default Trino engine for databases it can bind).

    WorkspaceCatalogAccess:
      type: object
      required: [catalog_id, permission, granted_at]
      properties:
        catalog_id: { type: string, format: uuid }
        catalog_name: { type: string }
        permission: { type: string, enum: [read, write] }
        granted_at: { type: string, format: date-time }

    GrantCatalogAccessRequest:
      type: object
      required: [catalog_id, permission]
      properties:
        catalog_id: { type: string, format: uuid }
        permission: { type: string, enum: [read, write] }

    # ── Query Editor ───────────────────────────────────────────
    Space:
      type: object
      required: [id, workspace_id, name, slug, visibility, default_role, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [workspace, restricted] }
        default_role: { type: string, enum: [viewer, editor] }
        is_default: { type: boolean }
        my_role:
          type: string
          enum: [viewer, editor, manager]
          nullable: true
          description: "The caller's effective role (list and get only)"
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        counts:
          allOf: [{ $ref: "#/components/schemas/SpaceCounts" }]
        allowed_actions:
          type: array
          items: { type: string }

    SpaceCounts:
      type: object
      properties:
        saved_queries: { type: integer }
        semantic_metrics: { type: integer }
        folders: { type: integer }

    ContentSearchSpace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ContentSearchFolderPath:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ContentSearchItem:
      type: object
      required: [kind, id, slug, title, space, folder_path, updated_at]
      properties:
        kind: { type: string }
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        space: { $ref: "#/components/schemas/ContentSearchSpace" }
        folder_path:
          type: array
          items: { $ref: "#/components/schemas/ContentSearchFolderPath" }
        updated_at: { type: string, format: date-time }
        updated_by:
          allOf: [{ $ref: "#/components/schemas/ContentSearchSpace" }]
          nullable: true
        certified: { type: boolean }

    WorkspacePrincipal:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string }
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, nullable: true }
        member_count: { type: integer, nullable: true }

    UpdateFolderRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        parent_id: { type: string, format: uuid, nullable: true }
        space_id: { type: string, format: uuid, nullable: true }

    CreateSpaceRequest:
      type: object
      required: [name, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [workspace, restricted] }
        default_role: { type: string, enum: [viewer, editor], default: viewer }

    UpdateSpaceRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [workspace, restricted] }
        default_role: { type: string, enum: [viewer, editor] }

    SpaceMember:
      type: object
      required: [principal_type, principal_id, role]
      properties:
        principal_type: { type: string, enum: [user, team] }
        principal_id: { type: string, format: uuid }
        role: { type: string, enum: [viewer, editor, manager] }
        granted_by: { type: string, format: uuid, nullable: true }
        granted_at: { type: string, format: date-time }

    SetSpaceMemberRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [viewer, editor, manager] }

    QueryFolder:
      type: object
      required: [id, name, workspace_id, space_id, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        parent_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        space_id: { type: string, format: uuid, nullable: true, description: "Omitted: the workspace's default space" }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", nullable: true, description: "Omitted: derived from name" }
        parent_id: { type: string, format: uuid, nullable: true }

    SavedQueryTarget:
      type: object
      properties:
        binding_id: { type: string, format: uuid, nullable: true }
        schema: { type: string, nullable: true }

    ContentAuthor:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }

    ContentVersion:
      type: object
      required: [version, change_kind, created_at]
      properties:
        version: { type: integer }
        change_kind: { type: string, enum: [create, update, delete, restore, import] }
        author: { $ref: "#/components/schemas/ContentAuthor" }
        created_at: { type: string, format: date-time }
        restored_from: { type: integer, nullable: true }

    ContentVersionDetail:
      type: object
      required: [version, change_kind, created_at, snapshot]
      properties:
        version: { type: integer }
        change_kind: { type: string, enum: [create, update, delete, restore, import] }
        author: { $ref: "#/components/schemas/ContentAuthor" }
        created_at: { type: string, format: date-time }
        restored_from: { type: integer, nullable: true }
        snapshot: { type: object, additionalProperties: true }

    RestoreSavedQueryRequest:
      type: object
      properties:
        new_name: { type: string, nullable: true, description: "Retry a restorable name conflict with this name" }
        space_id: { type: string, format: uuid, nullable: true, description: "Pick a live space when the snapshot's space is gone" }

    RestoreSemanticMetricRequest:
      type: object
      properties:
        new_slug: { type: string, nullable: true, description: "Retry a slug conflict with this slug" }
        space_id: { type: string, format: uuid, nullable: true }

    TrashItem:
      type: object
      required: [entity_type, entity_id, slug, deleted_at, version, restore_version]
      properties:
        entity_type: { type: string, enum: [saved_query, semantic_metric] }
        entity_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        space_id: { type: string, format: uuid }
        space:
          allOf: [{ $ref: "#/components/schemas/ContentSearchSpace" }]
          nullable: true
        deleted_at: { type: string, format: date-time }
        version: { type: integer }
        restore_version: { type: integer, description: "Pass this to the restore endpoint; the delete version holds the last content" }

    BundleSpace:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    BundleTarget:
      type: object
      properties:
        engine: { type: string }
        catalog: { type: string }
        schema: { type: string, nullable: true }

    BundleItem:
      type: object
      required: [kind, slug]
      properties:
        kind: { type: string, enum: [folder, saved_query, semantic_metric] }
        slug: { type: string }
        parent: { type: string, nullable: true }
        name: { type: string }
        folder: { type: string, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/BundleTarget" }
        format_version: { type: integer }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        catalog: { type: string }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        definition: { type: object, additionalProperties: true }

    Bundle:
      type: object
      required: [format, format_version, space, items]
      properties:
        format: { type: string }
        format_version: { type: integer }
        baleia_version: { type: string }
        space: { $ref: "#/components/schemas/BundleSpace" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BundleItem" }

    ImportItem:
      type: object
      required: [kind, slug, action]
      properties:
        kind: { type: string }
        slug: { type: string }
        title: { type: string }
        action: { type: string, enum: [CREATE, UPDATE, NO_CHANGES, ERROR] }
        matched_id: { type: string, format: uuid, nullable: true, description: "Destination item for UPDATE/NO_CHANGES" }
        message: { type: string }
        warnings: { type: array, items: { type: string } }

    ImportReport:
      type: object
      required: [mode, ok, items]
      properties:
        mode: { type: string, enum: [dry_run, apply] }
        ok: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportItem" }

    SavedQuery:
      type: object
      required: [id, name, workspace_id, space_id, slug, created_by, sql, created_at, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        folder_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/SavedQueryTarget" }
        version: { type: integer, description: "Latest content version (#34); send it as expected_version on PATCH" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSavedQueryRequest:
      type: object
      required: [name, sql]
      properties:
        name: { type: string }
        space_id: { type: string, format: uuid, nullable: true, description: "Omitted: the workspace's default space" }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", nullable: true, description: "Omitted: derived from name" }
        folder_id: { type: string, format: uuid, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/SavedQueryTarget" }

    UpdateSavedQueryRequest:
      type: object
      properties:
        name: { type: string }
        space_id: { type: string, format: uuid, nullable: true }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", nullable: true }
        folder_id: { type: string, format: uuid, nullable: true }
        move_to_root: { type: boolean, description: "Explicitly move the query to the space root; folder_id wins when present" }
        sql: { type: string }
        target: { $ref: "#/components/schemas/SavedQueryTarget" }
        expected_version: { type: integer, nullable: true, description: "Reject with 409 version_conflict when the latest content version differs" }

    # ── Executions ─────────────────────────────────────────────
    ExecutionRequest:
      type: object
      required: [workspace_id, sql]
      properties:
        workspace_id: { type: string, format: uuid }
        saved_query_id: { type: string, format: uuid, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/TargetRequest" }
        rerun:
          type: object
          description: "Re-run the statements of an earlier execution from from_position; the server copies them, never re-splits SQL it did not send"
          required: [execution_id, from_position]
          properties:
            execution_id: { type: string, format: uuid }
            from_position: { type: integer, minimum: 1 }

    Execution:
      type: object
      required: [id, workspace_id, status, sql, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true, description: "The caller who ran it" }
        user_name: { type: string, nullable: true, description: "The runner's name (history list)" }
        saved_query_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [running, finished, failed, cancelled] }
        sql: { type: string }
        engine_query_id: { type: string, nullable: true, description: "The statement's id on its engine (a Trino query id, …). Was trino_query_id" }
        rows_returned: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        target: { $ref: "#/components/schemas/ExecutionTarget" }
        read_only: { type: boolean, description: "The target ran in a read-only session" }
        error_code: { type: string, nullable: true }

    QueryStatement:
      type: object
      required: [id, execution_id, position, sql, status]
      properties:
        id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        position: { type: integer }
        sql: { type: string }
        status:
          type: string
          enum: [pending, running, finished, failed, cancelled, skipped]
          description: >
            All statements of an execution run in order in one engine session.
            `pending` has not started yet; `skipped` never ran because an
            earlier statement failed, the execution was cancelled, or the
            worker was interrupted.
        engine_query_id: { type: string, nullable: true, description: "The statement's id on its engine. Was trino_query_id" }
        rows_returned: { type: integer, nullable: true }
        result_sets:
          type: array
          description: "Stored results of the statement, one per result set"
          items:
            type: object
            required: [result_index, rows, bytes, truncated]
            properties:
              result_index: { type: integer }
              rows: { type: integer }
              bytes: { type: integer }
              truncated: { type: boolean }
        result_bytes: { type: integer, nullable: true }
        truncated: { type: boolean, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        error_code:
          type: string
          nullable: true
          description: >
            Typed reason of a failed or cancelled statement: an engine code
            (syntax, not_found, permission_denied, timeout, cancelled,
            resource_exhausted, engine_unavailable, read_only_unsupported,
            conflict, internal), `editor_rejected`, or `interrupted` when the
            worker stopped mid-statement (its outcome on the engine is unknown).
        error_native: { type: string, nullable: true, description: "The engine's own error identifier (SQLSTATE, Trino errorName, gRPC status)" }
        update_count: { type: integer, nullable: true, description: "Affected rows for DML/DDL when the engine reports it" }
        result_count: { type: integer, description: "Number of result sets produced" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    ExecutionEvent:
      type: object
      description: >
        One server -> client WebSocket message. Every event has `type`,
        `execution_id`, a monotonic per-connection `seq` and `ts`. The first
        message of every connection (including a reconnect) is `snapshot`.
      oneOf:
        - $ref: "#/components/schemas/ExecutionSnapshotEvent"
        - $ref: "#/components/schemas/ExecutionStatusEvent"
        - $ref: "#/components/schemas/StatementStatusEvent"
        - $ref: "#/components/schemas/StatementProgressEvent"

    ExecutionSnapshotEvent:
      type: object
      required: [type, execution_id, seq, ts, execution, statements]
      properties:
        type: { type: string, enum: [snapshot] }
        execution_id: { type: string, format: uuid }
        seq: { type: integer }
        ts: { type: string, format: date-time }
        execution: { $ref: "#/components/schemas/Execution" }
        statements:
          type: array
          items: { $ref: "#/components/schemas/QueryStatement" }

    ExecutionStatusEvent:
      type: object
      required: [type, execution_id, seq, ts, status]
      properties:
        type: { type: string, enum: [execution_status] }
        execution_id: { type: string, format: uuid }
        seq: { type: integer }
        ts: { type: string, format: date-time }
        status: { type: string, enum: [running, finished, failed, cancelled] }
        error_code: { type: string, nullable: true }

    StatementStatusEvent:
      type: object
      required: [type, execution_id, seq, ts, position, status]
      properties:
        type: { type: string, enum: [statement_status] }
        execution_id: { type: string, format: uuid }
        seq: { type: integer }
        ts: { type: string, format: date-time }
        position: { type: integer }
        status: { type: string, enum: [pending, running, finished, failed, cancelled, skipped] }
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        rows_returned: { type: integer, nullable: true }
        result_count: { type: integer }
        truncated: { type: boolean }
        duration_ms: { type: integer, nullable: true }

    StatementProgressEvent:
      type: object
      required: [type, execution_id, seq, ts, position, rows_so_far]
      properties:
        type: { type: string, enum: [statement_progress] }
        execution_id: { type: string, format: uuid }
        seq: { type: integer }
        ts: { type: string, format: date-time }
        position: { type: integer }
        rows_so_far: { type: integer }

    # ── Retrievers ─────────────────────────────────────────────
    MonitoringEngine:
      type: object
      required: [id, name, kind, class]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        class: { type: string }

    ClusterPoint:
      type: object
      required: [captured_at, active_workers, running_queries, queued_queries, blocked_queries]
      properties:
        captured_at: { type: string, format: date-time }
        active_workers: { type: integer }
        running_queries: { type: integer }
        queued_queries: { type: integer }
        blocked_queries: { type: integer }
        total_memory_bytes: { type: integer, nullable: true }
        free_memory_bytes: { type: integer, nullable: true }

    ClusterSeries:
      type: object
      required: [series]
      properties:
        latest:
          allOf: [{ $ref: "#/components/schemas/ClusterPoint" }]
          nullable: true
        series:
          type: array
          items: { $ref: "#/components/schemas/ClusterPoint" }

    MonitoringQuery:
      type: object
      required: [trino_query_id, state, user, catalog, created_at]
      properties:
        trino_query_id: { type: string }
        execution_id: { type: string, format: uuid, nullable: true }
        state: { type: string }
        user: { type: string }
        sql_first_line: { type: string }
        catalog: { type: string }
        schema: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        elapsed_ms: { type: integer, nullable: true }
        cpu_ms: { type: integer, nullable: true }
        physical_input_bytes: { type: integer, nullable: true }
        output_rows: { type: integer, nullable: true }
        origin: { type: string }

    MonitoringQueryDetail:
      allOf:
        - $ref: "#/components/schemas/MonitoringQuery"
        - type: object
          properties:
            sql: { type: string }
            error_message: { type: string, nullable: true }

    MonitoringQueryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MonitoringQuery" }
        next_offset: { type: integer, nullable: true }

    TableHealth:
      type: object
      required: [catalog_id, catalog_name, namespace, table_name, health_score, needs_compaction, needs_snapshot_expiry, needs_orphan_cleanup]
      properties:
        catalog_id: { type: string, format: uuid }
        catalog_name: { type: string }
        namespace: { type: string }
        table_name: { type: string }
        snapshot_count: { type: integer }
        file_count: { type: integer, nullable: true }
        total_size_bytes: { type: integer, nullable: true }
        oldest_snapshot_age_hours: { type: integer, nullable: true }
        last_maintenance_at: { type: string, format: date-time, nullable: true }
        health_score: { type: integer }
        needs_compaction: { type: boolean }
        needs_snapshot_expiry: { type: boolean }
        needs_orphan_cleanup: { type: boolean }

    MaintenanceRun:
      type: object
      required: [id, catalog_id, namespace, table_name, operations, status, started_at, workflow_id]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        binding_id: { type: string, format: uuid, nullable: true }
        namespace: { type: string }
        table_name: { type: string }
        operations: { type: array, items: { type: string } }
        retention: { type: string, nullable: true }
        status: { type: string }
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        started_by: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        workflow_id: { type: string }

    CreateMaintenanceRequest:
      type: object
      required: [namespace, table, operations]
      properties:
        namespace: { type: string }
        table: { type: string }
        operations:
          type: array
          items: { type: string }
        retention: { type: string, nullable: true }
        binding_id: { type: string, format: uuid, nullable: true }

    Retriever:
      type: object
      required:
        [
          id,
          name,
          workspace_id,
          definition_sql,
          dest_catalog,
          dest_namespace,
          dest_table,
          cron_schedule,
          refresh_type,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        definition_sql: { type: string }
        dest_catalog: { type: string }
        dest_namespace: { type: string }
        dest_table: { type: string }
        dest_binding_id: { type: string, format: uuid }
        destination:
          allOf: [{ $ref: "#/components/schemas/RetrieverDestination" }]
          nullable: true
        last_refresh_status: { type: string, nullable: true }
        error_code: { type: string, nullable: true }
        allowed_actions:
          type: array
          items: { type: string }
        cron_schedule: { type: string, example: "0 */6 * * *" }
        refresh_type: { type: string, enum: [incremental, full] }
        status: { type: string, enum: [active, paused, error] }
        last_refresh_at: { type: string, format: date-time, nullable: true }
        next_refresh_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRetrieverRequest:
      type: object
      required: [name, definition_sql, dest_namespace, dest_table, cron_schedule]
      properties:
        name: { type: string }
        definition_sql:
          {
            type: string,
            description: "A single SELECT (or WITH ... SELECT) statement. Full refresh replaces the destination table atomically (CREATE OR REPLACE TABLE ... AS SELECT).",
          }
        dest_binding_id: { type: string, format: uuid, description: "A binding from GET .../retrievers/destinations" }
        dest_catalog: { type: string, description: "Deprecated: the legacy catalog name; use dest_binding_id." }
        dest_namespace: { type: string, description: "Destination namespace/schema (identifier)." }
        dest_table: { type: string, description: "Destination table name (identifier)." }
        cron_schedule: { type: string, description: "Standard five-field cron: minute hour day-of-month month day-of-week (UTC), optionally prefixed with CRON_TZ=<IANA>. The minimum interval is 5 minutes." }
        refresh_type:
          { type: string, enum: [incremental, full], default: full }

    UpdateRetrieverRequest:
      type: object
      properties:
        name: { type: string }
        definition_sql: { type: string }
        dest_binding_id: { type: string, format: uuid }
        dest_namespace: { type: string }
        dest_table: { type: string }
        cron_schedule: { type: string, description: "Standard five-field cron, optionally prefixed with CRON_TZ=<IANA>. The minimum interval is 5 minutes." }
        refresh_type: { type: string, enum: [incremental, full] }
        status: { type: string, enum: [active, paused] }

    RetrieverDestination:
      type: object
      required: [binding_id, engine_catalog_name, connector, catalog, engine]
      properties:
        binding_id: { type: string, format: uuid }
        engine_catalog_name: { type: string }
        connector: { type: string }
        catalog:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        engine:
          type: object
          required: [id, name, kind]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string }

    ValidateRetrieverRequest:
      type: object
      required: [dest_binding_id, definition_sql]
      properties:
        dest_binding_id: { type: string, format: uuid }
        definition_sql: { type: string }

    ValidateRetrieverResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    CronPreviewRequest:
      type: object
      required: [expression]
      properties:
        expression: { type: string }

    CronPreviewResult:
      type: object
      required: [valid, next, min_interval_ok]
      properties:
        valid: { type: boolean }
        error: { type: string, nullable: true }
        next:
          type: array
          items: { type: string, format: date-time }
        min_interval_ok: { type: boolean }

    RetrieverRefreshHistory:
      type: object
      required: [id, retriever_id, refresh_type, status, started_at]
      properties:
        id: { type: string, format: uuid }
        retriever_id: { type: string, format: uuid }
        temporal_workflow_id: { type: string }
        refresh_type: { type: string, enum: [incremental, full] }
        status: { type: string, enum: [running, finished, failed] }
        rows_processed: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        error_code: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    # ── Migrant ────────────────────────────────────────────────
    Migration:
      type: object
      required:
        [
          id,
          name,
          source_type,
          source_url,
          target_catalog_connection_id,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source_type: { type: string, enum: [nessie] }
        source_url: { type: string }
        target_catalog_connection_id: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [pending, running, finished, failed, cancelled],
          }
        total_tables: { type: integer }
        migrated_tables: { type: integer }
        failed_tables: { type: integer }
        temporal_workflow_id: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateMigrationRequest:
      type: object
      required: [name, source_type, source_url, target_catalog_connection_id]
      properties:
        name: { type: string }
        source_type: { type: string, enum: [nessie] }
        source_url: { type: string }
        source_credentials: { type: object, nullable: true }
        target_catalog_connection_id: { type: string, format: uuid }

    MigrationItem:
      type: object
      required:
        [
          id,
          migration_id,
          source_namespace,
          source_table,
          target_namespace,
          target_table,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        migration_id: { type: string, format: uuid }
        source_namespace: { type: string }
        source_table: { type: string }
        target_namespace: { type: string }
        target_table: { type: string }
        status:
          { type: string, enum: [pending, running, finished, failed, skipped] }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

# ═══════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════
paths:
  # ── Setup ─────────────────────────────────────────────────────
  /setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: "System configuration status"
      security: []
      responses:
        "200":
          description: "Status"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup/admin:
    post:
      tags: [Setup]
      operationId: createFirstAdmin
      summary: "Create first admin user"
      description: "Returns 409 if any user already exists. Sets the HttpOnly `baleia_refresh` cookie; `refresh_token` is only in the JSON for `X-Baleia-Client: api`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminRequest" }
      responses:
        "201":
          description: "Admin created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Auth ──────────────────────────────────────────────────────
  /admin/system/status:
    get:
      tags: [Admin]
      operationId: getSystemStatus
      summary: "Core system status"
      description: "Admin-only health of Baleia, the database, Temporal, object storage and SMTP, plus the platform's own components: schedules, engines, bindings, metadata, reconcile, audit export and the Trino plugin. Each section has its own 2 s timeout and reports `unknown` with a stable `error_code`; a schedule Temporal does not know is `missing`, never blank. The endpoint itself always returns 200. No hosts, credentials or raw errors are exposed."
      responses:
        "200":
          description: "Sectional status"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/directory-reconcile-runs:
    get:
      tags: [Admin]
      operationId: listDirectoryReconcileRuns
      summary: "Directory reconciliation runs — admin only"
      description: "One row per pass, newest first. `aborted_safety` means the brake refused a mass suspension."
      parameters:
        - name: provider_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: "Runs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectoryReconcileRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: "Authenticate and receive JWT"
      description: "Authenticates a local account with `email`/`password`, or a directory account when `provider_id` (an LDAP provider) and `username` are sent; `email` is ignored in that case. Failures are the uniform `invalid_credentials` error and share the progressive delay. Sets the HttpOnly `baleia_refresh` cookie (Secure, SameSite=Lax, Path=/api/v1/auth). The `refresh_token` field is only returned when the request sends `X-Baleia-Client: api`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: "Session created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: "Invalidate current session"
      description: "Revokes the refresh-token family and clears the `baleia_refresh` cookie."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: "Exchange refresh token for new access token pair"
      description: "Reads the refresh token from the `baleia_refresh` cookie (or the optional body token), rotates it, and sets the cookie. `refresh_token` is only in the JSON for `X-Baleia-Client: api`."
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: "New token pair"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: "Return authenticated user, feature flags and global actions"
      responses:
        "200":
          description: "Current user, feature flags and global actions"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/providers:
    get:
      tags: [Auth]
      operationId: listAuthProviders
      summary: "Enabled login providers"
      description: "Public list of enabled identity providers for the login page: OIDC and LDAP. Configuration and secrets are never returned."
      security: []
      responses:
        "200":
          description: "Providers"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthProvider" }

  /auth/oidc/providers:
    get:
      tags: [Auth]
      operationId: listOIDCProviders
      summary: "List configured OIDC providers"
      deprecated: true
      security: []
      responses:
        "200":
          description: "List of providers"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OIDCProvider" }

  /auth/oidc/{provider_id}/login:
    get:
      tags: [Auth]
      operationId: oidcRedirect
      summary: "Redirect to OIDC provider"
      description: "Creates a server-side, single-use login attempt with an S256 PKCE challenge and redirects to the provider."
      security: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: next
          in: query
          required: false
          schema: { type: string }
          description: "Relative path to return to after login."
      responses:
        "302":
          description: "Redirect to provider"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/oidc/{provider_id}/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: "OIDC callback — exchange code for JWT"
      description: "Consumes the single-use login attempt (state plus the server-side PKCE verifier), exchanges the code, sets the HttpOnly `baleia_refresh` cookie and redirects to the stored relative path — never with tokens in the URL. Provider discovery failures return `503 idp_unavailable`; other failures redirect to `/login?error=<code>`."
      security: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: "Redirect to the stored path; the session is in the HttpOnly cookie"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: "Request password reset link"
      description: "Always returns 204 regardless of email existence. Returns 503 if email service is not configured."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequestBody" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "503":
          description: "Email service unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: "Confirm password reset with token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmBody" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── API Keys ──────────────────────────────────────────────────
  /api-keys:
    get:
      tags: [ApiKeys]
      operationId: listApiKeys
      summary: "List current user's API keys"
      responses:
        "200":
          description: "List of keys"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ApiKeys]
      operationId: createApiKey
      summary: "Create a new API key"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: "Key created — secret displayed only once"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    delete:
      tags: [ApiKeys]
      operationId: deleteApiKey
      summary: "Remove an API key"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Agents (#59) ─────────────────────────────────────────────
  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: "List the caller's external agents (admins: all with all=true)"
      parameters:
        - name: all
          in: query

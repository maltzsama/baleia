        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Executions ────────────────────────────────────────────────
  /workspaces/{id}/executions:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Executions]
      operationId: listExecutions
      summary: "Workspace execution history"
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [running, finished, failed, cancelled] }
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPerPage"
      responses:
        "200":
          description: "Paginated executions"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Execution" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Executions]
      operationId: runQuery
      summary: "Submit a query on a target"
      description: >
        The target is resolved per request (see TargetRequest) and must be a
        target of the workspace. 404 when the named binding or catalog is not;
        422 target_required (nothing to pick), engine_required (the catalog is
        bound to several engines), target_unavailable (disabled binding, engine
        or catalog), engine_unsupported (no adapter for the engine's kind yet;
        direct engines get theirs in #81-#83). The statements run on the
        target's engine, catalog and schema, read-only for a read grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionRequest" }
      responses:
        "202":
          description: "Execution started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: getExecution
      summary: "Execution status and metadata"
      responses:
        "200":
          description: "Execution"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/executions/{execution_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Executions]
      operationId: cancelExecution
      summary: "Cancel an ongoing execution"
      responses:
        "200":
          description: "Execution cancelled"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/executions/{execution_id}/statements:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: listStatements
      summary: "List individual statements in a multi-statement execution"
      responses:
        "200":
          description: "Statements"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueryStatement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/executions/{execution_id}/statements/{position}/results:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: position
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Executions]
      operationId: getStatementResults
      summary: "Single-statement result as Arrow IPC stream"
      description: |
        Streams one statement's result set from object storage. A statement
        whose result was truncated returns the buffered prefix.
      responses:
        "200": { $ref: "#/components/responses/ArrowStream" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Statement has no result set yet"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{id}/executions/{execution_id}/results:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: getResults
      summary: "Execution results as Arrow IPC stream"
      description: |
        Returns complete results via Arrow IPC. Uses Trino spooling protocol — segments are fetched in parallel from object storage.
      responses:
        "200": { $ref: "#/components/responses/ArrowStream" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Execution not yet completed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ws/workspaces/{id}/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: streamExecution
      summary: "WebSocket for real-time execution progress"
      description: |
        Authenticate via `?token=<jwt>`.

        ## Server → Client Events
        ```json
        { "type": "running", "execution_id": "...", "ts": "..." }
        { "type": "progress", "execution_id": "...", "ts": "...", "rows_so_far": 1000 }
        { "type": "finished", "execution_id": "...", "ts": "...", "rows_returned": 9843, "duration_ms": 1240 }
        { "type": "failed", "execution_id": "...", "ts": "...", "message": "..." }
        { "type": "cancelled", "execution_id": "...", "ts": "..." }
        ```
        After `finished`, fetch `GET .../results` for the Arrow IPC stream.
        Connection closes automatically after any terminal event.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: "WebSocket established"
        "401": { $ref: "#/components/responses/Unauthorized" }


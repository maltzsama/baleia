        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Retrievers]
      operationId: updateRetriever
      summary: "Update a Retriever"
      requestBody:
        required: true

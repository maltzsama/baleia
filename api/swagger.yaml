          schema: { type: boolean, default: false }
      responses:
        "200":
          description: "Agents"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Agents]
      operationId: createAgent
      summary: "Create an agent owned by the caller"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRequest" }
      responses:
        "201":
          description: "Agent created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/meta:
    get:
      tags: [Agents]
      operationId: getAgentsMeta
      summary: "MCP URL, token TTLs and the tool registry the agents UI needs"
      responses:
        "200":
          description: "Agent metadata"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentsMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/PathAgentId"
    get:
      tags: [Agents]
      operationId: getAgent
      summary: "Get an agent"
      responses:
        "200":
          description: "Agent"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: "Update an agent (owner; an admin may only disable it)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: "Agent updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: "Delete an agent (owner or admin)"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agent_id}/tokens:
    parameters:
      - $ref: "#/components/parameters/PathAgentId"
    get:
      tags: [Agents]
      operationId: listAgentTokens
      summary: "List an agent's tokens (never the secret)"
      responses:
        "200":
          description: "Tokens"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Agents]
      operationId: createAgentToken
      summary: "Mint a token for an agent — the secret is shown once"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentTokenRequest" }
      responses:
        "201":
          description: "Token created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTokenCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{agent_id}/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/PathAgentId"
      - $ref: "#/components/parameters/PathAgentTokenId"
    delete:
      tags: [Agents]
      operationId: revokeAgentToken
      summary: "Revoke an agent token"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{agent_id}/policy:
    parameters:
      - $ref: "#/components/parameters/PathAgentId"
    get:
      tags: [Agents]
      operationId: getAgentPolicy
      summary: "Effective, stored and ceiling values of an agent's policy"
      responses:
        "200":
          description: "Policy"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPolicyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Agents]
      operationId: putAgentPolicy
      summary: "Replace an agent's policy within the server ceilings"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPolicy" }
      responses:
        "200":
          description: "Policy updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPolicyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{agent_id}/eligibility:
    parameters:
      - $ref: "#/components/parameters/PathAgentId"
    get:
      tags: [Agents]
      operationId: getAgentEligibility
      summary: "Where an agent may run, per granted catalog and hosting engine"
      responses:
        "200":
          description: "Catalog and engine eligibility"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentCatalogEligibility" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Assistant (#62) ─────────────────────────────────────────
  /assistant/status:
    get:
      tags: [Assistant]
      operationId: getAssistantStatus
      summary: "Whether the assistant is enabled and what it may share"
      responses:
        "200":
          description: "Assistant status"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /assistant/conversations:
    get:
      tags: [Assistant]
      operationId: listAssistantConversations
      summary: "The caller's conversations in a workspace"
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Conversations, newest first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantConversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Assistant]
      operationId: createAssistantConversation
      summary: "Start a conversation in a workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssistantConversationRequest" }
      responses:
        "201":
          description: "Conversation created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /assistant/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Assistant]
      operationId: getAssistantConversation
      summary: "A conversation and its persisted messages"
      responses:
        "200":
          description: "Conversation detail"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Assistant]
      operationId: deleteAssistantConversation
      summary: "Delete the caller's conversation"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistant/conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Assistant]
      operationId: sendAssistantMessage
      summary: "Send a user message; the turn runs in the background"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendAssistantMessageRequest" }
      responses:
        "202":
          description: "Turn accepted"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendAssistantMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /assistant/conversations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Assistant]
      operationId: cancelAssistantTurn
      summary: "Stop the running turn"
      responses:
        "202": { description: "Cancel requested" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistant/conversations/{id}/events:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Assistant]
      operationId: streamAssistantConversation
      summary: "Replay persisted messages and stream the live turn (SSE)"
      parameters:
        - name: after_seq
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: "SSE stream (message, delta, state)"
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/assistant/settings:
    get:
      tags: [Assistant]
      operationId: getAssistantSettings
      summary: "Assistant provider and data-sharing settings (G-admin)"
      responses:
        "200":
          description: "Settings"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Assistant]
      operationId: putAssistantSettings
      summary: "Update assistant settings; the API key is write-only (G-admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAssistantSettingsRequest" }
      responses:
        "200":
          description: "Settings updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /admin/assistant/test:
    post:
      tags: [Assistant]
      operationId: testAssistant
      summary: "Send a one-token prompt to the configured provider (G-admin)"
      responses:
        "200":
          description: "Test result"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Identity providers (admin) ────────────────────────────────
  /admin/identity-providers:
    get:
      tags: [Identity]
      operationId: listIdentityProviders
      summary: "List configured identity providers — admin only"
      description: "Returns every provider (enabled or not) with no secrets. `has_client_secret` and `has_bind_password` report presence only."
      responses:
        "200":
          description: "List of providers"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IdentityProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Identity]
      operationId: createIdentityProvider
      summary: "Create an identity provider — admin only"
      description: "Validates the type-specific configuration and seals it with the keyring. The secret is written once and never returned."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIdentityProviderRequest" }
      responses:
        "201":
          description: "Provider created (secrets redacted)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /admin/identity-providers/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Identity]
      operationId: getIdentityProvider
      summary: "Get an identity provider — admin only"
      description: "Returns the redacted configuration; secrets are never included."
      responses:
        "200":
          description: "Provider (secrets redacted)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Identity]
      operationId: updateIdentityProvider
      summary: "Update an identity provider — admin only"
      description: "Partial update. Omitted secret fields keep the stored value; an empty secret clears it. The provider type is immutable."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIdentityProviderRequest" }
      responses:
        "200":
          description: "Provider updated (secrets redacted)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Identity]
      operationId: deleteIdentityProvider
      summary: "Delete an identity provider — admin only"
      description: "Refuses with 409 when users are still linked, unless `suspend_users=true` is given; those users are suspended and detached, never orphaned."
      parameters:
        - name: suspend_users
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/identity-providers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Identity]
      operationId: testIdentityProvider
      summary: "Test a stored identity provider — admin only"
      description: "Probes the stored configuration and persists nothing. An LDAP probe binds with the service account only, never as an end user."
      parameters:
        - name: test_username
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "Probe result"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/identity-providers/test:
    post:
      tags: [Identity]
      operationId: testIdentityProviderTransient
      summary: "Test an unsaved identity provider — admin only"
      description: "Validates and probes a configuration before it is saved. Nothing is written."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestIdentityProviderRequest" }
      responses:
        "200":
          description: "Probe result"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /admin/identity-providers/mapping-preview:
    post:
      tags: [Identity]
      operationId: previewIdentityMapping
      summary: "Preview directory group mapping — admin only"
      description: "Runs the same pure mapping as login and returns the derived role and teams. It contacts no directory and persists nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityMappingPreviewRequest" }
      responses:
        "200":
          description: "Derived role and teams"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityMappingPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Users ─────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: "List all users — admin only"
      parameters:
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPerPage"
      responses:
        "200":
          description: "Paginated list"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserPublic" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/invite:
    post:
      tags: [Users]
      operationId: inviteUser
      summary: "Invite a new user — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: "Invitation sent"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [Users]
      operationId: updateUserRole
      summary: "Update user role — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRoleRequest" }
      responses:
        "200":
          description: "User updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      operationId: removeUser
      summary: "Remove a user — admin only"
      description: >
        409 user_owns_workspace when the user owns a workspace (every user who
        has logged in owns a personal one): removing the user would delete its
        content, so it is refused. Suspension is #54.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Users]
      operationId: suspendUser
      summary: "Suspend a user — admin only"
      description: "Suspends without deleting, revokes the user's refresh tokens and API keys, and audits the change. The user is never deleted."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendUserRequest" }
      responses:
        "200":
          description: "User suspended"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/reinstate:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Users]
      operationId: reinstateUser
      summary: "Reinstate a user — admin only"
      description: "Clears the suspension and audits the change."
      responses:
        "200":
          description: "User reinstated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me:
    get:
      tags: [Users]
      operationId: getProfile
      summary: "Current user profile"
      responses:
        "200":
          description: "Profile"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      operationId: updateProfile
      summary: "Update current user profile"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: "Profile updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /me/password:
    patch:
      tags: [Users]
      operationId: updatePassword
      summary: "Change current user password"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePasswordRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Teams ─────────────────────────────────────────────────────
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: "List all teams"
      responses:
        "200":
          description: "Teams"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: "Create a team — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: "Team created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Teams]
      operationId: getTeam
      summary: "Team details"
      responses:
        "200":
          description: "Team"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: "Remove a team — admin only"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: "List team members"
      responses:
        "200":
          description: "Members"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Teams]
      operationId: addTeamMember
      summary: "Add user to team — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddTeamMemberRequest" }
      responses:
        "201":
          description: "Member added"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /teams/{id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Teams]
      operationId: updateTeamMemberRole
      summary: "Change a team member's role — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTeamMemberRoleRequest" }
      responses:
        "200":
          description: "Member updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: "Remove user from team — admin only"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Workspaces ────────────────────────────────────────────────
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: "List workspaces accessible to current user"
      responses:
        "200":
          description: "Workspaces"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: "Create a workspace — admin only for shared"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: "Workspace created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: "Workspace details"
      responses:
        "200":
          description: "Workspace"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: "Update a workspace — workspace owners and admins"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceRequest" }
      responses:
        "200":
          description: "Workspace updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: "Delete a shared workspace and its content — owner or admin"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{id}/impact:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Workspaces]
      operationId: getWorkspaceImpact
      summary: "What a workspace delete would remove — owner or admin"
      responses:
        "200":
          description: "Impact"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceImpact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/catalog-access/{catalog_id}/impact:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Workspaces]
      operationId: getCatalogAccessImpact
      summary: "What revoking this catalog grant would affect — owner or admin"
      responses:
        "200":
          description: "Impact"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceImpact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: "Audit trail, newest first — admins see every event, others their own"
      description: >
        Append-only record of security and data operations (#45). A global
        admin sees all events; any other user only events they performed
        (actor_id is forced to the caller).
      parameters:
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [allowed, denied, error] } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, description: "next_cursor of the previous page", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: "One page of events"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /audit/actions:
    get:
      tags: [Audit]
      operationId: listAuditActions
      summary: "The bounded audit action vocabulary"
      responses:
        "200":
          description: "Actions"
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /audit/resolve:
    post:
      tags: [Audit]
      operationId: resolveAudit
      summary: "Resolve audit ids to names, only entities the caller can see"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditResolveRequest" }
      responses:
        "200":
          description: "Resolved names"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditResolveResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /audit/events.csv:
    get:
      tags: [Audit]
      operationId: exportAuditCSV
      summary: "Export the current audit filter as CSV — admins"
      parameters:
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [allowed, denied, error] } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: "CSV export"
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Attention ─────────────────────────────────────────────────
  /attention:
    get:
      tags: [Observability]
      operationId: listAttention
      summary: "Items that need the caller's attention"
      description: >
        Computed on demand from the current state; no read/unread state is
        stored and no e-mail is sent. Items are scoped to what the caller can
        act on through the same predicates that guard the fix, so admin-only
        kinds are hidden from members. Cached for 30 s per user.
      responses:
        "200":
          description: "Attention items, errors first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttentionItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workspaces/{id}/metadata/catalogs:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Metadata]
      operationId: listMetadataCatalogs
      summary: "Catalogs the workspace may browse, with freshness and bindings — workspace members"
      description: >
        Read from the stored metadata snapshot (#15), never from an engine.
        Every read under /metadata is scoped to the workspace and to the
        catalogs granted to it; anything else is a 404.
      responses:
        "200":
          description: "Granted catalogs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetadataCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/metadata/catalogs/{catalog_id}/namespaces:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Metadata]
      operationId: listMetadataNamespaces
      summary: "Child namespaces of a namespace (none given: the top level)"
      parameters:
        - name: parent
          in: query
          description: "The parent namespace, one value per level (parent=a&parent=b is a.b); a dot inside a level is part of its name"
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        "200":
          description: "Namespaces"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataNamespaceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/metadata/catalogs/{catalog_id}/tables:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Metadata]
      operationId: listMetadataTables
      summary: "Tables of a namespace, by name, one page at a time"
      parameters:
        - name: ns
          in: query
          description: "The namespace, one value per level (ns=a&ns=b is a.b); none: tables without a namespace (SQLite)"
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: cursor
          in: query
          description: "next_cursor of the previous page"
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: "One page of tables"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataTablePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/metadata/tables/{table_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: table_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Metadata]
      operationId: getMetadataTable
      summary: "A table with its columns, typed and named for one of its catalog's bindings"
      parameters:
        - name: binding_id
          in: query
          description: "The binding the user browses through: types are shown (display_type) and the name qualified in its engine's dialect. Default: the catalog's first enabled binding"
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "The table"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataTableDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/metadata/search:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Metadata]
      operationId: searchMetadata
      summary: "Tables and columns whose names match, best first (autocomplete and search)"
      description: >
        Trigram similarity over table and column names of the granted
        catalogs; removed tables are left out.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: kind
          in: query
          schema: { type: string, enum: [table, column, all], default: all }
        - name: catalog_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: "Matches"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetadataSearchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Semantic layer (#33) ──────────────────────────────────────
  /workspaces/{id}/semantic/tags:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Semantic]
      operationId: listSemanticTags
      summary: "Tags used by docs on catalogs the workspace may use"
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: "Tags"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticTag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/semantic/docs:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: query
        required: true
        schema: { type: string, format: uuid }
      - name: ns
        in: query
        required: true
        description: "The namespace, one value per level (ns=a&ns=b is a.b)"
        schema: { type: array, items: { type: string } }
        style: form
        explode: true
      - name: table
        in: query
        required: true
        schema: { type: string }
      - name: column
        in: query
        description: "Narrow to one column; omitted returns the table-level and every column doc"
        schema: { type: string }
    get:
      tags: [Semantic]
      operationId: listSemanticDocs
      summary: "Docs of one table or one column — workspace members"
      responses:
        "200":
          description: "Docs, table-level first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticDoc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Semantic]
      operationId: upsertSemanticDoc
      summary: "Create or replace a doc — workspace members"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemanticDocUpsert" }
      responses:
        "200":
          description: "The doc"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticDoc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Semantic]
      operationId: deleteSemanticDoc
      summary: "Delete a doc — workspace members"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/semantic/docs/search:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Semantic]
      operationId: searchSemanticDocs
      summary: "Search docs by text and tag — workspace members"
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: tag
          in: query
          schema: { type: string }
        - name: certified
          in: query
          schema: { type: boolean }
        - name: owner_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: "Best match first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticDocSearchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/semantic/metrics:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Semantic]
      operationId: listSemanticMetrics
      summary: "Metrics of the workspace — workspace members"
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: space_id
          in: query
          schema: { type: string, format: uuid }
        - name: catalog_id
          in: query
          schema: { type: string, format: uuid }
        - name: certified
          in: query
          schema: { type: boolean }
        - name: owner_id
          in: query
          schema: { type: string, format: uuid }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: "Metrics, ordered by label"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      tags: [Semantic]
      operationId: createSemanticMetric
      summary: "Create and validate a metric — space editor"
      description: >
        The definition is validated structurally (DisallowUnknownFields) and
        then rendered for the chosen binding and probed with a zero-row
        read-only statement in the caller's identity. A custom_sql metric also
        needs the engine to enforce read-only (or read-only credentials).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemanticMetricCreate" }
      responses:
        "201":
          description: "The metric"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/semantic/metrics/render:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Semantic]
      operationId: renderSemanticMetric
      summary: "Render a metric definition to SQL — no engine call"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemanticMetricRenderRequest" }
      responses:
        "200":
          description: "SQL"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetricRenderResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/semantic/metrics/validate:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Semantic]
      operationId: validateSemanticMetricDefinition
      summary: "Probe a metric definition against its engine — caller identity, read-only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemanticMetricRenderRequest" }
      responses:
        "200":
          description: "Valid"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetricValidateResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/semantic/metrics/{metric_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: metric_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Semantic]
      operationId: getSemanticMetric
      summary: "Return a metric — space viewer"
      responses:
        "200":
          description: "The metric"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetric" }

openapi: "3.0.3"
info:
  title: "Baleia API"
  description: |
    First-class UI for Trino + Apache Iceberg catalog management platform.

    ## Serialization

    **JSON** (`application/json`) for application data: auth, users, teams,
    workspaces, catalog connections, retrievers, migrations.

    **Arrow IPC** (`application/vnd.apache.arrow.stream`) for data originating
    from Trino: query results, explain plans, Iceberg catalog.

    ## Authentication

    JWT via `Authorization: Bearer <token>` or `token` cookie (for WebSocket).
    API Keys via `X-Api-Key` header.

  version: "0.1.0"

servers:
  - url: "/api/v1"

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Setup
    description: "Initial system configuration"
  - name: Auth
    description: "Authentication and sessions"
  - name: ApiKeys
    description: "Programmatic access keys"
  - name: Users
    description: "User profiles and administration"
  - name: Teams
    description: "Team management"
  - name: Workspaces
    description: "User or team workspaces"
  - name: CatalogConnections
    description: "External Iceberg catalog connections"
  - name: Engines
    description: "Query engines (federated or direct) and the catalogs bound to them"
  - name: Catalog
    description: "Iceberg catalog, namespace, and table exploration via Trino"
  - name: QueryEditor
    description: "Folders, saved queries, and executions"
  - name: Executions
    description: "Execution lifecycle — submit, status, cancel, streaming"
  - name: Retrievers
    description: "Scheduled Iceberg materialized views"
  - name: Migrant
    description: "Zero-copy catalog migration (Nessie → Polaris)"
  - name: Semantic
    description: "Semantic layer v1: table/column docs, tags, owners and simple metrics"
  - name: Spaces
    description: "Space containers, their access lists and the content they own"

# ═══════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueryPage:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    QueryPerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    NoContent:
      description: "Successful response with no body"
    Unauthorized:
      description: "Missing or invalid credentials"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "Insufficient permissions"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "Resource already exists"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: "Validation error"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    ArrowStream:
      description: "Apache Arrow IPC stream"
      content:
        application/vnd.apache.arrow.stream:
          schema: { type: string, format: binary }
  schemas:
    # ── Generic ────────────────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: "not_found" }
        message: { type: string }

    ValidationError:
      type: object
      required: [code, message, errors]
      properties:
        code: { type: string, example: "validation_error" }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    # ── Setup ──────────────────────────────────────────────────
    SetupStatus:
      type: object
      required: [is_configured, version]
      properties:
        is_configured: { type: boolean }
        version: { type: string, example: "0.1.0" }

    CreateAdminRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    # ── Auth ───────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, refresh_token, expires_at, user]
      properties:
        token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/UserPublic" }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    RefreshResponse:
      type: object
      required: [token, refresh_token, expires_at]
      properties:
        token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: string, format: date-time }

    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string }

    OIDCProvider:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Okta" }
        type: { type: string, enum: [oidc] }

    PasswordResetRequestBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PasswordResetConfirmBody:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }

    # ── API Keys ───────────────────────────────────────────────
    ApiKey:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, example: "blw_live_abc..." }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "Displayed only once upon creation"

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }

    # ── Users ──────────────────────────────────────────────────
    UserPublic:
      type: object
      required: [id, name, email, role, auth_provider, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
        auth_provider: { type: string, enum: [local, oidc] }
        created_at: { type: string, format: date-time }

    # ── Allowed actions (#104) ──────────────────────────────────
    CatalogConnectionAllowedAction:
      type: string
      enum: [view, update, delete, test, register_engine, create_catalog]
    EngineAllowedAction:
      type: string
      enum: [view, update, delete, test, reconcile, bind_into]
    CatalogAllowedAction:
      type: string
      enum: [view, browse, update, delete, sync_metadata, grant, create_binding]
    CatalogBindingAllowedAction:
      type: string
      enum: [view, update, delete, sync]
    WorkspaceAllowedAction:
      type: string
      enum: [view, update, delete, manage_grants, set_defaults, run, create_space]
    GlobalAction:
      type: string
      enum: [create_connection, create_workspace, create_shared_workspace, manage_users,
             manage_identity, view_all_audit, view_system, manage_assistant]
    Features:
      type: object
      required: [agents, assistant, retrievers]
      properties:
        agents: { type: boolean }
        assistant: { type: boolean }
        retrievers: { type: boolean }
    Me:
      allOf:
        - $ref: "#/components/schemas/UserPublic"
        - type: object
          required: [features, global_actions]
          properties:
            personal_workspace_id: { type: string, format: uuid, nullable: true }
            features: { $ref: "#/components/schemas/Features" }
            global_actions:
              type: array
              items: { $ref: "#/components/schemas/GlobalAction" }

    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }

    UpdatePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, member] }

    # ── Teams ──────────────────────────────────────────────────
    Team:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    TeamMember:
      type: object
      required: [user, role, joined_at]
      properties:
        user: { $ref: "#/components/schemas/UserPublic" }
        role: { type: string, enum: [owner, member] }
        joined_at: { type: string, format: date-time }

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    AddTeamMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, member], default: member }

    # ── Workspaces ─────────────────────────────────────────────
    Workspace:
      type: object
      required: [id, name, type, polaris_catalog_name, created_at, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/WorkspaceAllowedAction" }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        type: { type: string, enum: [personal, shared] }
        polaris_catalog_name: { type: string, deprecated: true, description: "Legacy; never used to resolve an execution target" }
        default_binding_id: { type: string, format: uuid, nullable: true, description: "Target used when a run names none (GET /workspaces/{id}/targets)" }
        default_schema: { type: string, nullable: true }
        owner_user_id: { type: string, format: uuid, nullable: true }
        owner_team_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateWorkspaceRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [personal, shared] }
        owner_team_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: "Required when type=shared",
          }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        default_target:
          type: object
          description: >
            Sets the workspace default target ({"binding_id": null} clears it).
            The binding must be a target of the workspace
            (GET /workspaces/{id}/targets). Omitted, the default is unchanged.
          properties:
            binding_id: { type: string, format: uuid, nullable: true }
            schema: { type: string, nullable: true }

    TargetRequest:
      type: object
      description: >
        Where to run. binding_id names a target; catalog_id picks the catalog's
        only enabled binding, or the one on engine_id when it has several.
        Omitted, the workspace default applies, else the workspace's only
        target; otherwise 422 target_required.
      properties:
        binding_id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        schema: { type: string }

    ExecutionTarget:
      type: object
      description: "The target an execution ran on, as recorded when it started"
      properties:
        engine_id: { type: string, format: uuid, nullable: true }
        binding_id: { type: string, format: uuid, nullable: true }
        catalog_id: { type: string, format: uuid, nullable: true }
        engine_kind: { type: string }
        engine_name: { type: string }
        catalog_name: { type: string }
        engine_catalog: { type: string }
        schema: { type: string, nullable: true }
        read_only: { type: boolean }

    WorkspaceTarget:
      type: object
      required: [binding_id, catalog_id, catalog_name, engine_id, engine_name, engine_kind, engine_catalog_name, mode, permission, is_default]
      properties:
        binding_id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        catalog_name: { type: string }
        engine_id: { type: string, format: uuid }
        engine_name: { type: string }
        engine_kind: { type: string }
        engine_catalog_name: { type: string }
        mode: { type: string, enum: [managed, adopted, native] }
        permission: { type: string, enum: [read, write], description: "read targets run in read-only sessions where the engine enforces it" }
        is_default: { type: boolean }

    # ── Catalogs ─────────────────────────────────────────────────
    Catalog:
      type: object
      required: [allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/CatalogAllowedAction" }
        id:                  { type: string, format: uuid }
        connection_id:       { type: string, format: uuid }
        name:                { type: string }
        description:         { type: string, nullable: true }
        trino_catalog_name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
          description: Trino catalog identifier (lowercase, letters/digits/underscore).
        warehouse:           { type: string, description: Iceberg warehouse identifier }
        connector:
          type: string
          default: iceberg
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        enabled:             { type: boolean, default: true }
        sync_status:
          type: string
          enum: [pending, synced, error, draining, disabled]
          readOnly: true
          description: The derived sync status of the catalog's binding on its Trino cluster (see CatalogBinding.sync_status; draining is no longer produced).
        sync_error:          { type: string, nullable: true, readOnly: true }
        catalog_version:    { type: string, nullable: true, readOnly: true, description: SHA-256 hash of the registered properties (matches the plugin's computeCatalogVersion) }
        metadata_synced_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: End of the latest finished metadata pass of the catalog (#17); null before the first one.
        metadata_sync_status:
          type: string
          enum: [never, running, finished, failed]
          readOnly: true
          description: Status of the latest metadata pass. Every catalog is refreshed every BALEIA_METADATA_SYNC_INTERVAL (15m) and right after it is created or changed.
        metadata_sync_error_code:
          type: string
          nullable: true
          readOnly: true
          description: The latest pass's error code when it failed (see MetadataSyncRun.error_code).
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }

    CreateCatalogRequest:
      type: object
      required: [name, trino_catalog_name, warehouse]
      properties:
        name:               { type: string }
        trino_catalog_name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        warehouse:          { type: string }
        connector:
          type: string
          default: iceberg
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        description:        { type: string }
        extra_props:
          type: object
          additionalProperties: { type: string }
          description: Connector-specific overrides (flat string→string map) merged on top of the auto-generated properties.
        enabled:            { type: boolean, default: true }

    # ── Catalog Connections ────────────────────────────────────
    CatalogConnection:
      type: object
      required: [id, name, type, url, config, default_readonly, has_credentials, created_at, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/CatalogConnectionAllowedAction" }
        id:   { type: string, format: uuid }
        name: { type: string }
        type: { type: string, description: "Connection kind; one of the kinds listed by GET /connection-providers" }
        url:  { type: string, description: "Deprecated: read config. Kept while the Trino projection still reads it (#80)" }
        config:
          type: object
          additionalProperties: { type: string }
          description: "Non-secret values of the provider's config schema. Secret fields are never returned"
        host: { type: string }
        port: { type: string }
        has_credentials: { type: boolean, description: "Whether stored credentials exist; the secret itself is never returned" }
        default_readonly: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCatalogConnectionRequest:
      type: object
      required: [name, type]
      description: >
        Values and secrets are validated against the provider's config schema
        (GET /connection-providers): unknown keys, missing required fields and
        kinds without a provider answer 422. Non-secret fields go in `config`,
        secret fields in `credentials`. `url` and the typed `*_credentials`
        objects are the older shape and are still accepted.
      properties:
        name: { type: string }
        type: { type: string, description: "A kind listed by GET /connection-providers" }
        url: { type: string, description: "Older shape: the endpoint URL (a JDBC URL for databases). Prefer config" }
        config:
          type: object
          additionalProperties: { type: string }
          description: "Non-secret fields of the provider's config schema"
        default_readonly: { type: boolean, default: true }
        credentials:
          type: object
          description: "Secret fields of the provider's config schema. Older clients also send non-secret fields here (client_id, username); they are moved to config"
        nessie_credentials:
          $ref: "#/components/schemas/NessieCredentials"
        glue_credentials:
          $ref: "#/components/schemas/GlueCredentials"
        hive_credentials:
          $ref: "#/components/schemas/HiveCredentials"
        iceberg_credentials:
          $ref: "#/components/schemas/IcebergCredentials"
        postgresql_credentials:
          $ref: "#/components/schemas/SqlCredentials"
        mysql_credentials:
          $ref: "#/components/schemas/SqlCredentials"

    # ── Catalog Connection Credentials ───────────────────

    IcebergCredentials:
      type: object
      properties:
        token: { type: string, description: "Bearer token" }
        client_id: { type: string, description: "OAuth2 client ID" }
        client_secret: { type: string, description: "OAuth2 client secret" }
        oauth2_server_uri:
          { type: string, description: "OAuth2 token endpoint custom" }

    PolarisCredentials:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        realm:
          { type: string, description: "Realm do Polaris. Default: POLARIS" }

    NessieCredentials:
      type: object
      properties:
        token: { type: string, description: "Bearer token optional" }

    GlueCredentials:
      type: object
      required: [access_key_id, secret_access_key, region]
      properties:
        access_key_id: { type: string }
        secret_access_key: { type: string }
        region: { type: string }

    HiveCredentials:
      type: object
      properties:
        username: { type: string }
        password: { type: string }

    SqlCredentials:
      type: object
      properties:
        username: { type: string }
        password: { type: string }

    UpdateCatalogConnectionRequest:
      type: object
      description: >
        Partial update. `config` keys are merged into the stored values (an
        empty string clears an optional field). `credentials` keys replace the
        stored secrets they name; secrets that are absent are kept. The result
        is validated like a create.
      properties:
        name: { type: string }
        url: { type: string, description: "Older shape: the endpoint URL. Prefer config" }
        config:
          type: object
          additionalProperties: { type: string }
        credentials: { type: object }
        default_readonly: { type: boolean }

    Engine:
      type: object
      required: [id, name, kind, class, connection_id, identity_mode, enabled, created_at, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/EngineAllowedAction" }
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, description: "Query-engine kind: trino, postgresql, mysql, …" }
        class: { type: string, enum: [federated, direct] }
        connection_id: { type: string, format: uuid }
        identity_mode: { type: string, enum: [impersonation, connection, per_user] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version:
          type: string
          nullable: true
          description: "Server version reported by the engine (cached 5 minutes); null when unknown or unreachable"
        capabilities:
          allOf: [{ $ref: "#/components/schemas/EngineCapabilities" }]
          nullable: true
          description: "What the engine can do; null when the engine is disabled or no adapter for its kind is available yet"
        dialect:
          allOf: [{ $ref: "#/components/schemas/EngineDialect" }]
          nullable: true
          description: "How to write SQL for it; keyword and function lists are at GET /dialects/{name}"

    EngineCapabilities:
      type: object
      description: >
        What an engine can do. Capabilities never authorize anything: what a
        user may run is decided by policy (catalog DDL is never allowed in the
        editor, whatever supports_catalog_ddl says).
      required: [dialect, identity_modes, read_only, supports_cancel, transactions, multiple_result_sets,
        multiple_catalogs, namespace_depth, session_schema, supports_explain, supports_time_travel,
        supports_catalog_ddl, monitoring, iceberg_maintenance, arrow_native, max_identifier_length, identifier_case]
      properties:
        dialect: { type: string }
        identity_modes:
          type: array
          items: { type: string, enum: [impersonation, connection, per_user] }
        read_only: { type: string, enum: [enforced, none], description: "enforced: the engine guarantees read-only sessions; none: only a read-only database role can" }
        supports_cancel: { type: boolean }
        cancel_scope: { type: string, enum: [any_process, in_process], nullable: true }
        transactions: { type: boolean }
        multiple_result_sets: { type: boolean }
        multiple_catalogs: { type: boolean }
        namespace_depth: { type: integer, description: "Schema depth in SQL; 0 when the engine has no schemas" }
        session_schema: { type: boolean }
        supports_explain: { type: boolean }
        supports_time_travel: { type: boolean }
        supports_catalog_ddl: { type: boolean, description: "Informational only" }
        monitoring: { type: boolean }
        iceberg_maintenance: { type: boolean }
        arrow_native: { type: boolean }
        max_identifier_length: { type: integer, description: "0 when unknown" }
        identifier_case: { type: string, enum: [preserve, lower, upper] }

    EngineDialect:
      type: object
      required: [name, formatter_language, codemirror_base]
      properties:
        name: { type: string }
        formatter_language: { type: string, description: "sql-formatter language id" }
        codemirror_base: { type: string, description: "@codemirror/lang-sql base dialect" }

    Dialect:
      allOf:
        - $ref: "#/components/schemas/EngineDialect"
        - type: object
          required: [keywords, functions]
          properties:
            keywords: { type: array, items: { type: string } }
            functions: { type: array, items: { type: string } }

    SplitStatementsRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string, maxLength: 1048576 }

    StatementSpan:
      type: object
      required: [start, end]
      description: "One statement, as offsets into the submitted SQL in UTF-16 code units (JavaScript string indices), end exclusive"
      properties:
        start: { type: integer }
        end: { type: integer }

    CreateEngineRequest:
      type: object
      required: [name, connection_id]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_-]{0,62}$" }
        connection_id: { type: string, format: uuid, description: "A connection whose provider has the direct_engine role" }

    UpdateEngineRequest:
      type: object
      properties:
        enabled: { type: boolean }

    AuditEvent:
      type: object
      required: [id, occurred_at, actor_kind, action, resource_type, outcome]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_kind: { type: string, enum: [user, service, agent, anonymous] }
        actor_id: { type: string, nullable: true }
        auth_method: { type: string, nullable: true }
        action: { type: string, description: "<resource>.<verb>, from a bounded vocabulary (internal/audit/actions.go)" }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        workspace_id: { type: string, format: uuid, nullable: true }
        outcome: { type: string, enum: [allowed, denied, error] }
        reason: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        client_ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        changes:
          type: object
          nullable: true
          description: '{"field": {"from": …, "to": …}}; secret values are "***"'
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}

    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor: { type: string, nullable: true }

    ReconcileAction:
      type: object
      required: [catalog, kind, reason, result]
      properties:
        catalog: { type: string, description: "The catalog's name in the engine" }
        kind: { type: string, enum: [create, recreate, drop, none] }
        reason: { type: string, description: "missing_in_engine, version_mismatch, binding_in_error, pending_drop, already_dropped, unprojectable, unknown" }
        result: { type: string, enum: [applied, failed, skipped_dry_run, reported] }
        error_code: { type: string, nullable: true }

    ReconcileRun:
      type: object
      required: [id, engine_id, started_at, finished_at, dry_run, actions, adopted]
      properties:
        id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        dry_run: { type: boolean }
        actions:
          type: array
          items: { $ref: "#/components/schemas/ReconcileAction" }
        adopted:
          type: array
          items: { type: string }
          description: "Catalogs the engine has that Baleia does not manage: reported, never dropped"
        error: { type: string, nullable: true }

    MetadataFreshness:
      type: object
      properties:
        metadata_synced_at:
          type: string
          format: date-time
          nullable: true
          description: End of the latest finished metadata pass of the catalog; null before the first one.

    MetadataCatalogBinding:
      type: object
      required: [binding_id, engine_id, engine_name, engine_kind, engine_catalog_name, mode, status]
      properties:
        binding_id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        engine_name: { type: string }
        engine_kind: { type: string }
        engine_catalog_name: { type: string }
        mode: { type: string, enum: [managed, adopted, native] }
        status: { type: string, description: "The binding's sync status (CatalogBinding.sync_status)" }

    MetadataCatalog:
      type: object
      required: [id, name, origin, provider_kind, metadata_sync_status, bindings]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        origin: { type: string, enum: [source, native] }
        provider_kind: { type: string, description: "The kind of the catalog's connection (polaris, postgresql, trino, …)" }
        metadata_synced_at: { type: string, format: date-time, nullable: true }
        metadata_sync_status: { type: string, enum: [never, running, finished, failed] }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/MetadataCatalogBinding" }

    MetadataNamespaceList:
      type: object
      required: [freshness, items]
      properties:
        freshness: { $ref: "#/components/schemas/MetadataFreshness" }
        items:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: { type: array, items: { type: string } }

    MetadataTableSummary:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [table, view, materialized_view] }
        comment: { type: string, nullable: true }
        last_changed_at: { type: string, format: date-time, nullable: true }

    MetadataTablePage:
      type: object
      required: [freshness, items]
      properties:
        freshness: { $ref: "#/components/schemas/MetadataFreshness" }
        items:
          type: array
          items: { $ref: "#/components/schemas/MetadataTableSummary" }
        next_cursor: { type: string, nullable: true, description: "Pass as cursor for the next page; null on the last one" }

    MetadataColumn:
      type: object
      required: [ordinal, name, native_type, type_system]
      properties:
        ordinal: { type: integer }
        name: { type: string }
        native_type: { type: string, description: "The type as the source reports it" }
        type_system: { type: string, description: "iceberg, postgresql, mysql, tsql, oracle, sqlite, clickhouse, trino, …" }
        display_type: { type: string, nullable: true, description: "native_type in the binding's engine dialect, when Baleia can map it" }
        nullable: { type: boolean, nullable: true }
        comment: { type: string, nullable: true }
        doc: { $ref: "#/components/schemas/SemanticDoc" }

    MetadataTableDetail:
      type: object
      required: [freshness, id, catalog_id, namespace, name, kind, properties, columns]
      properties:
        freshness: { $ref: "#/components/schemas/MetadataFreshness" }
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        name: { type: string }
        kind: { type: string, enum: [table, view, materialized_view] }
        comment: { type: string, nullable: true }
        properties: { type: object, additionalProperties: { type: string } }
        last_changed_at: { type: string, format: date-time, nullable: true }
        removed_at: { type: string, format: date-time, nullable: true, description: "Set when the source no longer has the table" }
        binding_id: { type: string, format: uuid, nullable: true, description: "The binding display_type and qualified_name are rendered for; null when the catalog has none" }
        qualified_name: { type: string, nullable: true, description: "The table's name in SQL on that binding's engine" }
        doc: { $ref: "#/components/schemas/SemanticDoc" }
        columns:
          type: array
          items: { $ref: "#/components/schemas/MetadataColumn" }

    MetadataSearchResult:
      type: object
      required: [kind, table_id, catalog_id, namespace, table, score]
      properties:
        kind: { type: string, enum: [table, column] }
        table_id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        column: { type: string, nullable: true }
        native_type: { type: string, nullable: true }
        score: { type: number, format: double }
        metadata_synced_at: { type: string, format: date-time, nullable: true }

    # ── Semantic layer (#33) ───────────────────────────────────
    SemanticDoc:
      type: object
      required: [id, catalog_id, namespace, table, description, tags, updated_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        column: { type: string, nullable: true, description: "Null for a table-level doc" }
        description: { type: string, description: "Markdown, at most 20 000 characters" }
        tags: { type: array, items: { type: string } }
        owner_user_id: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }

    SemanticDocUpsert:
      type: object
      required: [description]
      properties:
        description: { type: string, maxLength: 20000 }
        tags: { type: array, items: { type: string } }
        owner_user_id: { type: string, format: uuid, nullable: true }

    SemanticDocSearchResult:
      type: object
      required: [id, catalog_id, namespace, table, description, tags, updated_by, updated_at, score]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        column: { type: string, nullable: true }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        owner_user_id: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        score: { type: number, format: double }

    SemanticMetric:
      type: object
      required: [id, workspace_id, slug, label, catalog_id, namespace, table, definition, format_version, certified, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        binding_id: { type: string, format: uuid, nullable: true }
        definition:
          type: object
          additionalProperties: true
          description: >
            SimpleMetricV1: type, aggregation, column, filters, time_column,
            time_grains, format and custom_sql. Validated with
            DisallowUnknownFields.
        format_version: { type: integer }
        owner_user_id: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }

    SemanticMetricCreate:
      type: object
      required: [slug, label, catalog_id, namespace, table, definition]
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        binding_id: { type: string, format: uuid, nullable: true, description: "Engine used to validate and generate; null chooses at use time" }
        definition: { type: object, additionalProperties: true }
        owner_user_id: { type: string, format: uuid, nullable: true }

    SemanticMetricUpdate:
      type: object
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        catalog_id: { type: string, format: uuid }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        binding_id: { type: string, format: uuid, nullable: true }
        definition: { type: object, additionalProperties: true }
        owner_user_id: { type: string, format: uuid, nullable: true }

    SemanticMetricSQL:
      type: object
      required: [sql, portable]
      properties:
        sql: { type: string }
        portable: { type: boolean, description: "False when the metric uses custom_sql" }

    MetadataSyncStarted:
      type: object
      required: [catalog_id, workflow_id]
      properties:
        catalog_id: { type: string, format: uuid }
        workflow_id: { type: string }

    MetadataSyncRun:
      type: object
      required: [id, catalog_id, status, source_path, started_at]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        status: { type: string, enum: [running, finished, failed] }
        source_path:
          type: string
          enum: [provider, engine]
          description: >
            provider: read from the catalog's own source (catalog manager,
            database); engine: introspected through one of its bindings.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        tables_seen: { type: integer, nullable: true }
        tables_changed: { type: integer, nullable: true }
        tables_removed: { type: integer, nullable: true }
        error_code:
          type: string
          nullable: true
          description: >
            Why a pass failed: an engine code (engine_unavailable, timeout, …),
            not_found, interrupted (the worker stopped mid-pass), cancelled or
            sync_failed. The source's own message stays in the worker's logs.

    CatalogBinding:
      type: object
      required: [id, catalog_id, engine_id, engine_catalog_name, mode, enabled, allowed_actions]
      properties:
        allowed_actions:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/CatalogBindingAllowedAction" }
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        engine_id: { type: string, format: uuid }
        engine_catalog_name: { type: string, description: "The catalog's name in SQL on that engine" }
        connector: { type: string, nullable: true }
        mode: { type: string, enum: [managed, adopted, native] }
        enabled: { type: boolean }
        extra_props:
          type: object
          additionalProperties: { type: string }
        version: { type: string, nullable: true, description: "Version of the projection applied (write responses, when synced)" }
        lifecycle_state:
          type: string
          enum: [provisioning, active, updating, error, deprovisioning, disabled]
          description: "Where Baleia is in applying the binding (#38)"
        sync_status:
          type: string
          enum: [synced, pending, error, disabled]
          nullable: true
          description: >
            Derived: synced when the binding is active, the engine confirmed
            the desired version (Trino: the plugin rewrote the registry row)
            and the engine does not report it missing; pending while
            provisioning or updating or not yet confirmed; error (also when
            the engine could not load the active binding's catalog at boot,
            last_error_code engine_load_failed); disabled while deprovisioning
            or disabled.
        last_error_code: { type: string, nullable: true, description: "e.g. plugin_not_confirmed, engine_unavailable, engine_load_failed (the engine refused to load the catalog; sync the binding to apply it again), the engine's error name" }
        last_error_message: { type: string, nullable: true }

    CreateBindingRequest:
      type: object
      required: [engine_id, engine_catalog_name]
      properties:
        engine_id: { type: string, format: uuid }
        engine_catalog_name: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        connector: { type: string, description: "One of the engine's connectors for the source kind (GET /engines/{id}/binding-support); default the first" }
        extra_props:
          type: object
          additionalProperties: { type: string }
          description: "Merged over the projection; protected keys cannot be overridden"

    UpdateBindingRequest:
      type: object
      properties:
        engine_catalog_name: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        extra_props:
          type: object
          additionalProperties: { type: string }
          description: "Replaces the binding's extra properties"
        enabled: { type: boolean }

    BindingSupport:
      type: object
      required: [connectors, protected_key_patterns, reserved_names, writes_supported]
      properties:
        connectors: { type: array, items: { type: string }, description: "The first is the default" }
        protected_key_patterns: { type: array, items: { type: string }, description: "Glob patterns (case-insensitive) of extra-property keys that cannot be overridden" }
        reserved_names: { type: array, items: { type: string } }
        writes_supported: { type: boolean, description: "Whether Baleia supports writing through a binding of this kind; false for read-oriented sources (Unity Catalog)" }

    ConnectionProviderField:
      type: object
      required: [key, label, type, required, secret]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, secret, int, bool, select, url, file_path] }
        required: { type: boolean }
        secret: { type: boolean, description: "Sent in credentials, stored sealed, never returned" }
        default: { type: string }
        options: { type: array, items: { type: string } }
        help: { type: string }

    ConnectionProvider:
      type: object
      required: [kind, label, family, roles, status, config_schema]
      properties:
        kind: { type: string }
        label: { type: string }
        family: { type: string, enum: [iceberg, metastore, database, engine] }
        roles:
          type: array
          items: { type: string, enum: [metadata, direct_engine, federated_engine] }
        engine_kind: { type: string, description: "Query-engine kind when the connection can be an engine" }
        status:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [supported, preview, unsupported] }
            reason: { type: string }
        config_schema:
          type: array
          items: { $ref: "#/components/schemas/ConnectionProviderField" }

    TestCatalogConnectionResult:
      type: object
      required: [success, latency_ms]
      properties:
        success: { type: boolean }
        latency_ms: { type: integer }
        error: { type: string, nullable: true, description: "Deprecated: error_message" }
        version: { type: string, nullable: true }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ConnectionCheck" }
        error_code:
          type: string
          nullable: true
          enum: [unreachable, tls, auth_failed, forbidden, not_found, timeout, provider_unsupported, connection_denied_network, engine_unavailable, internal, null]
          description: "Why the first failing check failed"
        error_message: { type: string, nullable: true, description: "A short sentence; upstream bodies are logged, not returned" }

    ConnectionCheck:
      type: object
      required: [name, ok]
      properties:
        name: { type: string, description: "ping, list_catalogs, direct_engine, bind:<engine name>" }
        ok: { type: boolean }
        skipped: { type: boolean, description: "Not run (e.g. no engine adapter for the kind yet)" }
        detail: { type: string, nullable: true }
        error_code: { type: string, nullable: true }

    TestConnectionRequest:
      allOf:
        - $ref: "#/components/schemas/CreateCatalogConnectionRequest"
        - type: object
          properties:
            intents:
              type: array
              items: { type: string }
              description: >
                Checks to run: metadata, direct_engine, bind:<engine_id>.
                Default: every role the provider declares (a bind check on
                the default Trino engine for databases it can bind).

    WorkspaceCatalogAccess:
      type: object
      required: [catalog_id, permission, granted_at]
      properties:
        catalog_id: { type: string, format: uuid }
        catalog_name: { type: string }
        permission: { type: string, enum: [read, write] }
        granted_at: { type: string, format: date-time }

    GrantCatalogAccessRequest:
      type: object
      required: [catalog_id, permission]
      properties:
        catalog_id: { type: string, format: uuid }
        permission: { type: string, enum: [read, write] }

    # ── Query Editor ───────────────────────────────────────────
    Space:
      type: object
      required: [id, workspace_id, name, slug, visibility, default_role, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [workspace, restricted] }
        default_role: { type: string, enum: [viewer, editor] }
        is_default: { type: boolean }
        my_role:
          type: string
          enum: [viewer, editor, manager]
          nullable: true
          description: "The caller's effective role (list and get only)"
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSpaceRequest:
      type: object
      required: [name, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [workspace, restricted] }
        default_role: { type: string, enum: [viewer, editor], default: viewer }

    UpdateSpaceRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [workspace, restricted] }
        default_role: { type: string, enum: [viewer, editor] }

    SpaceMember:
      type: object
      required: [principal_type, principal_id, role]
      properties:
        principal_type: { type: string, enum: [user, team] }
        principal_id: { type: string, format: uuid }
        role: { type: string, enum: [viewer, editor, manager] }
        granted_by: { type: string, format: uuid, nullable: true }
        granted_at: { type: string, format: date-time }

    SetSpaceMemberRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [viewer, editor, manager] }

    QueryFolder:
      type: object
      required: [id, name, workspace_id, space_id, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        parent_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        space_id: { type: string, format: uuid, nullable: true, description: "Omitted: the workspace's default space" }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", nullable: true, description: "Omitted: derived from name" }
        parent_id: { type: string, format: uuid, nullable: true }

    SavedQueryTarget:
      type: object
      properties:
        binding_id: { type: string, format: uuid, nullable: true }
        schema: { type: string, nullable: true }

    ContentAuthor:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }

    ContentVersion:
      type: object
      required: [version, change_kind, created_at]
      properties:
        version: { type: integer }
        change_kind: { type: string, enum: [create, update, delete, restore, import] }
        author: { $ref: "#/components/schemas/ContentAuthor" }
        created_at: { type: string, format: date-time }
        restored_from: { type: integer, nullable: true }

    ContentVersionDetail:
      type: object
      required: [version, change_kind, created_at, snapshot]
      properties:
        version: { type: integer }
        change_kind: { type: string, enum: [create, update, delete, restore, import] }
        author: { $ref: "#/components/schemas/ContentAuthor" }
        created_at: { type: string, format: date-time }
        restored_from: { type: integer, nullable: true }
        snapshot: { type: object, additionalProperties: true }

    RestoreSavedQueryRequest:
      type: object
      properties:
        new_name: { type: string, nullable: true, description: "Retry a restorable name conflict with this name" }
        space_id: { type: string, format: uuid, nullable: true, description: "Pick a live space when the snapshot's space is gone" }

    RestoreSemanticMetricRequest:
      type: object
      properties:
        new_slug: { type: string, nullable: true, description: "Retry a slug conflict with this slug" }
        space_id: { type: string, format: uuid, nullable: true }

    TrashItem:
      type: object
      required: [entity_type, entity_id, slug, deleted_at, version]
      properties:
        entity_type: { type: string, enum: [saved_query, semantic_metric] }
        entity_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        space_id: { type: string, format: uuid }
        deleted_at: { type: string, format: date-time }
        version: { type: integer }

    BundleSpace:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    BundleTarget:
      type: object
      properties:
        engine: { type: string }
        catalog: { type: string }
        schema: { type: string, nullable: true }

    BundleItem:
      type: object
      required: [kind, slug]
      properties:
        kind: { type: string, enum: [folder, saved_query, semantic_metric] }
        slug: { type: string }
        parent: { type: string, nullable: true }
        name: { type: string }
        folder: { type: string, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/BundleTarget" }
        format_version: { type: integer }
        label: { type: string }
        description: { type: string }
        certified: { type: boolean }
        catalog: { type: string }
        namespace: { type: array, items: { type: string } }
        table: { type: string }
        definition: { type: object, additionalProperties: true }

    Bundle:
      type: object
      required: [format, format_version, space, items]
      properties:
        format: { type: string }
        format_version: { type: integer }
        baleia_version: { type: string }
        space: { $ref: "#/components/schemas/BundleSpace" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BundleItem" }

    ImportItem:
      type: object
      required: [kind, slug, action]
      properties:
        kind: { type: string }
        slug: { type: string }
        action: { type: string, enum: [CREATE, UPDATE, NO_CHANGES, ERROR] }
        message: { type: string }
        warnings: { type: array, items: { type: string } }

    ImportReport:
      type: object
      required: [mode, ok, items]
      properties:
        mode: { type: string, enum: [dry_run, apply] }
        ok: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportItem" }

    SavedQuery:
      type: object
      required: [id, name, workspace_id, space_id, slug, created_by, sql, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        folder_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/SavedQueryTarget" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSavedQueryRequest:
      type: object
      required: [name, sql]
      properties:
        name: { type: string }
        space_id: { type: string, format: uuid, nullable: true, description: "Omitted: the workspace's default space" }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", nullable: true, description: "Omitted: derived from name" }
        folder_id: { type: string, format: uuid, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/SavedQueryTarget" }

    UpdateSavedQueryRequest:
      type: object
      properties:
        name: { type: string }
        space_id: { type: string, format: uuid, nullable: true }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", nullable: true }
        folder_id: { type: string, format: uuid, nullable: true }
        move_to_root: { type: boolean, description: "Explicitly move the query to the space root; folder_id wins when present" }
        sql: { type: string }
        target: { $ref: "#/components/schemas/SavedQueryTarget" }

    # ── Executions ─────────────────────────────────────────────
    ExecutionRequest:
      type: object
      required: [workspace_id, sql]
      properties:
        workspace_id: { type: string, format: uuid }
        saved_query_id: { type: string, format: uuid, nullable: true }
        sql: { type: string }
        target: { $ref: "#/components/schemas/TargetRequest" }

    Execution:
      type: object
      required: [id, workspace_id, status, sql, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        saved_query_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [running, finished, failed, cancelled] }
        sql: { type: string }
        engine_query_id: { type: string, nullable: true, description: "The statement's id on its engine (a Trino query id, …). Was trino_query_id" }
        rows_returned: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        target: { $ref: "#/components/schemas/ExecutionTarget" }

    QueryStatement:
      type: object
      required: [id, execution_id, position, sql, status]
      properties:
        id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        position: { type: integer }
        sql: { type: string }
        status:
          type: string
          enum: [pending, running, finished, failed, cancelled, skipped]
          description: >
            All statements of an execution run in order in one engine session.
            `pending` has not started yet; `skipped` never ran because an
            earlier statement failed, the execution was cancelled, or the
            worker was interrupted.
        engine_query_id: { type: string, nullable: true, description: "The statement's id on its engine. Was trino_query_id" }
        rows_returned: { type: integer, nullable: true }
        result_sets:
          type: array
          description: "Stored results of the statement, one per result set"
          items:
            type: object
            required: [result_index, rows, bytes, truncated]
            properties:
              result_index: { type: integer }
              rows: { type: integer }
              bytes: { type: integer }
              truncated: { type: boolean }
        result_bytes: { type: integer, nullable: true }
        truncated: { type: boolean, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        error_code:
          type: string
          nullable: true
          description: >
            Typed reason of a failed or cancelled statement: an engine code
            (syntax, not_found, permission_denied, timeout, cancelled,
            resource_exhausted, engine_unavailable, read_only_unsupported,
            conflict, internal), `editor_rejected`, or `interrupted` when the
            worker stopped mid-statement (its outcome on the engine is unknown).
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    # ── Retrievers ─────────────────────────────────────────────
    Retriever:
      type: object
      required:
        [
          id,
          name,
          workspace_id,
          definition_sql,
          dest_catalog,
          dest_namespace,
          dest_table,
          cron_schedule,
          refresh_type,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        definition_sql: { type: string }
        dest_catalog: { type: string }
        dest_namespace: { type: string }
        dest_table: { type: string }
        cron_schedule: { type: string, example: "0 */6 * * *" }
        refresh_type: { type: string, enum: [incremental, full] }
        status: { type: string, enum: [active, paused, error] }
        last_refresh_at: { type: string, format: date-time, nullable: true }
        next_refresh_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRetrieverRequest:
      type: object
      required: [name, definition_sql, dest_catalog, dest_namespace, dest_table, cron_schedule]
      properties:
        name: { type: string }
        definition_sql:
          {
            type: string,
            description: "A single SELECT (or WITH ... SELECT) statement. Full refresh replaces the destination table atomically (CREATE OR REPLACE TABLE ... AS SELECT).",
          }
        dest_catalog: { type: string, description: "Destination catalog (lowercase identifier)." }
        dest_namespace: { type: string, description: "Destination namespace/schema (identifier)." }
        dest_table: { type: string, description: "Destination table name (identifier)." }
        cron_schedule: { type: string, description: "Standard five-field cron: minute hour day-of-month month day-of-week (UTC). The minimum interval is 5 minutes." }
        refresh_type:
          { type: string, enum: [incremental, full], default: full }

    UpdateRetrieverRequest:
      type: object
      properties:
        name: { type: string }
        cron_schedule: { type: string, description: "Standard five-field cron: minute hour day-of-month month day-of-week (UTC). The minimum interval is 5 minutes." }
        refresh_type: { type: string, enum: [incremental, full] }
        status: { type: string, enum: [active, paused] }

    RetrieverRefreshHistory:
      type: object
      required: [id, retriever_id, refresh_type, status, started_at]
      properties:
        id: { type: string, format: uuid }
        retriever_id: { type: string, format: uuid }
        temporal_workflow_id: { type: string }
        refresh_type: { type: string, enum: [incremental, full] }
        status: { type: string, enum: [running, finished, failed] }
        rows_processed: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    # ── Migrant ────────────────────────────────────────────────
    Migration:
      type: object
      required:
        [
          id,
          name,
          source_type,
          source_url,
          target_catalog_connection_id,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source_type: { type: string, enum: [nessie] }
        source_url: { type: string }
        target_catalog_connection_id: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [pending, running, finished, failed, cancelled],
          }
        total_tables: { type: integer }
        migrated_tables: { type: integer }
        failed_tables: { type: integer }
        temporal_workflow_id: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateMigrationRequest:
      type: object
      required: [name, source_type, source_url, target_catalog_connection_id]
      properties:
        name: { type: string }
        source_type: { type: string, enum: [nessie] }
        source_url: { type: string }
        source_credentials: { type: object, nullable: true }
        target_catalog_connection_id: { type: string, format: uuid }

    MigrationItem:
      type: object
      required:
        [
          id,
          migration_id,
          source_namespace,
          source_table,
          target_namespace,
          target_table,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        migration_id: { type: string, format: uuid }
        source_namespace: { type: string }
        source_table: { type: string }
        target_namespace: { type: string }
        target_table: { type: string }
        status:
          { type: string, enum: [pending, running, finished, failed, skipped] }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

# ═══════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════
paths:
  # ── Setup ─────────────────────────────────────────────────────
  /setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: "System configuration status"
      security: []
      responses:
        "200":
          description: "Status"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup/admin:
    post:
      tags: [Setup]
      operationId: createFirstAdmin
      summary: "Create first admin user"
      description: "Returns 409 if any user already exists."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminRequest" }
      responses:
        "201":
          description: "Admin created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Auth ──────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: "Authenticate and receive JWT"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: "Session created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: "Invalidate current session"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: "Exchange refresh token for new access token pair"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: "New token pair"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: "Return authenticated user, feature flags and global actions"
      responses:
        "200":
          description: "Current user, feature flags and global actions"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/oidc/providers:
    get:
      tags: [Auth]
      operationId: listOIDCProviders
      summary: "List configured OIDC providers"
      security: []
      responses:
        "200":
          description: "List of providers"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OIDCProvider" }

  /auth/oidc/{provider_id}/login:
    get:
      tags: [Auth]
      operationId: oidcRedirect
      summary: "Redirect to OIDC provider"
      security: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "302":
          description: "Redirect to provider"

  /auth/oidc/{provider_id}/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: "OIDC callback — exchange code for JWT"
      security: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: "Redirect to frontend with token"

  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: "Request password reset link"
      description: "Always returns 204 regardless of email existence. Returns 503 if email service is not configured."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequestBody" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "503":
          description: "Email service unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: "Confirm password reset with token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmBody" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── API Keys ──────────────────────────────────────────────────
  /api-keys:
    get:
      tags: [ApiKeys]
      operationId: listApiKeys
      summary: "List current user's API keys"
      responses:
        "200":
          description: "List of keys"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ApiKeys]
      operationId: createApiKey
      summary: "Create a new API key"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: "Key created — secret displayed only once"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    delete:
      tags: [ApiKeys]
      operationId: deleteApiKey
      summary: "Remove an API key"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Users ─────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: "List all users — admin only"
      parameters:
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPerPage"
      responses:
        "200":
          description: "Paginated list"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserPublic" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/invite:
    post:
      tags: [Users]
      operationId: inviteUser
      summary: "Invite a new user — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: "Invitation sent"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [Users]
      operationId: updateUserRole
      summary: "Update user role — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRoleRequest" }
      responses:
        "200":
          description: "User updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      operationId: removeUser
      summary: "Remove a user — admin only"
      description: >
        409 user_owns_workspace when the user owns a workspace (every user who
        has logged in owns a personal one): removing the user would delete its
        content, so it is refused. Suspension is #54.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me:
    get:
      tags: [Users]
      operationId: getProfile
      summary: "Current user profile"
      responses:
        "200":
          description: "Profile"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      operationId: updateProfile
      summary: "Update current user profile"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: "Profile updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    patch:
      tags: [Users]
      operationId: updatePassword
      summary: "Change current user password"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePasswordRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Teams ─────────────────────────────────────────────────────
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: "List all teams"
      responses:
        "200":
          description: "Teams"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: "Create a team — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: "Team created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Teams]
      operationId: getTeam
      summary: "Team details"
      responses:
        "200":
          description: "Team"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: "Remove a team — admin only"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: "List team members"
      responses:
        "200":
          description: "Members"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Teams]
      operationId: addTeamMember
      summary: "Add user to team — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddTeamMemberRequest" }
      responses:
        "201":
          description: "Member added"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /teams/{id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: "Remove user from team — admin only"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Workspaces ────────────────────────────────────────────────
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: "List workspaces accessible to current user"
      responses:
        "200":
          description: "Workspaces"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: "Create a workspace — admin only for shared"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: "Workspace created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: "Workspace details"
      responses:
        "200":
          description: "Workspace"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: "Update a workspace — workspace owners and admins"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceRequest" }
      responses:
        "200":
          description: "Workspace updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: "Audit trail, newest first — admins see every event, others their own"
      description: >
        Append-only record of security and data operations (#45). A global
        admin sees all events; any other user only events they performed
        (actor_id is forced to the caller).
      parameters:
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [allowed, denied, error] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, description: "next_cursor of the previous page", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: "One page of events"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/metadata/catalogs:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Metadata]
      operationId: listMetadataCatalogs
      summary: "Catalogs the workspace may browse, with freshness and bindings — workspace members"
      description: >
        Read from the stored metadata snapshot (#15), never from an engine.
        Every read under /metadata is scoped to the workspace and to the
        catalogs granted to it; anything else is a 404.
      responses:
        "200":
          description: "Granted catalogs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetadataCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/metadata/catalogs/{catalog_id}/namespaces:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Metadata]
      operationId: listMetadataNamespaces
      summary: "Child namespaces of a namespace (none given: the top level)"
      parameters:
        - name: parent
          in: query
          description: "The parent namespace, one value per level (parent=a&parent=b is a.b); a dot inside a level is part of its name"
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        "200":
          description: "Namespaces"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataNamespaceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/metadata/catalogs/{catalog_id}/tables:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Metadata]
      operationId: listMetadataTables
      summary: "Tables of a namespace, by name, one page at a time"
      parameters:
        - name: ns
          in: query
          description: "The namespace, one value per level (ns=a&ns=b is a.b); none: tables without a namespace (SQLite)"
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: cursor
          in: query
          description: "next_cursor of the previous page"
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: "One page of tables"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataTablePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/metadata/tables/{table_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: table_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Metadata]
      operationId: getMetadataTable
      summary: "A table with its columns, typed and named for one of its catalog's bindings"
      parameters:
        - name: binding_id
          in: query
          description: "The binding the user browses through: types are shown (display_type) and the name qualified in its engine's dialect. Default: the catalog's first enabled binding"
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "The table"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataTableDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/metadata/search:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Metadata]
      operationId: searchMetadata
      summary: "Tables and columns whose names match, best first (autocomplete and search)"
      description: >
        Trigram similarity over table and column names of the granted
        catalogs; removed tables are left out.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: kind
          in: query
          schema: { type: string, enum: [table, column, all], default: all }
        - name: catalog_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: "Matches"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetadataSearchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Semantic layer (#33) ──────────────────────────────────────
  /workspaces/{id}/semantic/docs:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: query
        required: true
        schema: { type: string, format: uuid }
      - name: ns
        in: query
        required: true
        description: "The namespace, one value per level (ns=a&ns=b is a.b)"
        schema: { type: array, items: { type: string } }
        style: form
        explode: true
      - name: table
        in: query
        required: true
        schema: { type: string }
      - name: column
        in: query
        description: "Narrow to one column; omitted returns the table-level and every column doc"
        schema: { type: string }
    get:
      tags: [Semantic]
      operationId: listSemanticDocs
      summary: "Docs of one table or one column — workspace members"
      responses:
        "200":
          description: "Docs, table-level first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticDoc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Semantic]
      operationId: upsertSemanticDoc
      summary: "Create or replace a doc — workspace members"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemanticDocUpsert" }
      responses:
        "200":
          description: "The doc"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticDoc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Semantic]
      operationId: deleteSemanticDoc
      summary: "Delete a doc — workspace members"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/semantic/docs/search:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Semantic]
      operationId: searchSemanticDocs
      summary: "Search docs by text and tag — workspace members"
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: tag
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: "Best match first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticDocSearchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/semantic/metrics:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Semantic]
      operationId: listSemanticMetrics
      summary: "Metrics of the workspace — workspace members"
      responses:
        "200":
          description: "Metrics, ordered by label"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Semantic]
      operationId: createSemanticMetric
      summary: "Create and validate a metric — space editor"
      description: >
        The definition is validated structurally (DisallowUnknownFields) and
        then rendered for the chosen binding and probed with a zero-row
        read-only statement in the caller's identity. A custom_sql metric also
        needs the engine to enforce read-only (or read-only credentials).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemanticMetricCreate" }
      responses:
        "201":
          description: "The metric"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/semantic/metrics/{metric_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: metric_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Semantic]
      operationId: getSemanticMetric
      summary: "Return a metric — space viewer"
      responses:
        "200":
          description: "The metric"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Semantic]
      operationId: updateSemanticMetric
      summary: "Update and revalidate a metric — space editor"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemanticMetricUpdate" }
      responses:
        "200":
          description: "The metric"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Semantic]
      operationId: deleteSemanticMetric
      summary: "Delete a metric — space editor"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/semantic/metrics/{metric_id}/sql:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: metric_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Semantic]
      operationId: getSemanticMetricSql
      summary: "Render a metric to SQL for one binding — space viewer"
      parameters:
        - name: binding_id
          in: query
          description: "Defaults to the metric's binding, else the catalog's first enabled binding"
          schema: { type: string, format: uuid }
        - name: grain
          in: query
          schema: { type: string, enum: [second, minute, hour, day, week, month, quarter, year] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: "The generated SQL"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetricSQL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── Content versions and trash (#34) ───────────────────────────
  /workspaces/{id}/queries/{query_id}/versions:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: query_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [QueryEditor]
      operationId: listSavedQueryVersions
      summary: "Version history of a saved query — viewer"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: "Newest first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContentVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/queries/{query_id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: query_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [QueryEditor]
      operationId: getSavedQueryVersion
      summary: "One saved-query version with its snapshot — viewer"
      responses:
        "200":
          description: "The version"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/queries/{query_id}/versions/{version}/restore:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: query_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [QueryEditor]
      operationId: restoreSavedQueryVersion
      summary: "Restore a saved query to a version — editor"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreSavedQueryRequest" }
      responses:
        "200":
          description: "The restored query"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/semantic/metrics/{metric_id}/versions:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: metric_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Semantic]
      operationId: listSemanticMetricVersions
      summary: "Version history of a metric — viewer"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: "Newest first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContentVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/semantic/metrics/{metric_id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: metric_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Semantic]
      operationId: getSemanticMetricVersion
      summary: "One metric version with its snapshot — viewer"
      responses:
        "200":
          description: "The version"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/semantic/metrics/{metric_id}/versions/{version}/restore:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: metric_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Semantic]
      operationId: restoreSemanticMetricVersion
      summary: "Restore a metric to a version — editor"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreSemanticMetricRequest" }
      responses:
        "200":
          description: "The restored metric"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/trash:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [QueryEditor]
      operationId: listTrash
      summary: "Deleted content that has not been restored — workspace members"
      parameters:
        - name: entity_type
          in: query
          schema: { type: string, enum: [saved_query, semantic_metric] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: "Deleted entities, newest first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Spaces (#40) ───────────────────────────────────────────────
  /workspaces/{id}/spaces:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Spaces]
      operationId: listSpaces
      summary: "Spaces the caller can see, with their role — workspace members"
      responses:
        "200":
          description: "Visible spaces, default first"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Space" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Spaces]
      operationId: createSpace
      summary: "Create a space; the creator becomes its manager — workspace members"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSpaceRequest" }
      responses:
        "201":
          description: "The space"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/spaces/{space_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: space_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Spaces]
      operationId: getSpace
      summary: "One space the caller can see"
      responses:
        "200":
          description: "The space"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Spaces]
      operationId: updateSpace
      summary: "Rename or re-scope a space — manager"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: "The space"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Spaces]
      operationId: deleteSpace
      summary: "Delete a space, its content, and its access list — manager"
      parameters:
        - name: force
          in: query
          description: "Delete even when the space still has content"
          schema: { type: boolean, default: false }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{id}/spaces/{space_id}/members:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: space_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Spaces]
      operationId: listSpaceMembers
      summary: "The space's access list — viewer"
      responses:
        "200":
          description: "Entries"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpaceMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/spaces/{space_id}/members/{principal_type}/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: space_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: principal_type
        in: path
        required: true
        schema: { type: string, enum: [user, team] }
      - name: principal_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Spaces]
      operationId: setSpaceMember
      summary: "Grant or raise a user/team role — manager"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSpaceMemberRequest" }
      responses:
        "200":
          description: "The entry"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Spaces]
      operationId: deleteSpaceMember
      summary: "Remove a user/team entry — manager"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/spaces/{space_id}/export:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: space_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Spaces]
      operationId: exportSpaceBundle
      summary: "Export a space as a deterministic bundle — viewer"
      description: >
        Repeated exports of unchanged content are byte-identical: items are
        ordered by dependency then (kind, slug), and the payload carries no
        ids, timestamps or secrets.
      responses:
        "200":
          description: "The bundle"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/spaces/{space_id}/import:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: space_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Spaces]
      operationId: importSpaceBundle
      summary: "Import a bundle, dry-run or apply — editor"
      description: >
        Upserts by (kind, slug): CREATE, UPDATE, NO_CHANGES or ERROR per item.
        Items absent from the bundle are never deleted. apply is all-or-nothing:
        any ERROR rolls everything back and answers 422.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [dry_run, apply], default: dry_run }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: "A baleia.bundle document, decoded with DisallowUnknownFields"
      responses:
        "200":
          description: "The per-item report"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/targets:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceTargets
      summary: "Where the workspace can run queries — workspace members"
      description: "Enabled bindings of the catalogs the workspace may use, on enabled engines."
      responses:
        "200":
          description: "Targets, ordered by catalog then engine"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/catalog-access:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceCatalogAccess
      summary: "List the catalogs granted to the workspace — workspace members"
      responses:
        "200":
          description: "Access grants"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceCatalogAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Workspaces]
      operationId: grantCatalogAccess
      summary: "Grant a catalog to the workspace — needs the catalog's connection owner (or admin) and a workspace owner (or admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantCatalogAccessRequest" }
      responses:
        "201":
          description: "Access granted"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceCatalogAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/catalog-access/{catalog_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Workspaces]
      operationId: revokeCatalogAccess
      summary: "Revoke a catalog grant — same rule as granting"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Catalog Connections ───────────────────────────────────────
  /connection-providers:
    get:
      tags: [CatalogConnections]
      operationId: listConnectionProviders
      summary: "Connection kinds, their roles and config schemas (drives the connection forms)"
      responses:
        "200":
          description: "Providers, ordered by kind"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectionProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /catalog-connections:
    get:
      tags: [CatalogConnections]
      operationId: listCatalogConnections
      summary: "List all catalog connections — admin only"
      responses:
        "200":
          description: "Connections"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [CatalogConnections]
      operationId: createCatalogConnection
      summary: "Create a catalog connection — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateCatalogConnectionRequest" }
      responses:
        "201":
          description: "Connection created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /catalog-connections/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [CatalogConnections]
      operationId: getCatalogConnection
      summary: "Connection details"
      responses:
        "200":
          description: "Connection"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [CatalogConnections]
      operationId: updateCatalogConnection
      summary: "Update a connection — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateCatalogConnectionRequest" }
      responses:
        "200":
          description: "Connection updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [CatalogConnections]
      operationId: deleteCatalogConnection
      summary: "Remove a connection — admin only"
      description: "Refused with 409 connection_in_use while an engine runs on the connection."
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /catalog-connections/test:
    post:
      tags: [CatalogConnections]
      operationId: testConnectionDraft
      summary: "Test connection settings before saving them"
      description: >
        Runs the checks on the submitted settings and persists nothing
        (#12): metadata (can Baleia read it), direct_engine (can Baleia run
        SQL on it, through a transient engine) and bind:<engine> (can a
        federated engine reach it, through a short-lived catalog that is
        always dropped). Rate limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestConnectionRequest" }
      responses:
        "200":
          description: "Test result"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCatalogConnectionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429":
          description: "Too many tests"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /catalog-connections/{id}/test:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [CatalogConnections]
      operationId: testCatalogConnection
      summary: "Test catalog connectivity"
      responses:
        "200":
          description: "Test result"
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/TestCatalogConnectionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Engines ───────────────────────────────────────────────────
  /engines:
    get:
      tags: [Engines]
      operationId: listEngines
      summary: "Engines the caller may see: all for an admin; else those on connections they own or hosting a catalog granted to one of their workspaces"
      responses:
        "200":
          description: "Engines, ordered by name"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Engines]
      operationId: createEngine
      summary: "Register a direct engine on a connection (its owner or an admin)"
      description: >
        The connection's provider must have the direct_engine role. Baleia
        checks that it can reach the engine, then creates the engine and one
        native catalog with a native binding per catalog the engine exposes.
        Federated engines are registered by Baleia (the default Trino engine).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEngineRequest" }
      responses:
        "201":
          description: "Engine created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: getEngine
      summary: "Engine details"
      responses:
        "200":
          description: "Engine"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Engines]
      operationId: updateEngine
      summary: "Enable or disable an engine (owner of its connection or an admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEngineRequest" }
      responses:
        "200":
          description: "Engine updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Engines]
      operationId: deleteEngine
      summary: "Remove an engine (owner of its connection or an admin)"
      description: >
        Refused with 409 engine_in_use while the engine has managed bindings or
        running executions. Its native catalogs and bindings are deleted with
        it; the connection stays.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /dialects/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Engines]
      operationId: getDialect
      summary: "A SQL dialect with its keyword and function lists (for the editor)"
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "Dialect"
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dialect" }
        "304":
          description: "Not modified (If-None-Match matched the ETag)"
          headers:
            ETag: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dialects/{name}/split:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Engines]
      operationId: splitStatements
      summary: "Split a script into statements with the dialect's rules"
      description: >
        Used by the editor to run the statement under the cursor, so the client
        and the server split the same way. Unterminated strings, quoted
        identifiers or comments, and MySQL's DELIMITER command, answer 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SplitStatementsRequest" }
      responses:
        "200":
          description: "Statements in order"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatementSpan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: listEngineBindings
      summary: "Catalogs bound to an engine"
      responses:
        "200":
          description: "Bindings, ordered by engine catalog name"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: listCatalogBindings
      summary: "Engines a catalog is bound to (anyone who may read the catalog)"
      responses:
        "200":
          description: "Bindings"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Engines]
      operationId: createCatalogBinding
      summary: "Bind a source catalog into a federated engine"
      description: >
        The engine's binder projects the catalog's connection into the engine
        and materializes it (Trino: registry row, then CREATE CATALOG).
        Requires write access to the catalog's connection and to the engine
        (G-admin or owner of the engine's connection). 409 binding_exists
        when the catalog already has a binding on the engine, name_in_use
        when the engine already has a catalog of that name. 422
        binding_unsupported (native catalog, direct engine, or a source kind
        or connector the binder cannot bind), property_not_overridable,
        reserved_name, validation_error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBindingRequest" }
      responses:
        "201":
          description: "Binding created; sync_status says whether the engine applied it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bindings/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [Engines]
      operationId: updateCatalogBinding
      summary: "Rename, reconfigure, enable or disable a managed binding"
      description: >
        A new engine_catalog_name creates the catalog under the new name, then
        drops the old one. Disabling drops it from the engine; enabling
        creates it again. Native and adopted bindings answer 422
        binding_not_managed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBindingRequest" }
      responses:
        "200":
          description: "Binding updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Engines]
      operationId: deleteCatalogBinding
      summary: "Remove a managed binding from its engine"
      description: >
        409 binding_is_primary for the binding a catalog was created with on
        the default Trino engine: delete the catalog instead (until #22).
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bindings/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Engines]
      operationId: syncCatalogBinding
      summary: "Re-apply a managed binding's current projection to its engine"
      responses:
        "200":
          description: "Applied"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "The engine did not apply it; sync_error says why"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}/binding-support:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: getEngineBindingSupport
      summary: "Source kinds this engine can bind, with connectors, protected extra-property keys and reserved names"
      description: >
        Empty for engines without a binder (direct engines). The UI uses it
        instead of duplicating the binder's rules.
      responses:
        "200":
          description: "Support per source kind"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: "#/components/schemas/BindingSupport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Catalog Explorer ──────────────────────────────────────────────

  /connections/{connection_id}/catalogs:
    parameters:
      - name: connection_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: listCatalogs
      summary: "List catalogs registered under a connection"
      responses:
        "200":
          description: "List of catalogs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Catalog]
      operationId: createCatalog
      summary: "Register a catalog under a connection"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogRequest" }
      responses:
        "201":
          description: "Catalog created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "409": { $ref: "#/components/responses/Conflict" }

  /connections/{connection_id}/catalogs/{catalog_id}:
    parameters:
      - name: connection_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: "Catalog details"
      responses:
        "200":
          description: "Catalog"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Catalog]
      operationId: updateCatalog
      summary: "Update a catalog"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogRequest" }
      responses:
        "200":
          description: "Catalog updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Catalog]
      operationId: deleteCatalog
      summary: "Remove a catalog"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /catalogs/{catalog_id}/sync:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: syncCatalog
      summary: "Force re-sync of a catalog against the Trino cluster"
      description: |
        Re-emits the CREATE CATALOG DDL for the catalog, then verifies that
        the baleia-trino-catalog-store plugin persisted the row with
        `updated_by='trino'` and the matching `catalog_version`. Use after
        fixing a `sync_status='error'` row or when the Trino coordinator
        lost this catalog after a crash.
      responses:
        "200":
          description: "Catalog synced"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Sync attempted but the registry diverged"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /catalogs/{catalog_id}/metadata/sync:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: syncCatalogMetadata
      summary: "Refresh the catalog's metadata snapshot now"
      description: >
        Starts one metadata pass of the catalog on the worker: namespaces,
        tables and columns are read from the catalog's own source (its catalog
        manager or database) or, when Baleia cannot read it directly, through
        one of its bindings' engines, and stored once per catalog (#15). The
        pass runs in the background; GET .../metadata/sync-runs shows how it
        ended. The connection's owner and global admins may start it.
      responses:
        "202":
          description: "The pass started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataSyncStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "A pass of this catalog is already running (code sync_in_progress)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /catalogs/{catalog_id}/metadata/sync-runs:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: listCatalogMetadataSyncRuns
      summary: "Latest metadata passes of the catalog, newest first"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: "Passes"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetadataSyncRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trino/reconcile:
    post:
      tags: [Catalog]
      operationId: reconcileTrino
      deprecated: true
      summary: "Deprecated alias of POST /engines/{id}/reconcile for the default Trino engine"
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: "Reconcile report"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Engines]
      operationId: reconcileEngine
      summary: "Repair the engine's managed catalog drift and report the rest — admins"
      description: >
        Checks every managed binding of a federated engine against what the
        engine reports (#37): a managed catalog missing or at an older
        version is applied again, one being deprovisioned is dropped, at
        most BALEIA_RECONCILE_MAX_ACTIONS changes per run (the rest are
        reported). Catalogs the engine has that Baleia does not manage are
        reported as adopted and never dropped or changed. Dry run by
        default: pass dry_run=false to apply.
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: "The run, persisted"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}/reconcile-runs:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: listReconcileRuns
      summary: "Latest reconcile runs of the engine, newest first — admins"
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: "Runs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReconcileRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }


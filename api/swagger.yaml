        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/executions/{execution_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PathId'
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Executions]
      operationId: cancelExecution
      summary: "Cancela uma execução em andamento"
      responses:
        '200':
          description: "Execução cancelada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/executions/{execution_id}/statements:
    parameters:
      - $ref: '#/components/parameters/PathId'
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: listStatements
      summary: "Lista statements individuais de uma execução multi-statement"
      responses:
        '200':
          description: "Statements"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueryStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/executions/{execution_id}/results:
    parameters:
      - $ref: '#/components/parameters/PathId'
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: getResults
      summary: "Resultados da execução como Arrow IPC stream"
      description: |
        Retorna o resultado completo via Arrow IPC.
        Usa o Trino spooling protocol — segmentos são buscados em paralelo do object storage.
      responses:
        '200': { $ref: '#/components/responses/ArrowStream' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Execução ainda não completou"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ws/workspaces/{id}/executions/{execution_id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
      - name: execution_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Executions]
      operationId: streamExecution
      summary: "WebSocket para progresso em tempo real da execução"
      description: |
        Autentica via `?token=<jwt>`.

        ## Eventos server → client

        ```json
        { "type": "running",   "execution_id": "...", "ts": "..." }
        { "type": "progress",  "execution_id": "...", "ts": "...", "rows_so_far": 1000 }
        { "type": "finished",  "execution_id": "...", "ts": "...", "rows_returned": 9843, "duration_ms": 1240 }
        { "type": "failed",    "execution_id": "...", "ts": "...", "message": "..." }
        { "type": "cancelled", "execution_id": "...", "ts": "..." }
        ```

        Após `finished`, buscar `GET .../results` para o Arrow IPC stream.
        Conexão fecha automaticamente após qualquer evento terminal.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '101':
          description: "WebSocket estabelecido"
        '401': { $ref: '#/components/responses/Unauthorized' }


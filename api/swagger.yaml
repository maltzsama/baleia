  /catalog-connections/test:
    post:
      tags: [CatalogConnections]
      operationId: testConnectionDraft
      summary: "Test connection settings before saving them"
      description: >
        Runs the checks on the submitted settings and persists nothing
        (#12): metadata (can Baleia read it), direct_engine (can Baleia run
        SQL on it, through a transient engine) and bind:<engine> (can a
        federated engine reach it, through a short-lived catalog that is
        always dropped). Rate limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestConnectionRequest" }
      responses:
        "200":
          description: "Test result"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCatalogConnectionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429":
          description: "Too many tests"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /catalog-connections/{id}/test:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [CatalogConnections]
      operationId: testCatalogConnection
      summary: "Test catalog connectivity"
      responses:
        "200":
          description: "Test result"
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/TestCatalogConnectionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Engines ───────────────────────────────────────────────────
  /engines:
    get:
      tags: [Engines]
      operationId: listEngines
      summary: "Engines the caller may see: all for an admin; else those on connections they own or hosting a catalog granted to one of their workspaces"
      responses:
        "200":
          description: "Engines, ordered by name"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Engines]
      operationId: createEngine
      summary: "Register a direct engine on a connection (its owner or an admin)"
      description: >
        The connection's provider must have the direct_engine role. Baleia
        checks that it can reach the engine, then creates the engine and one
        native catalog with a native binding per catalog the engine exposes.
        Federated engines are registered by Baleia (the default Trino engine).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEngineRequest" }
      responses:
        "201":
          description: "Engine created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: getEngine
      summary: "Engine details"
      responses:
        "200":
          description: "Engine"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Engines]
      operationId: updateEngine
      summary: "Enable or disable an engine (owner of its connection or an admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEngineRequest" }
      responses:
        "200":
          description: "Engine updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Engines]
      operationId: deleteEngine
      summary: "Remove an engine (owner of its connection or an admin)"
      description: >
        Refused with 409 engine_in_use while the engine has managed bindings or
        running executions. Its native catalogs and bindings are deleted with
        it; the connection stays.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /dialects/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Engines]
      operationId: getDialect
      summary: "A SQL dialect with its keyword and function lists (for the editor)"
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "Dialect"
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dialect" }
        "304":
          description: "Not modified (If-None-Match matched the ETag)"
          headers:
            ETag: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dialects/{name}/split:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Engines]
      operationId: splitStatements
      summary: "Split a script into statements with the dialect's rules"
      description: >
        Used by the editor to run the statement under the cursor, so the client
        and the server split the same way. Unterminated strings, quoted
        identifiers or comments, and MySQL's DELIMITER command, answer 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SplitStatementsRequest" }
      responses:
        "200":
          description: "Statements in order"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatementSpan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /dialects/{name}/explain:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Engines]
      operationId: explainSQL
      summary: "The dialect's EXPLAIN statement for a query"
      description: >
        Returns the statement that explains sql on this dialect, or
        `{supported: false}` for engines without EXPLAIN. The client runs the
        returned SQL; it never prefixes EXPLAIN itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExplainRequest" }
      responses:
        "200":
          description: "Explain statement or unsupported"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplainResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: listEngineBindings
      summary: "Catalogs bound to an engine"
      responses:
        "200":
          description: "Bindings, ordered by engine catalog name"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs:
    get:
      tags: [Catalogs]
      operationId: listAllCatalogs
      summary: "Logical catalogs the caller may view, with their bindings"
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: origin
          in: query
          schema: { type: string }
        - name: engine_id
          in: query
          schema: { type: string, format: uuid }
        - name: connection_id
          in: query
          schema: { type: string, format: uuid }
        - name: provider_kind
          in: query
          schema: { type: string }
        - name: attention
          in: query
          schema: { type: boolean }
        - name: action
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: "Catalogs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /catalogs/{catalog_id}:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalogs]
      operationId: getCatalogDetail
      summary: "One logical catalog with its bindings and counts"
      responses:
        "200":
          description: "Catalog"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Catalogs]
      operationId: updateCatalogDetail
      summary: "Rename or re-describe a catalog (bundles and metrics reference it by name)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCatalogDetailRequest" }
      responses:
        "200":
          description: "Catalog"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Catalogs]
      operationId: deleteCatalogDetail
      summary: "Disable a source catalog and deprovision its managed bindings"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /catalogs/{catalog_id}/impact:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalogs]
      operationId: getCatalogImpact
      summary: "What depends on this catalog before deleting it"
      responses:
        "200":
          description: "Impact"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImpact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog_id}/grants:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalogs]
      operationId: listCatalogGrants
      summary: "Workspace grants of this catalog"
      responses:
        "200":
          description: "Grants"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog-connections/{id}/impact:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [CatalogConnections]
      operationId: getCatalogConnectionImpact
      summary: "What depends on this connection before deleting it"
      responses:
        "200":
          description: "Impact"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogConnectionImpact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: listCatalogBindings
      summary: "Engines a catalog is bound to (anyone who may read the catalog)"
      responses:
        "200":
          description: "Bindings"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Engines]
      operationId: createCatalogBinding
      summary: "Bind a source catalog into a federated engine"
      description: >
        The engine's binder projects the catalog's connection into the engine
        and materializes it (Trino: registry row, then CREATE CATALOG).
        Requires write access to the catalog's connection and to the engine
        (G-admin or owner of the engine's connection). 409 binding_exists
        when the catalog already has a binding on the engine, name_in_use
        when the engine already has a catalog of that name. 422
        binding_unsupported (native catalog, direct engine, or a source kind
        or connector the binder cannot bind), property_not_overridable,
        reserved_name, validation_error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBindingRequest" }
      responses:
        "201":
          description: "Binding created; sync_status says whether the engine applied it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bindings/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: getCatalogBinding
      summary: "One binding with its lifecycle state, error and allowed actions"
      responses:
        "200":
          description: "Binding"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Engines]
      operationId: updateCatalogBinding
      summary: "Rename, reconfigure, enable or disable a managed binding"
      description: >
        A new engine_catalog_name creates the catalog under the new name, then
        drops the old one. Disabling drops it from the engine; enabling
        creates it again. Native and adopted bindings answer 422
        binding_not_managed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBindingRequest" }
      responses:
        "200":
          description: "Binding updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Engines]
      operationId: deleteCatalogBinding
      summary: "Remove a managed binding from its engine"
      description: >
        409 binding_is_primary for the binding a catalog was created with on
        the default Trino engine: delete the catalog instead (until #22).
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bindings/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Engines]
      operationId: syncCatalogBinding
      summary: "Re-apply a managed binding's current projection to its engine"
      responses:
        "200":
          description: "Applied"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "The engine did not apply it; sync_error says why"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBinding" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bindings/{id}/projection:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: getCatalogBindingProjection
      summary: "Engine-side properties of a binding, secret values masked"
      responses:
        "200":
          description: "Projection"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BindingProjection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /engines/{id}/binding-support:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Engines]
      operationId: getEngineBindingSupport
      summary: "Source kinds this engine can bind, with connectors, protected extra-property keys and reserved names"
      description: >
        Empty for engines without a binder (direct engines). The UI uses it
        instead of duplicating the binder's rules.
      responses:
        "200":
          description: "Support per source kind"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: "#/components/schemas/BindingSupport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Catalog Explorer ──────────────────────────────────────────────

  /connections/{connection_id}/catalogs:
    parameters:
      - name: connection_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: listCatalogs
      summary: "List catalogs registered under a connection"
      responses:
        "200":
          description: "List of catalogs"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Catalog]
      operationId: createCatalog
      summary: "Register a catalog under a connection"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogRequest" }
      responses:
        "201":
          description: "Catalog created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "409": { $ref: "#/components/responses/Conflict" }

  /connections/{connection_id}/catalogs/{catalog_id}:
    parameters:
      - name: connection_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: "Catalog details"
      responses:
        "200":
          description: "Catalog"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Catalog]
      operationId: updateCatalog
      summary: "Update a catalog"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogRequest" }
      responses:
        "200":
          description: "Catalog updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Catalog]
      operationId: deleteCatalog
      summary: "Remove a catalog"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /catalogs/{catalog_id}/sync:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: syncCatalog
      summary: "Force re-sync of a catalog against the Trino cluster"
      description: |
        Re-emits the CREATE CATALOG DDL for the catalog, then verifies that
        the baleia-trino-catalog-store plugin persisted the row with
        `updated_by='trino'` and the matching `catalog_version`. Use after
        fixing a `sync_status='error'` row or when the Trino coordinator
        lost this catalog after a crash.
      responses:
        "200":
          description: "Catalog synced"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Sync attempted but the registry diverged"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /catalogs/{catalog_id}/metadata/sync:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: syncCatalogMetadata
      summary: "Refresh the catalog's metadata snapshot now"
      description: >
        Starts one metadata pass of the catalog on the worker: namespaces,
        tables and columns are read from the catalog's own source (its catalog
        manager or database) or, when Baleia cannot read it directly, through
        one of its bindings' engines, and stored once per catalog (#15). The
        pass runs in the background; GET .../metadata/sync-runs shows how it
        ended. The connection's owner and global admins may start it.
      responses:
        "202":
          description: "The pass started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataSyncStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "A pass of this catalog is already running (code sync_in_progress)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /catalogs/{catalog_id}/metadata/sync-runs:
    parameters:
      - name: catalog_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: listCatalogMetadataSyncRuns
      summary: "Latest metadata passes of the catalog, newest first"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":

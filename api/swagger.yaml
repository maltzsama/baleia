          description: "Refresh started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrieverRefreshHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{id}/retrievers/{retriever_id}/history:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: retriever_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Retrievers]
      operationId: getRetrieverHistory
      summary: "Retriever refresh history"
      parameters:
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPerPage"
      responses:
        "200":
          description: "History"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      { $ref: "#/components/schemas/RetrieverRefreshHistory" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Migrant ───────────────────────────────────────────────────
  /migrations:
    get:
      tags: [Migrant]
      operationId: listMigrations
      summary: "List migrations — admin only"
      responses:
        "200":
          description: "Migrations"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Migrant]
      operationId: createMigration
      summary: "Create a zero-copy migration — admin only"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMigrationRequest" }
      responses:
        "201":
          description: "Migration created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /migrations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Migrant]
      operationId: getMigration
      summary: "Migration status"
      responses:
        "200":
          description: "Migration"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /migrations/{id}/start:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Migrant]
      operationId: startMigration
      summary: "Start migration execution — admin only"
      responses:
        "202":
          description: "Migration started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /migrations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Migrant]
      operationId: cancelMigration
      summary: "Cancel an ongoing migration — admin only"
      responses:
        "200":
          description: "Migration cancelled"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Migration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /migrations/{id}/items:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Migrant]
      operationId: listMigrationItems
      summary: "List individual tables in a migration"
      parameters:
        - name: status
          in: query
          schema:
            {
              type: string,
              enum: [pending, running, finished, failed, skipped],
            }
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPerPage"
      responses:
        "200":
          description: "Items"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MigrationItem" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

version: "2"

# Existing findings are a baseline: `make lint` and CI report only issues new
# since the merge base with origin/main (#369). `make lint-all` shows all.

run:
  timeout: 10m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - forcetypeassert
    - gosec
    - noctx
    - revive
    - thelper
  settings:
    staticcheck:
      checks:
        - all
        # De Morgan rewrites rarely read better (character-class tests).
        - -QF1001
        # Off by default upstream: package comments, dot imports, naming.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      # revive's defaults without exported, package-comments and
      # unused-parameter: internal packages and interface implementations
      # make those mostly noise.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      # A failed assertion or an unchecked request in a test fails the test.
      - path: _test\.go
        linters:
          - forcetypeassert
          - gosec
          - noctx

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default

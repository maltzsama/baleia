version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
  # The assistant owns its own sqlc package (#62): its import boundary forbids
  # the main db package, so assistant_* tables (and the assistant agent rows it
  # provisions) generate here.
  - engine: "postgresql"
    queries: "db/assistant_queries"
    schema: "db/migrations"
    gen:
      go:
        package: "assistant"
        out: "internal/db/assistant"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true

# Dev-only: the password is injected via the BALEIA_TRINO_DB_PASSWORD env
# variable (set by docker-compose.yml from .env). Airlift's secrets resolver
# reads ${ENV:NAME} at boot so the password never touches a committed file.
baleia.jdbc-url=jdbc:postgresql://postgres:5432/baleia
baleia.username=baleia_trino
baleia.password=${ENV:BALEIA_TRINO_DB_PASSWORD}
baleia.cluster-name=default
baleia.connect-timeout=10s
baleia.socket-timeout=30s
baleia.secret-file-base-dir=/etc/trino/secrets

# Phase B (#200): when BALEIA_REGISTRY_KEY is set on Baleia and the plugin
# release supports sealed values, uncomment the line below so the plugin can
# decrypt @baleia-enc[v1:<key-id>:<b64>] registry properties at boot.
# baleia.registry-key=${ENV:BALEIA_REGISTRY_KEY}

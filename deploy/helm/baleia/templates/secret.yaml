{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baleia.fullname" . }}-secret
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.values.JWT_SECRET is required" .Values.secrets.values.JWT_SECRET | quote }}
  BALEIA_ENCRYPTION_KEY: {{ required "secrets.values.BALEIA_ENCRYPTION_KEY is required" .Values.secrets.values.BALEIA_ENCRYPTION_KEY | quote }}
  BALEIA_ENCRYPTION_KEY_PREVIOUS: {{ .Values.secrets.values.BALEIA_ENCRYPTION_KEY_PREVIOUS | default "" | quote }}
  DATABASE_URL: {{ required "secrets.values.DATABASE_URL is required" .Values.secrets.values.DATABASE_URL | quote }}
  BALEIA_TRINO_DB_PASSWORD: {{ .Values.secrets.values.BALEIA_TRINO_DB_PASSWORD | default "" | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.values.S3_ACCESS_KEY | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.values.S3_SECRET_KEY | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.values.SMTP_PASSWORD | default "" | quote }}
{{- end }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baleia.fullname" . }}-secret
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.values.JWT_SECRET is required" .Values.secrets.values.JWT_SECRET | quote }}
  BALEIA_ENCRYPTION_KEY: {{ required "secrets.values.BALEIA_ENCRYPTION_KEY is required" .Values.secrets.values.BALEIA_ENCRYPTION_KEY | quote }}
  BALEIA_ENCRYPTION_KEY_PREVIOUS: {{ .Values.secrets.values.BALEIA_ENCRYPTION_KEY_PREVIOUS | default "" | quote }}
  {{- with .Values.secrets.values.BALEIA_REGISTRY_KEY }}
  BALEIA_REGISTRY_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.BALEIA_REGISTRY_KEY_PREVIOUS }}
  BALEIA_REGISTRY_KEY_PREVIOUS: {{ . | quote }}
  {{- end }}
  DATABASE_URL: {{ required "secrets.values.DATABASE_URL is required" .Values.secrets.values.DATABASE_URL | quote }}
  BALEIA_TRINO_DB_PASSWORD: {{ .Values.secrets.values.BALEIA_TRINO_DB_PASSWORD | default "" | quote }}
  {{- if include "baleia.trinoAuth" . }}
  BALEIA_TRINO_PASSWORD: {{ required "secrets.values.BALEIA_TRINO_PASSWORD is required while trino.auth.enabled" .Values.secrets.values.BALEIA_TRINO_PASSWORD | quote }}
  {{- else if .Values.secrets.values.BALEIA_TRINO_PASSWORD }}
  BALEIA_TRINO_PASSWORD: {{ .Values.secrets.values.BALEIA_TRINO_PASSWORD | quote }}
  {{- end }}
  S3_ACCESS_KEY: {{ .Values.secrets.values.S3_ACCESS_KEY | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.values.S3_SECRET_KEY | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.values.SMTP_PASSWORD | default "" | quote }}
  {{- /* Generated once: reuse the key of the existing Secret so every upgrade (and every replica) signs with the same one, even across a disable and re-enable of the gateway. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "baleia.fullname" .)) }}
  {{- $kept := "" }}
  {{- if $existing }}{{ $kept = (index $existing.data "BALEIA_BI_GATEWAY_SECRET" | default "" | b64dec) }}{{ end }}
  {{- if .Values.biGateway.enabled }}
  BALEIA_BI_GATEWAY_SECRET: {{ .Values.secrets.values.BALEIA_BI_GATEWAY_SECRET | default $kept | default (randAlphaNum 48) | quote }}
  {{- else }}
  BALEIA_BI_GATEWAY_SECRET: {{ .Values.secrets.values.BALEIA_BI_GATEWAY_SECRET | default $kept | quote }}
  {{- end }}
  {{- with .Values.secrets.values.BALEIA_METRICS_TOKEN }}
  BALEIA_METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- if .Values.trino.queryEvents.enabled }}
  BALEIA_TRINO_EVENTS_TOKEN: {{ required "secrets.values.BALEIA_TRINO_EVENTS_TOKEN is required when trino.queryEvents.enabled" .Values.secrets.values.BALEIA_TRINO_EVENTS_TOKEN | quote }}
  {{- end }}
  {{- /* Data policies (ADR 0028). The OPA token is generated once and kept, like
  the gateway key. */}}
  {{- if include "baleia.dataPolicies" . }}
  BALEIA_DATA_POLICY_SIGNING_KEY: {{ required "secrets.values.BALEIA_DATA_POLICY_SIGNING_KEY is required while trino.dataPolicies.enabled" .Values.secrets.values.BALEIA_DATA_POLICY_SIGNING_KEY | quote }}
  {{- $keptToken := "" }}
  {{- if $existing }}{{ $keptToken = (index $existing.data "BALEIA_OPA_TOKEN" | default "" | b64dec) }}{{ end }}
  BALEIA_OPA_TOKEN: {{ .Values.secrets.values.BALEIA_OPA_TOKEN | default $keptToken | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- /* The id the default Trino engine's OPA reports its status under. Baleia
  records those reports on the default engine, whatever the engine's own id,
  so it is generated once, on a new install as on an existing release, and kept
  across upgrades. */}}
  {{- if include "baleia.dataPolicies" . }}
  {{- $keptID := "" }}
  {{- if $existing }}{{ $keptID = (index $existing.data "BALEIA_DEFAULT_ENGINE_ID" | default "" | b64dec) }}{{ end }}
  BALEIA_DEFAULT_ENGINE_ID: {{ .Values.secrets.values.BALEIA_DEFAULT_ENGINE_ID | default $keptID | default uuidv4 | quote }}
  {{- end }}
{{- end }}
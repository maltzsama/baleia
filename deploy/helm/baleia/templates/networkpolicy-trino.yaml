{{- if and .Values.trino.enabled .Values.trino.networkPolicy.enabled }}
# Only the Baleia API and worker may reach the in-chart coordinator (#645),
# defense in depth on top of its authentication (#647). A NetworkPolicy only takes
# effect when the cluster's CNI enforces it (Calico, Cilium, …).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "baleia.fullname" . }}-trino
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: trino
spec:
  podSelector:
    matchLabels:
      {{- include "baleia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: trino
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "baleia.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              {{- include "baleia.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
        {{- with .Values.trino.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ if include "baleia.trinoAuth" . }}https{{ else }}http{{ end }}
          protocol: TCP
{{- end }}

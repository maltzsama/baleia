{{- if .Values.trino.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "baleia.fullname" . }}-trino-config
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
data:
  config.properties: |
{{ .Files.Get "files/trino/config.properties" | indent 4 }}{{ if .Values.trino.queryEvents.enabled }}
    event-listener.config-files=/etc/trino/event-listener.properties{{ end }}
  catalog-store.properties: |
{{ .Files.Get "files/trino/catalog-store.properties" | indent 4 }}{{ if .Values.trino.registryEncryption }}
    baleia.registry-key=${ENV:BALEIA_REGISTRY_KEY}{{ if .Values.secrets.values.BALEIA_REGISTRY_KEY_PREVIOUS }}
    baleia.registry-key-previous=${ENV:BALEIA_REGISTRY_KEY_PREVIOUS}{{ end }}{{ end }}
  {{- if .Values.trino.queryEvents.enabled }}
  # Completed queries are pushed to the API as they end (#406); the token is
  # read from the environment, never written in this ConfigMap.
  event-listener.properties: |
    event-listener.name=http
    http-event-listener.log-created=false
    http-event-listener.log-completed=true
    http-event-listener.connect-ingest-uri=http://{{ include "baleia.fullname" . }}-api:{{ .Values.api.port }}/internal/trino/query-events
    http-event-listener.connect-http-headers=Authorization:Bearer ${ENV:BALEIA_TRINO_EVENTS_TOKEN}
    # A server error is retried (the default is not to); an event that still
    # fails is left to the poller.
    http-event-listener.connect-retry-count=3
    http-event-listener.connect-retry-delay=1s
    http-event-listener.connect-backoff-base=2
    http-event-listener.connect-max-delay=10s
  {{- end }}
  baleia-base-access-control.properties: |
{{ .Files.Get "files/trino/baleia-base-access-control.properties" | indent 4 }}
  baleia-catalog-guard.properties: |
{{ .Files.Get "files/trino/baleia-catalog-guard.properties" | replace "baleia.admin-users=baleia_admin" (printf "baleia.admin-users=%s" .Values.config.BALEIA_TRINO_ADMIN_USER) | replace "baleia.allow-unauthenticated-admin=true" (printf "baleia.allow-unauthenticated-admin=%t" .Values.trino.catalogGuard.allowUnauthenticatedAdmin) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "baleia.fullname" . }}-trino
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "baleia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: trino
  template:
    metadata:
      labels:
        {{- include "baleia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: trino
    spec:
      initContainers:
        # The plugin is either bundled (trino.plugin.image: a small image with
        # /baleia-catalog-store, for air-gapped/restricted networks) or
        # downloaded from the release tarball (default), verified by sha256 and
        # unpacked into the shared emptyDir. Official Trino image, never a custom
        # one.
        {{- if .Values.trino.plugin.image }}
        - name: install-plugin
          image: {{ .Values.trino.plugin.image }}
          imagePullPolicy: {{ .Values.trino.plugin.imagePullPolicy | default .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args: ["cp -a /baleia-catalog-store/. /plugin/"]
          volumeMounts:
            - { name: plugin, mountPath: /plugin }
        {{- else }}
        - name: install-plugin
          image: alpine:3.20
          command: ["/bin/sh", "-ec"]
          args:
            - |
              PLUGIN_URL="{{ include "baleia.pluginURL" . }}"
              wget -qO /tmp/p.tgz "$PLUGIN_URL"
              wget -qO /tmp/p.sha256 "$PLUGIN_URL.sha256"
              echo "$(cat /tmp/p.sha256)  /tmp/p.tgz" | sha256sum -c -
              tar -xzf /tmp/p.tgz -C /tmp
              cp -a /tmp/baleia-catalog-store/. /plugin/
          env:
            - name: PLUGIN_URL
              value: {{ include "baleia.pluginURL" . | quote }}
          volumeMounts:
            - { name: plugin, mountPath: /plugin }
        {{- end }}
        # Trino cannot authenticate to the registry until the API has set the
        # baleia_trino role password (bootstrap). Wait for the registry table.
        - name: wait-for-registry
          image: postgres:18
          command: ["/bin/sh", "-ec"]
          args:
            - |
              REGISTRY_URL="postgresql://baleia_trino:${BALEIA_TRINO_DB_PASSWORD}@postgres.baleia-dev.svc:5432/baleia?sslmode=disable"
              until psql "$REGISTRY_URL" -tAc 'SELECT 1 FROM trino_catalog_registry LIMIT 1' >/dev/null 2>&1; do echo waiting for registry; sleep 3; done
          env:
            - name: BALEIA_TRINO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_TRINO_DB_PASSWORD
      containers:
        - name: trino
          image: {{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}
          env:
            - name: BALEIA_TRINO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_TRINO_DB_PASSWORD
            # Phase B (#200): the plugin decrypts @baleia-enc[...] values with
            # this key. Optional so Phase A deployments keep booting; enable the
            # matching property in catalog-store.properties when set.
            - name: BALEIA_REGISTRY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_REGISTRY_KEY
                  optional: true
            - name: BALEIA_REGISTRY_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_REGISTRY_KEY_PREVIOUS
                  optional: true
            {{- if .Values.trino.queryEvents.enabled }}
            - name: BALEIA_TRINO_EVENTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_TRINO_EVENTS_TOKEN
            {{- end }}
            - name: JAVA_OPTS
              value: "-Xmx{{ .Values.trino.jvmHeap }}"
            # Trino's S3 filesystem auto-detects the region through the EC2
            # instance metadata endpoint when none is set, which hangs
            # CREATE CATALOG on clusters where that address is unreachable.
            - name: AWS_REGION
              value: {{ .Values.trino.awsRegion | quote }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /v1/info, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- if .Values.trino.resources }}
          resources:
            {{- toYaml .Values.trino.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin
              mountPath: /usr/lib/trino/plugin/baleia-catalog-store
              readOnly: true
            - name: trino-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: trino-config
              mountPath: /etc/trino/catalog-store.properties
              subPath: catalog-store.properties
            - name: trino-config
              mountPath: /etc/trino/baleia-base-access-control.properties
              subPath: baleia-base-access-control.properties
            - name: trino-config
              mountPath: /etc/trino/baleia-catalog-guard.properties
              subPath: baleia-catalog-guard.properties
            {{- if .Values.trino.queryEvents.enabled }}
            - name: trino-config
              mountPath: /etc/trino/event-listener.properties
              subPath: event-listener.properties
            {{- end }}
      volumes:
        - name: plugin
          emptyDir: {}
        - name: trino-config
          configMap:
            name: {{ include "baleia.fullname" . }}-trino-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "baleia.fullname" . }}-trino
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: trino
spec:
  selector:
    {{- include "baleia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: trino
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
{{- /* Everything that makes the bundled Trino safe (#992) lives in one
immutable ConfigMap whose name carries a hash of its content, so editing it in
place is impossible: a change in values renders a new ConfigMap and rolls the
coordinator instead. */}}
{{- /* OPA's configuration (ADR 0028). The data bundle comes from the API,
signed with the deployment's key and kept on disk; the Rego is the policy
bundle install-plugin copied out of the verified plugin release. OPA reports
its status under the default engine's id, read from the environment. */}}
{{- define "baleia.opaConfig" -}}
services:
  baleia:
    url: http://{{ include "baleia.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }}/opa/
    credentials:
      bearer:
        token_path: /var/run/baleia-opa/token
labels:
  baleia_engine_id: ${BALEIA_DEFAULT_ENGINE_ID}
bundles:
  baleia:
    service: baleia
    resource: bundles/baleia.tar.gz
    persist: true
    polling:
      min_delay_seconds: {{ .Values.trino.dataPolicies.opa.polling.minDelaySeconds | int }}
      max_delay_seconds: {{ .Values.trino.dataPolicies.opa.polling.maxDelaySeconds | int }}
    signing:
      keyid: baleia
  policy:
    resource: file:///policy/policy.tar.gz
keys:
  baleia:
    algorithm: RS256
    key: |
{{ .Values.trino.dataPolicies.publicKey | trim | indent 6 }}
persistence_directory: /var/opa
status:
  service: baleia
{{- end }}

{{- /* Shell lines of install-plugin that copy the release's opa/ (from $SRC)
into the policy volume. A release without it (before 0.11.0) stops the pod:
Trino must never start without the OPA properties it was configured with. */}}
{{- define "baleia.installPolicy" -}}
for f in baleia-opa-policy.tar.gz opa-access-control.properties; do
  test -s "$SRC/$f" || { echo "install-plugin: the plugin release has no opa/$f; data policies need plugin 0.11.0 or later" >&2; exit 1; }
done
cp "$SRC/baleia-opa-policy.tar.gz" /policy/policy.tar.gz
cp "$SRC/opa-access-control.properties" /policy/opa-access-control.properties
{{- end }}

{{- define "baleia.trinoConfigData" }}
  config.properties: |
{{- $config := .Files.Get "files/trino/config.properties" }}
{{- if not (include "baleia.trinoAuth" .) }}
{{- $config = regexReplaceAll `(?s)# --- authentication \(#647\).*# --- end authentication\n` $config "" }}
{{- end }}
{{- if include "baleia.dataPolicies" . }}
{{- /* OPA is the third access control, after the base rules and the guard. */}}
{{- $config = regexReplaceAll `(?m)^(access-control\.config-files=.*)$` $config "${1},/etc/trino/opa/opa-access-control.properties" }}
{{- end }}
{{ $config | indent 4 }}{{ if .Values.trino.queryEvents.enabled }}
    event-listener.config-files=/etc/trino/event-listener.properties{{ end }}
  catalog-store.properties: |
{{ .Files.Get "files/trino/catalog-store.properties" | indent 4 }}{{ if .Values.trino.registryEncryption }}
    baleia.registry-key=${ENV:BALEIA_REGISTRY_KEY}{{ if .Values.secrets.values.BALEIA_REGISTRY_KEY_PREVIOUS }}
    baleia.registry-key-previous=${ENV:BALEIA_REGISTRY_KEY_PREVIOUS}{{ end }}{{ end }}
  {{- if .Values.trino.queryEvents.enabled }}
  # Completed queries are pushed to the API as they end (#406); the token is
  # read from the environment, never written in this ConfigMap.
  event-listener.properties: |
    event-listener.name=http
    http-event-listener.log-created=false
    http-event-listener.log-completed=true
    http-event-listener.connect-ingest-uri=http://{{ include "baleia.fullname" . }}-api:{{ .Values.api.port }}/internal/trino/query-events
    http-event-listener.connect-http-headers=Authorization:Bearer ${ENV:BALEIA_TRINO_EVENTS_TOKEN}
    # A server error is retried (the default is not to); an event that still
    # fails is left to the poller.
    http-event-listener.connect-retry-count=3
    http-event-listener.connect-retry-delay=1s
    http-event-listener.connect-backoff-base=2
    http-event-listener.connect-max-delay=10s
  {{- end }}
  baleia-base-access-control.properties: |
{{ .Files.Get "files/trino/baleia-base-access-control.properties" | indent 4 }}
  # File-based base rules (#647): only Baleia's login may impersonate other
  # identities, and catalogs stay fully open (owner, which CREATE/DROP CATALOG
  # needs); the catalog guard stacked after them keeps catalog management to
  # the admin and enforces read-only sessions.
  baleia-rules.json: |
    {
      "catalogs": [{"allow": "owner"}],
      "impersonation": [
        {"original_user": {{ printf "^%s$" (regexQuoteMeta .Values.config.BALEIA_TRINO_ADMIN_USER) | toJson }}, "new_user": ".*", "allow": true}
      ]
    }
  {{- if include "baleia.trinoAuth" . }}
  password-authenticator.properties: |
    password-authenticator.name=file
    file.password-file=/etc/trino/auth/password.db
  {{- end }}
  baleia-catalog-guard.properties: |
{{ .Files.Get "files/trino/baleia-catalog-guard.properties" | replace "baleia.admin-users=baleia_admin" (printf "baleia.admin-users=%s" .Values.config.BALEIA_TRINO_ADMIN_USER) | replace "baleia.allow-unauthenticated-admin=false" (printf "baleia.allow-unauthenticated-admin=%t" (and (not (include "baleia.trinoAuth" .)) .Values.trino.catalogGuard.allowUnauthenticatedAdmin)) | indent 4 }}
  {{- if include "baleia.dataPolicies" . }}
  opa-config.yaml: |
{{ include "baleia.opaConfig" . | indent 4 }}
  # The identities OPA never filters or masks: the guard's admin and service
  # users. Deployment configuration, never part of the data bundle.
  trusted.json: |
    {{ dict "baleia_deployment" (dict "trusted_identities" (list .Values.config.BALEIA_TRINO_ADMIN_USER (.Values.config.BALEIA_TRINO_SERVICE_USER | default "baleia"))) | toJson }}
  {{- end }}
{{- end }}
{{- if .Values.trino.enabled }}
{{- $trinoConfigHash := include "baleia.trinoConfigData" . | sha256sum | trunc 10 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "baleia.fullname" . }}-trino-config-{{ $trinoConfigHash }}
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
immutable: true
data:{{ include "baleia.trinoConfigData" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "baleia.fullname" . }}-trino
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: trino
spec:
  replicas: 1
  {{- if and (include "baleia.dataPolicies" .) .Values.trino.dataPolicies.persistence.enabled }}
  # OPA's bundle volume is ReadWriteOnce: the old pod releases it first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "baleia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: trino
  template:
    metadata:
      labels:
        {{- include "baleia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: trino
      annotations:
        # The security ConfigMap's content hash (#992): a value that changes it
        # renders a new ConfigMap and rolls the coordinator with it.
        checksum/trino-config: {{ $trinoConfigHash }}
        {{- if and (include "baleia.trinoAuth" .) .Values.secrets.create }}
        # The password file is written at start: a new password restarts
        # Trino. With existingSecret, restart it yourself (docs/operations.md).
        checksum/trino-password: {{ .Values.secrets.values.BALEIA_TRINO_PASSWORD | default "" | sha256sum }}
        {{- end }}
    spec:
      {{- if include "baleia.dataPolicies" . }}
      # Trino's and OPA's user, so OPA can write its bundle volume.
      securityContext:
        fsGroup: 1000
      {{- end }}
      initContainers:
        # The plugin is either bundled (trino.plugin.image: a small image with
        # /baleia-catalog-store, for air-gapped/restricted networks) or
        # downloaded from the release tarball (default), verified by sha256 and
        # unpacked into the shared emptyDir. Official Trino image, never a custom
        # one. With data policies on, the same release's opa/ (the Rego bundle
        # and Trino's OPA properties, ADR 0028) goes into the policy volume,
        # which Trino and OPA mount read-only.
        {{- if .Values.trino.plugin.image }}
        - name: install-plugin
          image: {{ .Values.trino.plugin.image }}
          imagePullPolicy: {{ .Values.trino.plugin.imagePullPolicy | default .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp -a /baleia-catalog-store/. /plugin/
              {{- if include "baleia.dataPolicies" . }}
              SRC=/opa
              {{- include "baleia.installPolicy" . | nindent 14 }}
              {{- end }}
          volumeMounts:
            - { name: plugin, mountPath: /plugin }
            {{- if include "baleia.dataPolicies" . }}
            - { name: policy, mountPath: /policy }
            {{- end }}
        {{- else }}
        - name: install-plugin
          image: docker.io/library/alpine:3.20
          command: ["/bin/sh", "-ec"]
          args:
            - |
              PLUGIN_URL="{{ include "baleia.pluginURL" . }}"
              wget -qO /tmp/p.tgz "$PLUGIN_URL"
              wget -qO /tmp/p.sha256 "$PLUGIN_URL.sha256"
              echo "$(cat /tmp/p.sha256)  /tmp/p.tgz" | sha256sum -c -
              tar -xzf /tmp/p.tgz -C /tmp
              cp -a /tmp/baleia-catalog-store/. /plugin/
              {{- if include "baleia.dataPolicies" . }}
              SRC=/tmp/opa
              {{- include "baleia.installPolicy" . | nindent 14 }}
              {{- end }}
          env:
            - name: PLUGIN_URL
              value: {{ include "baleia.pluginURL" . | quote }}
          volumeMounts:
            - { name: plugin, mountPath: /plugin }
            {{- if include "baleia.dataPolicies" . }}
            - { name: policy, mountPath: /policy }
            {{- end }}
        {{- end }}
        {{- if include "baleia.trinoAuth" . }}
        # The password file (bcrypt, from BALEIA_TRINO_PASSWORD) and the PEM
        # keystore (certificate + key) Trino reads, built at start so neither
        # the password nor the key is written into a ConfigMap.
        - name: trino-auth
          image: {{ .Values.trino.auth.image | default "docker.io/library/httpd:2.4-alpine" }}
          # Trino's user, so the files stay private to it (umask 077).
          securityContext: { runAsUser: 1000, runAsGroup: 1000 }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              entry="$(htpasswd -bnBC 10 "$BALEIA_TRINO_ADMIN_USER" "$BALEIA_TRINO_PASSWORD")"
              printf '%s\n' "$entry" | head -n 1 > /auth/password.db
              test -s /auth/password.db
              cat /tls/tls.crt /tls/tls.key > /auth/keystore.pem
          env:
            - name: BALEIA_TRINO_ADMIN_USER
              value: {{ .Values.config.BALEIA_TRINO_ADMIN_USER | quote }}
            - name: BALEIA_TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_TRINO_PASSWORD
          volumeMounts:
            - { name: trino-auth, mountPath: /auth }
            - { name: trino-tls, mountPath: /tls, readOnly: true }
        {{- end }}
        # Trino cannot authenticate to the registry until the API has set the
        # baleia_trino role password (bootstrap). Wait for the registry table.
        - name: wait-for-registry
          image: {{ .Values.trino.waitImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              REGISTRY_URL="postgresql://baleia_trino:${BALEIA_TRINO_DB_PASSWORD}@postgres.baleia-dev.svc:5432/baleia?sslmode=disable"
              until psql "$REGISTRY_URL" -tAc 'SELECT 1 FROM trino_catalog_registry LIMIT 1' >/dev/null 2>&1; do echo waiting for registry; sleep 3; done
          env:
            - name: BALEIA_TRINO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_TRINO_DB_PASSWORD
      containers:
        - name: trino
          image: {{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}
          env:
            - name: BALEIA_TRINO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_TRINO_DB_PASSWORD
            # Phase B (#200): the plugin decrypts @baleia-enc[...] values with
            # this key. Optional so Phase A deployments keep booting; enable the
            # matching property in catalog-store.properties when set.
            - name: BALEIA_REGISTRY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_REGISTRY_KEY
                  optional: true
            - name: BALEIA_REGISTRY_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_REGISTRY_KEY_PREVIOUS
                  optional: true
            {{- if .Values.trino.queryEvents.enabled }}
            - name: BALEIA_TRINO_EVENTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_TRINO_EVENTS_TOKEN
            {{- end }}
            {{- if include "baleia.trinoAuth" . }}
            - name: TRINO_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.fullname" . }}-trino-internal
                  key: shared-secret
            {{- end }}
            {{- with .Values.trino.jvmHeap }}
            # The image's launcher builds the JVM command line from etc/jvm.config
            # and ignores JAVA_OPTS (#669); the JVM itself reads this variable, and
            # an explicit -Xmx wins over the image's -XX:MaxRAMPercentage=80.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx{{ . }}"
            {{- end }}
            # Trino's S3 filesystem auto-detects the region through the EC2
            # instance metadata endpoint when none is set, which hangs
            # CREATE CATALOG on clusters where that address is unreachable.
            - name: AWS_REGION
              value: {{ .Values.trino.awsRegion | quote }}
          ports:
            - { name: http, containerPort: 8080 }
            {{- if include "baleia.trinoAuth" . }}
            - { name: https, containerPort: 8443 }
            {{- end }}
          # /v1/info answers 200 while Trino is still starting, so an httpGet
          # on it marks the pod Ready before it accepts queries (#672). The
          # image's health-check script succeeds only once "starting" is false.
          readinessProbe:
            exec:
              command: ["/usr/lib/trino/bin/health-check"]
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- if .Values.trino.resources }}
          resources:
            {{- toYaml .Values.trino.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin
              mountPath: /usr/lib/trino/plugin/baleia-catalog-store
              readOnly: true
            - name: trino-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: trino-config
              mountPath: /etc/trino/catalog-store.properties
              subPath: catalog-store.properties
            - name: trino-config
              mountPath: /etc/trino/baleia-base-access-control.properties
              subPath: baleia-base-access-control.properties
            - name: trino-config
              mountPath: /etc/trino/baleia-catalog-guard.properties
              subPath: baleia-catalog-guard.properties
            - name: trino-config
              mountPath: /etc/trino/baleia-rules.json
              subPath: baleia-rules.json
            {{- if include "baleia.trinoAuth" . }}
            - name: trino-config
              mountPath: /etc/trino/password-authenticator.properties
              subPath: password-authenticator.properties
            - name: trino-auth
              mountPath: /etc/trino/auth
              readOnly: true
            {{- end }}
            {{- if .Values.trino.queryEvents.enabled }}
            - name: trino-config
              mountPath: /etc/trino/event-listener.properties
              subPath: event-listener.properties
            {{- end }}
            {{- if include "baleia.dataPolicies" . }}
            # opa-access-control.properties of the plugin release.
            - name: policy
              mountPath: /etc/trino/opa
              readOnly: true
            {{- end }}
        {{- if include "baleia.dataPolicies" . }}
        # OPA (ADR 0028): its decision API listens on localhost only, so nothing
        # outside the pod can query it or change its policy; the diagnostic
        # port serves /health and /metrics. The pod is ready only once OPA has
        # activated both bundles, so the Service never routes a query to a
        # coordinator without its policies.
        - name: opa
          image: {{ .Values.trino.dataPolicies.opa.image }}
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - --diagnostic-addr=0.0.0.0:{{ .Values.trino.dataPolicies.opa.diagnosticPort | int }}
            - --config-file=/etc/opa/config.yaml
            - /etc/opa/trusted.json
          env:
            # OPA's labels name the engine its status reports are about.
            - name: BALEIA_DEFAULT_ENGINE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "baleia.secretName" . }}
                  key: BALEIA_DEFAULT_ENGINE_ID
          ports:
            - { name: opa-diag, containerPort: {{ .Values.trino.dataPolicies.opa.diagnosticPort | int }} }
          readinessProbe:
            httpGet: { path: "/health?bundles=true", port: opa-diag }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: opa-diag }
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.trino.dataPolicies.opa.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: trino-config
              mountPath: /etc/opa/config.yaml
              subPath: opa-config.yaml
            - name: trino-config
              mountPath: /etc/opa/trusted.json
              subPath: trusted.json
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: opa-token
              mountPath: /var/run/baleia-opa
              readOnly: true
            - name: opa-bundles
              mountPath: /var/opa
        {{- end }}
      volumes:
        - name: plugin
          emptyDir: {}
        {{- if include "baleia.dataPolicies" . }}
        - name: policy
          emptyDir: {}
        - name: opa-token
          secret:
            secretName: {{ include "baleia.secretName" . }}
            items: [{ key: BALEIA_OPA_TOKEN, path: token }]
        - name: opa-bundles
          {{- if .Values.trino.dataPolicies.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "baleia.fullname" . }}-trino-opa
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: trino-config
          configMap:
            name: {{ include "baleia.fullname" . }}-trino-config-{{ $trinoConfigHash }}
        {{- if include "baleia.trinoAuth" . }}
        - name: trino-auth
          emptyDir: { medium: Memory }
        - name: trino-tls
          secret:
            secretName: {{ include "baleia.trinoTLSSecret" . }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "baleia.fullname" . }}-trino
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: trino
spec:
  selector:
    {{- include "baleia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: trino
  ports:
    {{- if include "baleia.trinoAuth" . }}
    - { name: https, port: 8443, targetPort: https }
    {{- else }}
    - { name: http, port: 8080, targetPort: http }
    {{- end }}
{{- if and (include "baleia.dataPolicies" .) .Values.trino.dataPolicies.persistence.enabled }}
---
# OPA's last activated data bundle (persist: true, ADR 0028).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "baleia.fullname" . }}-trino-opa
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: trino
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.trino.dataPolicies.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.trino.dataPolicies.persistence.size }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "baleia.fullname" . }}-api
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "baleia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "baleia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- include "baleia.podSecurityContext" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "baleia.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/api"]
          {{- include "baleia.containerSecurityContext" . | nindent 10 }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            {{- range $key, $value := .Values.config }}
            {{- if or $value (ne $key "BALEIA_TRINO_CA_FILE") }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "baleia.fullname" $ }}-config
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            {{- include "baleia.trinoCAEnv" . | nindent 12 }}
            {{- include "baleia.secretEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "baleia.trinoCAMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "baleia.trinoCAVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "baleia.fullname" . }}-api
  labels:
    {{- include "baleia.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "baleia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
# Baleia Helm values.
# Secrets keys when secrets.create is true or existingSecret is set:
#   JWT_SECRET, BALEIA_ENCRYPTION_KEY (>= 32 chars, differs from JWT_SECRET),
#   BALEIA_ENCRYPTION_KEY_PREVIOUS (rotation only), DATABASE_URL, BALEIA_TRINO_DB_PASSWORD,
#   BALEIA_REGISTRY_KEY (Phase B registry encryption, >= 32 chars, differs from
#   JWT_SECRET and BALEIA_ENCRYPTION_KEY), BALEIA_REGISTRY_KEY_PREVIOUS (rotation only),
#   S3_ACCESS_KEY, S3_SECRET_KEY, SMTP_PASSWORD (optional),
#   BALEIA_TRINO_PASSWORD (optional: the password of config.BALEIA_TRINO_ADMIN_USER
#   on an authenticated Trino; needs an https TRINO_URL)

image:
  # Single image containing /api, /worker and /migrate (see Dockerfile).
  repository: ghcr.io/maltzsama/baleia
  fullImageName: ""
  tag: ""                 # default: .Chart.AppVersion
  pullPolicy: IfNotPresent

# Name of an existing Secret with the keys above. Required unless secrets.create.
existingSecret: ""

secrets:
  create: false           # dev only: generate in-chart Secret from `values`
  values: {}

# Environment variables surfaced as a ConfigMap (env, not secrets).
config:
  # Lowest level the api and worker log, as JSON lines (debug, info, warn, error).
  BALEIA_LOG_LEVEL: info
  PUBLIC_URL: ""
  TEMPORAL_HOST: ""       # default: temporal.<namespace>.svc:7233
  TRINO_URL: ""           # empty + trino.enabled -> in-chart service
  POLARIS_URL: ""         # default: http://baleia-polaris.<namespace>.svc:8181
  S3_ENDPOINT: ""
  S3_BUCKET: baleia-results
  S3_REGION: ""           # signing region; required by e.g. Oracle Object Storage
  S3_USE_SSL: "false"
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_FROM: ""
  # Execution limits (api and worker). Defaults match the binary's own.
  BALEIA_STATEMENT_TIMEOUT: "30m"
  BALEIA_EXECUTION_TIMEOUT: "2h"
  BALEIA_WORKLOAD_ENABLED: "false"
  BALEIA_METADATA_SYNC_INTERVAL: "15m"
  BALEIA_RESULT_MAX_ROWS: "1000000"
  BALEIA_RESULT_MAX_BYTES: "536870912"
  # Trino identity that may manage catalogs. One value: Baleia's DDL emitter
  # runs as it and the chart's catalog guard lists it as the only admin user.
  BALEIA_TRINO_ADMIN_USER: baleia_admin
  # Network safety for connections (docs/adr/0011). The dialer hardcodes no
  # ranges: what is denied or allowed is the deployer's policy. The defaults
  # below refuse only loopback and the "this network" addresses; cloud-metadata
  # ranges (e.g. 169.254.0.0/16 on OKE/AWS) are deliberately left out so each
  # deployment opts in per environment. ALLOW_CIDRS, when set, is the only
  # space that may be dialed.
  BALEIA_CONNECTIONS_DENY_CIDRS: "127.0.0.0/8,::1/128,0.0.0.0/8,::/128"
  BALEIA_CONNECTIONS_ALLOW_CIDRS: ""   # if set, only these may be dialed
  BALEIA_CONNECTIONS_CREATE: admins     # or everyone: any member creates and edits connections
  # Let a Glue connection use an http:// endpoint override (a local emulator).
  # External AWS Glue is always https and never needs it.
  BALEIA_GLUE_ALLOW_INSECURE_ENDPOINT: "false"

# Extra volumes and mounts for the API and worker pods, e.g. the Secret or
# ConfigMap holding the PEM bundle that config.BALEIA_TRINO_CA_FILE points at:
#   extraVolumes:
#     - name: trino-ca
#       secret: { secretName: trino-ca }
#   extraVolumeMounts:
#     - { name: trino-ca, mountPath: /etc/baleia/trino-ca, readOnly: true }
#   config.BALEIA_TRINO_CA_FILE: /etc/baleia/trino-ca/ca.crt
extraVolumes: []
extraVolumeMounts: []

api:
  replicas: 1
  resources: {}
  port: 8080

worker:
  replicas: 1
  resources: {}
  healthPort: 8081
  # /metrics (Temporal SDK, pool, build) and /healthz for Prometheus (#87).
  metricsPort: 9090

migrate:
  enabled: true

# Trino (PR3): official image + plugin init container.
trino:
  enabled: false
  image:
    repository: docker.io/trinodb/trino
    tag: "484"
  plugin:
    version: ""           # required when trino.enabled (and plugin.image unset)
    url: ""               # default: GitHub release URL built from version
    image: ""             # optional small image with /baleia-catalog-store (air-gapped)
    imagePullPolicy: ""
  # psql image for the wait-for-registry init container, which waits until the
  # catalog registry is readable.
  waitImage: docker.io/library/postgres:18
  # Maximum heap of the coordinator (-Xmx), e.g. "4G". Empty keeps the image's
  # default, a percentage of the container's memory limit (80%), or of the
  # node's memory when trino.resources sets no limit. Leave room above the heap
  # for the code cache, metaspace, direct buffers and the Parquet readers: with
  # a limit set, keep the heap at most about 75% of it.
  jvmHeap: ""
  # Phase B (#200): when true, the Trino plugin decrypts @baleia-enc[...]
  # registry values. Requires secrets.values.BALEIA_REGISTRY_KEY (or an
  # existing secret carrying that key) and a plugin release that supports it.
  registryEncryption: false
  awsRegion: us-east-1    # set explicitly: S3 region auto-detection hangs without EC2 metadata
  # Query events (#406): the in-chart Trino pushes each completed query to
  # the API, which records it at once with full statistics. Requires
  # secrets.values.BALEIA_TRINO_EVENTS_TOKEN (32+ characters). The 30s
  # poller keeps running and repairs drift.
  queryEvents:
    enabled: false
  # Authentication of the in-chart Trino (#647). The coordinator serves HTTPS
  # only to clients and logs in Baleia with secrets.values.BALEIA_TRINO_PASSWORD
  # (the password of config.BALEIA_TRINO_ADMIN_USER, required). File-based
  # rules let only that login impersonate other identities, and the catalog
  # guard keeps catalog management to the authenticated admin. The chart
  # generates a CA and a certificate, kept across upgrades, unless
  # tls.existingSecret names a Secret with tls.crt, tls.key and ca.crt; the API
  # and worker trust ca.crt.
  auth:
    enabled: true
    tls:
      existingSecret: ""
  catalogGuard:
    # Only for auth.enabled=false: the guard then cannot verify who claims the
    # admin identity, and true lets ANY client that reaches the coordinator
    # manage catalogs. Ignored while auth is enabled.
    allowUnauthenticatedAdmin: false
  # Restrict ingress to the coordinator to the Baleia API and worker (#645).
  # It only takes effect when the cluster's CNI enforces NetworkPolicy; it is
  # defense in depth, not authentication (#644). Add peers that must reach
  # Trino, e.g. a metrics scraper, as NetworkPolicy "from" entries.
  networkPolicy:
    enabled: true
    extraIngressFrom: []
  resources: {}
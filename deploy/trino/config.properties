coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=dynamic
catalog.store=baleia
# The catalog guard is stacked on a permissive base: only baleia.admin-users may
# manage catalogs, nobody may impersonate them, and sessions carrying
# baleia.mode=readonly are denied every write. Order matters: base first.
access-control.config-files=/etc/trino/baleia-base-access-control.properties,/etc/trino/baleia-catalog-guard.properties
# Clients reach the coordinator over HTTPS with a password (#647); plain HTTP
# refuses them and stays for /v1/info and the node's own traffic. The keystore
# and the password file are written by trino-auth-init.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/auth/keystore.pem
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}

# Trino's database resource group manager (#599, A-5.2). Baleia writes the
# generated resource-groups.json into the `resource_groups` and `selectors`
# tables of the same Postgres, and Trino reloads them every second without a
# restart. The password is injected at boot via Airlift's secrets resolver, so
# it never touches a committed file. The `environment` column Baleia writes
# must match node.environment (the Trino default is "production").
resource-groups.configuration-manager=db
resource-groups.config-db-url=jdbc:postgresql://postgres:5432/baleia
resource-groups.config-db-user=baleia_trino
resource-groups.config-db-password=${ENV:BALEIA_TRINO_DB_PASSWORD}

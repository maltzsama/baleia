# Base access control the catalog guard is stacked on (#647). File-based
# rules: only Baleia's login (BALEIA_TRINO_ADMIN_USER) may impersonate other
# identities, and catalogs stay fully open ("owner", which CREATE/DROP CATALOG
# needs); the guard then keeps catalog management to the admin and enforces
# read-only sessions. Replace baleia-rules.json with your own rules to add
# table/schema restrictions, keeping the impersonation rule.
access-control.name=file
security.config-file=/etc/trino/baleia-rules.json

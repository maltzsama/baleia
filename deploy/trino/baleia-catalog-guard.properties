# Operator-facing access-control file for the Baleia catalog guard.
#
# To stack the guard with your own access control, list this file in Trino's
# `config.properties`:
#
#   access-control.config-files=etc/my-access-control.properties,etc/baleia-catalog-guard.properties
#
# The factory (BaleiaCatalogGuardFactory) is selected by `access-control.name`.
# `baleia.admin-users` is a comma-separated list and is REQUIRED: identities
# outside it are denied catalog management and may not impersonate an admin
# user. Sessions carrying the extra credential `baleia.mode=readonly` are
# denied every write/DDL check (see docs/spi-483.md for the inventory).
access-control.name=baleia-catalog-guard
baleia.admin-users=baleia_admin

# Baleia's Trino has no authentication, so the admin identity arrives without an
# authenticated principal and the guard cannot verify who claims it. With this
# flag ANY client that reaches the coordinator may connect as an admin user and
# run CREATE/DROP CATALOG. Enable it only when Trino is reachable from the API
# and worker alone (private network). Compose enables it; the Helm chart sets it
# from trino.catalogGuard.allowUnauthenticatedAdmin (default false).
# Requires plugin >= 0.7.1.
baleia.allow-unauthenticated-admin=true

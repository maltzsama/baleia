polaris.realm-context.realms=POLARIS
polaris.persistence.type=in-memory
polaris.readiness.ignore-severe-issues=true
polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true
polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE"]

# Root keeps Polaris-issued tokens; users come from Keycloak.
polaris.authentication.type=mixed
# Q8: no principal entities; principal roles come from the token.
polaris.authentication.credential-mode=external
quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=http://keycloak.opa-spike.svc.cluster.local:8080/realms/baleia
quarkus.oidc.application-type=service
# The claim Keycloak sets only on tokens issued to Baleia's client.
quarkus.oidc.roles.role-claim-path=polaris_roles
polaris.oidc.principal-mapper.name-claim-path=preferred_username

polaris.authorization.type=opa
polaris.authorization.opa.policy-uri=http://localhost:8191/v1/data/polaris/authz

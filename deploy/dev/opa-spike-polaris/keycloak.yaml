apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2
          # A fixed hostname, so tokens fetched through a port-forward carry the
          # issuer Polaris validates.
          args: ["start-dev", "--import-realm", "--hostname=http://keycloak.opa-spike.svc.cluster.local:8080", "--health-enabled=true"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
          ports:
            - { containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 3
          resources:
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - { name: realm, configMap: { name: keycloak-realm } }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - { port: 8080 }

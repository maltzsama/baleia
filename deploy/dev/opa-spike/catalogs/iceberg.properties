connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=spike
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=spike
iceberg.jdbc-catalog.connection-password=spike
iceberg.jdbc-catalog.default-warehouse-dir=s3://spike/warehouse
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=rustfsadmin
s3.aws-secret-key=rustfsadmin

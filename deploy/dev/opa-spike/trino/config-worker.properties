# The worker carries the same access controls; its own OPA counts any call.
coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-opa-discovery:8080
catalog.management=dynamic
access-control.config-files=/etc/trino/baleia-base-access-control.properties,/etc/trino/baleia-catalog-guard.properties,/etc/trino/opa-batched.properties
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}

# Source database for provider and dialect tests (#11, #14); not part of the
# dev stack. kubectl apply -f deploy/dev/sources/mysql.yaml (make k8s-source NAME=mysql).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-mysql
  namespace: baleia-dev
  labels: { app: src-mysql, baleia/role: source }
spec:
  replicas: 1
  selector:
    matchLabels: { app: src-mysql }
  template:
    metadata:
      labels: { app: src-mysql, baleia/role: source }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: baleia_dev }
            # The store suite logs in as root from the host, as in CI.
            - { name: MYSQL_ROOT_HOST, value: "%" }
---
apiVersion: v1
kind: Service
metadata:
  name: src-mysql
  namespace: baleia-dev
spec:
  # A NodePort lets the store suite reach the database directly at
  # $(minikube -p baleia ip):30306. Through kubectl port-forward every
  # statement pays a round trip through the API server, and one migrated test
  # database takes over ten times longer.
  type: NodePort
  selector: { app: src-mysql }
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306

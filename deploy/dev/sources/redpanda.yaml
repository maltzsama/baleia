# Redpanda source for the Kafka provider's e2e (#1064); not part of the dev
# stack. kubectl apply -f deploy/dev/sources/redpanda.yaml (make k8s-source
# NAME=redpanda).
#
# One Redpanda broker speaking the Kafka protocol, advertised under its Service
# name so the Trino coordinator and workers reach it. The data directory is an
# emptyDir, so a container restart keeps the topics, and topics are never
# created by a read. The seed Job leaves the e2e_orders topic with exactly
# three JSON messages and no retention limit: it writes them into an empty
# topic, recreates a topic left with any other count, and does nothing to a
# complete one, so it can run again at any time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-redpanda
  namespace: baleia-dev
  labels: { app: src-redpanda, baleia/role: source }
spec:
  replicas: 1
  # One broker: an update replaces it, never runs two side by side.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: src-redpanda }
  template:
    metadata:
      labels: { app: src-redpanda, baleia/role: source }
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --overprovisioned
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://src-redpanda.baleia-dev.svc.cluster.local:9092
            - --set
            - redpanda.auto_create_topics_enabled=false
          ports:
            - containerPort: 9092
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: src-redpanda
  namespace: baleia-dev
spec:
  selector: { app: src-redpanda }
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: batch/v1
kind: Job
metadata:
  name: src-redpanda-seed
  namespace: baleia-dev
  labels: { app: src-redpanda-seed, baleia/role: source }
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: { app: src-redpanda-seed, baleia/role: source }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
          command:
            - /bin/bash
            - -ec
            - |
              export RPK_BROKERS=src-redpanda.baleia-dev.svc.cluster.local:9092
              until rpk cluster info >/dev/null 2>&1; do sleep 2; done
              create() { rpk topic create e2e_orders -p 1 -r 1 -c retention.ms=-1; }
              # Retained messages of the topic's one partition: its high
              # watermark minus its log start offset. Anything but exactly one
              # partition row fails, and the Job retries.
              count() {
                rpk topic describe e2e_orders -p | awk '
                  NR == 1 { for (i = 1; i <= NF; i++) col[$i] = i; next }
                  { rows++; start = $col["LOG-START-OFFSET"]; end = $col["HIGH-WATERMARK"] }
                  END {
                    if (rows != 1 || start !~ /^[0-9]+$/ || end !~ /^[0-9]+$/) exit 1
                    print end - start
                  }'
              }
              if ! rpk topic list | awk 'NR > 1 { print $1 }' | grep -qx e2e_orders; then
                create
              fi
              n=$(count)
              if [ "$n" -eq 3 ]; then
                echo "e2e_orders holds its 3 messages; nothing to seed"
                exit 0
              fi
              if [ "$n" -ne 0 ]; then
                echo "e2e_orders holds $n messages; recreating it"
                rpk topic delete e2e_orders
                create
              fi
              printf '%s\n' \
                '{"id":1,"item":"book","amount":12.5}' \
                '{"id":2,"item":"pen","amount":1.2}' \
                '{"id":3,"item":"lamp","amount":30}' \
                | rpk topic produce e2e_orders
              n=$(count)
              if [ "$n" -ne 3 ]; then
                echo "e2e_orders holds $n messages after seeding, want 3" >&2
                exit 1
              fi
              echo "seeded e2e_orders"

# Source database for provider and dialect tests (#11, #14); not part of the
# dev stack. kubectl apply -f deploy/dev/sources/sqlserver.yaml (make k8s-source NAME=sqlserver).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-sqlserver
  namespace: baleia-dev
  labels: { app: src-sqlserver, baleia/role: source }
spec:
  replicas: 1
  selector:
    matchLabels: { app: src-sqlserver }
  template:
    metadata:
      labels: { app: src-sqlserver, baleia/role: source }
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_SA_PASSWORD, value: Baleia_dev_2026 }
---
apiVersion: v1
kind: Service
metadata:
  name: src-sqlserver
  namespace: baleia-dev
spec:
  selector: { app: src-sqlserver }
  ports:
    - port: 1433
      targetPort: 1433

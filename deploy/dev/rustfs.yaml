apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rustfs-data }
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: { app: rustfs }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: admin, port: 9001, targetPort: 9001 }
---
# Creates the baleia bucket once. Safe to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: amazon/aws-cli:latest
          env:
            - { name: AWS_ACCESS_KEY_ID, value: rustfsadmin }
            - { name: AWS_SECRET_ACCESS_KEY, value: rustfsadmin }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
          command: ["/bin/sh", "-c"]
          args:
            - |
              until aws s3api --endpoint-url http://rustfs:9000 list-buckets >/dev/null 2>&1; do sleep 2; done
              aws s3 mb s3://baleia --endpoint-url http://rustfs:9000 --region us-east-1

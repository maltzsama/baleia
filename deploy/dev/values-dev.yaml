# Dev values for a minikube-local deployment of the baleia chart.
# The image is built into minikube with `minikube image build -t baleia:dev .`.
image:
  repository: baleia
  tag: dev
  pullPolicy: Never

secrets:
  create: true
  values:
    JWT_SECRET: dev-secret-not-for-production-123456
    DATABASE_URL: "postgresql://baleia:baleia@postgres.baleia-dev.svc:5432/baleia?sslmode=disable"
    BALEIA_TRINO_DB_PASSWORD: admin
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfsadmin

config:
  PUBLIC_URL: http://localhost:8080
  TEMPORAL_HOST: temporal.baleia-dev.svc:7233
  TRINO_URL: ""
  POLARIS_URL: http://polaris.baleia-dev.svc:8181
  S3_ENDPOINT: rustfs.baleia-dev.svc:9000
  S3_BUCKET: baleia
  S3_USE_SSL: "false"
  SMTP_HOST: mailpit.baleia-dev.svc
  SMTP_PORT: "1025"
  SMTP_FROM: noreply@baleia.io

api:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }

migrate:
  enabled: true

# Trino is wired in PR3 of #64 (plugin init container + official image).
trino:
  enabled: false
# Dev values for a minikube-local deployment of the baleia chart.
# The image is built into minikube with `minikube image build -t baleia:dev .`.
image:
  repository: baleia
  tag: dev
  pullPolicy: Never

secrets:
  create: true
  values:
    JWT_SECRET: dev-secret-not-for-production-123456
    BALEIA_ENCRYPTION_KEY: dev-encryption-key-not-for-production-0123
    DATABASE_URL: "postgresql://baleia:baleia@postgres.baleia-dev.svc:5432/baleia?sslmode=disable"
    BALEIA_TRINO_DB_PASSWORD: admin
    BALEIA_TRINO_PASSWORD: dev-trino-password-not-for-production
    BALEIA_BI_GATEWAY_SECRET: dev-bi-gateway-secret-not-for-production-0123456789
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfsadmin

config:
  PUBLIC_URL: http://localhost:8080
  TEMPORAL_HOST: temporal.baleia-dev.svc:7233
  TRINO_URL: ""
  POLARIS_URL: http://polaris.baleia-dev.svc:8181
  S3_ENDPOINT: rustfs.baleia-dev.svc:9000
  S3_BUCKET: baleia
  S3_USE_SSL: "false"
  BALEIA_REDIS_URL: redis://redis.baleia-dev.svc:6379/0
  SMTP_HOST: mailpit.baleia-dev.svc
  SMTP_PORT: "1025"
  SMTP_FROM: noreply@baleia.io
  BALEIA_AGENTS_ENABLED: "true"
  BALEIA_WORKLOAD_ENABLED: "true"
  # Cold offload and gated retention (ADR 0024). The dev cluster reuses the
  # rustfs bucket with per-stream prefixes; the e2e suite exercises the
  # offload and the retention it gates.
  BALEIA_AUDIT_COLD_BUCKET: baleia
  BALEIA_AUDIT_COLD_PREFIX: audit-cold
  BALEIA_QUERY_HISTORY_COLD_BUCKET: baleia
  BALEIA_QUERY_HISTORY_COLD_PREFIX: query-history-cold

api:
  # Two replicas so the BI e2e proves a nextUri signed by one pod is followed
  # on another (the gateway keeps no per-query state).
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }

# BI gateway (ADR 0017): the Trino JDBC e2e drives the protocol through it.
# `make e2e-forward` forwards the Service to localhost:8443; `make e2e-bi`
# terminates TLS on localhost:8444 (the JDBC driver refuses Basic over plain
# HTTP), and the public URL is that edge the BI tool sees.
biGateway:
  enabled: true
  publicURL: https://localhost:8444

worker:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }

migrate:
  enabled: true

# Trino (official image + plugin init container) wired by PR 3 of #64.
trino:
  enabled: true
  image:
    repository: docker.io/trinodb/trino
    tag: "484"
  plugin:
    version: "0.10.2"              # baleia-trino-catalog-store release
    image: "baleia-plugins:0.10.2"  # built by `make k8s-plugin-bundle`; tag = plugin release version
    imagePullPolicy: Never
  # jvmHeap is unset: the image's jvm.config gives the heap 80% of the memory
  # limit. Code cache, metaspace, direct buffers and the Parquet readers come
  # on top of it: at 2Gi the pod was OOMKilled reading a table (#665).
  resources:
    requests: { cpu: 500m, memory: 3Gi }
    limits: { memory: 6Gi }